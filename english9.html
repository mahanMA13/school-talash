<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ============================================================
   ماژول آموزشی زبان انگلیسی پایه نهم — استایل مستقل (eng9-*)
   سبک هماهنگ با ماژول نمونه (ریاضی نهم)
   ============================================================ */
#eng9-module{
  --eng9-bg:#f5f7fb; --eng9-surface:#fff; --eng9-surface2:#eef2f7;
  --eng9-text:#172033; --eng9-muted:#647084;
  --eng9-primary:#5b5cf0; --eng9-primary2:#7b61ff;
  --eng9-good:#18a46a; --eng9-bad:#df4b58;
  --eng9-border:#dde3ed;
  --eng9-shadow:0 12px 35px rgba(25,35,55,.08);
  --eng9-progress:0%;
  font-family:"Vazirmatn",Tahoma,Arial,sans-serif;
  background:var(--eng9-bg); color:var(--eng9-text);
  line-height:1.9; direction:rtl; text-align:right;
  min-height:100vh;
}
#eng9-module *{box-sizing:border-box}
#eng9-module.dark{
  --eng9-bg:#0d1119; --eng9-surface:#151b26; --eng9-surface2:#202938;
  --eng9-text:#edf1f7; --eng9-muted:#a4afbf; --eng9-border:#293344;
  --eng9-shadow:0 12px 35px rgba(0,0,0,.22);
}
#eng9-module a{text-decoration:none;color:inherit}
#eng9-module p{margin:8px 0}

/* ---------- نوار بالای ماژول ---------- */
.eng9-topbar{height:72px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:24px;padding:0 5%;background:var(--eng9-surface);background:color-mix(in srgb,var(--eng9-surface) 92%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--eng9-border)}
.eng9-brand{display:flex;align-items:center;gap:10px;min-width:175px}
.eng9-brand-logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--eng9-primary),var(--eng9-primary2));color:#fff;font-weight:800;font-size:17px;box-shadow:0 7px 18px rgba(27,45,85,.25);border:1px solid var(--eng9-border)}
.eng9-brand small{display:block;color:var(--eng9-muted);font-size:11px}
.eng9-nav{display:flex;gap:4px;flex:1;justify-content:center}
.eng9-nav a{padding:8px 11px;border-radius:10px;color:var(--eng9-muted);font-size:14px}
.eng9-nav a:hover{background:var(--eng9-surface2);color:var(--eng9-text)}
.eng9-nav a.active{background:var(--eng9-surface2);color:var(--eng9-primary)}
.eng9-actions{display:flex;gap:7px}
.eng9-actions button,.eng9-mobile-only{border:1px solid var(--eng9-border);background:var(--eng9-surface);color:var(--eng9-text);border-radius:10px;width:40px;height:40px;cursor:pointer;font-size:16px}
.eng9-mobile-only{display:none}

/* ---------- هیرو ---------- */
.eng9-hero{padding:70px 5% 45px;background:radial-gradient(circle at 85% 15%,#7b61ff22,transparent 35%),radial-gradient(circle at 15% 10%,#5b5cf018,transparent 30%)}
.eng9-hero-grid{max-width:1180px;margin:auto;display:grid;grid-template-columns:1.35fr .65fr;gap:40px;align-items:center}
.eng9-eyebrow{display:inline-block;padding:5px 11px;border-radius:99px;background:#5b5cf012;color:var(--eng9-primary);font-size:12px;font-weight:bold}
.eng9-hero h1{font-size:clamp(32px,5vw,58px);line-height:1.2;margin:15px 0}
.eng9-hero h1 span{color:var(--eng9-primary)}
.eng9-hero .eng9-lead{color:var(--eng9-muted);max-width:690px;font-size:17px}
.eng9-hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}
.eng9-btn{border:0;border-radius:12px;padding:11px 18px;cursor:pointer;font:inherit;font-weight:bold;background:var(--eng9-primary);color:#fff;display:inline-block}
.eng9-btn:hover{filter:brightness(1.07)}
.eng9-btn.secondary{background:var(--eng9-surface);color:var(--eng9-text);border:1px solid var(--eng9-border)}
.eng9-progress-card{background:var(--eng9-surface);border:1px solid var(--eng9-border);padding:25px;border-radius:24px;box-shadow:var(--eng9-shadow)}
.eng9-progress-ring{width:150px;height:150px;margin:auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--eng9-primary) var(--eng9-progress,0%),var(--eng9-surface2) 0)}
.eng9-progress-ring>div{width:116px;height:116px;border-radius:50%;background:var(--eng9-surface);display:grid;place-items:center;font-size:27px;font-weight:bold}

/* ---------- بخش‌ها و کارت‌ها ---------- */
.eng9-section{max-width:1180px;margin:0 auto;padding:45px 5%}
.eng9-section-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px;flex-wrap:wrap}
.eng9-section h2{margin:0;font-size:29px}
.eng9-muted{color:var(--eng9-muted)}
.eng9-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.eng9-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.eng9-card{background:var(--eng9-surface);border:1px solid var(--eng9-border);border-radius:19px;padding:19px;box-shadow:var(--eng9-shadow);transition:.2s}
.eng9-card:hover{transform:translateY(-3px)}
.eng9-lesson-card{min-height:190px;position:relative;overflow:hidden;display:block}
.eng9-chapter-num{font-size:12px;color:var(--eng9-primary);font-weight:bold}
.eng9-chapter-icon{position:absolute;left:15px;top:13px;font-size:42px;opacity:.14}
.eng9-lesson-card h3{margin:35px 0 5px}
.eng9-done-badge{position:absolute;top:14px;right:14px;background:var(--eng9-good);color:#fff;border-radius:99px;font-size:11px;font-weight:bold;padding:3px 10px}
.eng9-tags{display:flex;gap:6px;flex-wrap:wrap}
.eng9-tag{font-size:11px;background:var(--eng9-surface2);padding:3px 8px;border-radius:99px;color:var(--eng9-muted)}
.eng9-tag.src-book{background:#5b5cf012;color:var(--eng9-primary)}
.eng9-tag.src-wb{background:#18a46a18;color:var(--eng9-good)}
.eng9-tag.src-q{background:#f59e0b0c;color:#b45309}
.eng9-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.eng9-stat{padding:17px;background:var(--eng9-surface2);border-radius:15px}
.eng9-stat b{display:block;font-size:25px}

/* ---------- تب‌های درس ---------- */
.eng9-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px;position:sticky;top:72px;z-index:10;background:var(--eng9-bg);padding:10px 0;border-bottom:1px solid var(--eng9-border)}
.eng9-tab{border:1px solid var(--eng9-border);background:var(--eng9-surface);color:var(--eng9-muted);border-radius:12px;padding:8px 14px;cursor:pointer;font:inherit;font-size:14px;font-weight:600;transition:.15s}
.eng9-tab:hover{border-color:var(--eng9-primary);color:var(--eng9-primary)}
.eng9-tab.active{background:var(--eng9-primary);border-color:var(--eng9-primary);color:#fff}
.eng9-panel{animation:eng9fade .25s ease}
@keyframes eng9fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- جعبه‌های آموزشی ---------- */
.eng9-rule{padding:14px 16px;border-radius:16px;background:var(--eng9-surface2);border-right:4px solid var(--eng9-primary);margin:10px 0 16px}
.eng9-rule p{margin:6px 0 0;line-height:2}
.eng9-exbox{background:#5b5cf00c;border-right:4px solid var(--eng9-primary);padding:12px 16px;margin:10px 0;border-radius:9px}
.eng9-exbox .eng9-en{direction:ltr;text-align:left;font-family:Arial,sans-serif;font-weight:600}
.eng9-exbox .eng9-fa{color:var(--eng9-muted);font-size:14px;margin-top:2px}
.eng9-formula{background:#5b5cf00c;border-right:4px solid var(--eng9-primary);padding:12px 16px;margin:10px 0;border-radius:9px;font-family:Arial,sans-serif;direction:ltr;text-align:left}
.eng9-example{background:#18a46a0b;border-right:4px solid var(--eng9-good);padding:14px;border-radius:10px}
.eng9-tip{background:#f59e0b0c;border-right:4px solid #f59e0b;padding:14px;border-radius:10px}
.eng9-warn{background:#df4b5818;border-right:4px solid var(--eng9-bad);padding:12px 14px;border-radius:10px;font-size:14px}
.eng9-h4{margin:22px 0 8px;font-size:17px}
.eng9-tbl-wrap{overflow:auto;border:1px solid var(--eng9-border);border-radius:14px;margin:10px 0}
.eng9-tbl{width:100%;border-collapse:collapse;background:var(--eng9-surface);font-size:15px;min-width:480px}
.eng9-tbl th{background:var(--eng9-surface2);padding:10px 12px;text-align:right;font-size:13px;color:var(--eng9-muted)}
.eng9-tbl td{padding:9px 12px;border-top:1px solid var(--eng9-border)}
.eng9-tbl .eng9-ltr{direction:ltr;text-align:left;font-family:Arial,sans-serif;font-weight:600;white-space:nowrap}

/* ---------- مکالمه (حباب گفت‌وگو) ---------- */
.eng9-chat{display:grid;gap:10px;margin:14px 0}
.eng9-msg{max-width:82%;border:1px solid var(--eng9-border);border-radius:16px;padding:10px 15px;background:var(--eng9-surface);box-shadow:var(--eng9-shadow)}
.eng9-msg.a{margin-inline-end:auto;border-start-end-radius:4px}
.eng9-msg.b{margin-inline-start:auto;background:#5b5cf00c;border-start-start-radius:4px}
.eng9-msg-name{font-size:12px;color:var(--eng9-primary);font-weight:800}
.eng9-msg-en{direction:ltr;text-align:left;font-family:Arial,sans-serif;font-weight:600}
.eng9-msg-fa{color:var(--eng9-muted);font-size:14px;border-top:1px dashed var(--eng9-border);margin-top:6px;padding-top:6px}

/* ---------- سؤال‌ها و پاسخ ---------- */
.eng9-qcard{margin-bottom:13px}
.eng9-options{display:grid;gap:8px;margin-top:12px}
.eng9-option{padding:12px 14px;border:2px solid var(--eng9-border);background:var(--eng9-surface2);color:var(--eng9-text);border-radius:10px;cursor:pointer;text-align:right;font:inherit;font-weight:600;transition:.15s;direction:ltr;text-align:left;font-family:Arial,sans-serif}
.eng9-option:hover{border-color:var(--eng9-primary);background:var(--eng9-surface)}
.eng9-option.selected{border-color:var(--eng9-primary);background:#5b5cf01c}
.eng9-option.correct{border-color:var(--eng9-good);background:#18a46a18}
.eng9-option.wrong{border-color:var(--eng9-bad);background:#df4b5818}
.eng9-option:disabled{opacity:1}
.eng9-result{padding:14px;border-radius:12px;background:var(--eng9-surface2);margin-top:15px}
.eng9-acc-btn{border:1px solid var(--eng9-border);background:var(--eng9-surface2);color:var(--eng9-text);border-radius:10px;padding:8px 14px;cursor:pointer;font:inherit;font-size:13px;font-weight:700;margin-top:10px}
.eng9-acc-btn:hover{border-color:var(--eng9-primary);color:var(--eng9-primary)}
.eng9-acc-body[hidden]{display:none}

/* ---------- ابزارها ---------- */
.eng9-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0;align-items:center}
.eng9-select{padding:10px;border:1px solid var(--eng9-border);border-radius:10px;background:var(--eng9-surface);color:var(--eng9-text);font:inherit}
.eng9-searchbar{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.eng9-searchbar input{flex:1;min-width:200px;padding:13px 15px;border:1px solid var(--eng9-border);background:var(--eng9-surface);color:var(--eng9-text);border-radius:12px;font:inherit;outline:none}
.eng9-searchbar input:focus{border-color:var(--eng9-primary)}
.eng9-pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:25px}

/* ---------- فلش‌کارت واژگان ---------- */
.eng9-flash{max-width:460px;margin:18px auto;text-align:center;padding:34px 22px;border-radius:19px;border:2px solid var(--eng9-border);background:var(--eng9-surface);box-shadow:var(--eng9-shadow);cursor:pointer;min-height:180px;display:flex;flex-direction:column;justify-content:center;gap:10px;transition:.2s;user-select:none}
.eng9-flash:hover{border-color:var(--eng9-primary);transform:translateY(-3px)}
.eng9-flash .eng9-f-en{font-size:32px;font-weight:800;direction:ltr;font-family:Arial,sans-serif}
.eng9-flash .eng9-f-fa{font-size:21px;color:var(--eng9-primary);font-weight:800;visibility:hidden}
.eng9-flash.flipped .eng9-f-fa{visibility:visible}
.eng9-flash .eng9-f-hint{font-size:12px;color:var(--eng9-muted)}

/* ---------- فوتر و دکمه بالا ---------- */
.eng9-footer{padding:35px 5%;margin-top:35px;border-top:1px solid var(--eng9-border);display:flex;justify-content:space-between;gap:20px;color:var(--eng9-muted);flex-wrap:wrap}
.eng9-to-top{position:fixed;bottom:20px;left:20px;border:0;border-radius:12px;width:43px;height:43px;background:var(--eng9-primary);color:#fff;cursor:pointer;display:none;z-index:30;font-size:16px}
.eng9-to-top.show{display:block}

/* ---------- واکنش‌گرا ---------- */
@media(max-width:900px){
  .eng9-topbar .eng9-nav{display:none}
  .eng9-topbar .eng9-nav.eng9-open{display:flex;position:absolute;top:72px;right:0;left:0;padding:10px 4%;background:var(--eng9-surface);border-bottom:1px solid var(--eng9-border);flex-wrap:wrap}
  .eng9-mobile-only{display:block}
  .eng9-hero-grid{grid-template-columns:1fr}
  .eng9-grid{grid-template-columns:repeat(2,1fr)}
  .eng9-grid3{grid-template-columns:repeat(2,1fr)}
  .eng9-stats{grid-template-columns:repeat(2,1fr)}
  .eng9-hero{padding-top:45px}
  .eng9-tabs{top:72px}
}
@media(max-width:600px){
  .eng9-grid,.eng9-grid3,.eng9-stats{grid-template-columns:1fr}
  .eng9-topbar{padding:0 4%;gap:10px}
  .eng9-brand{min-width:0}
  .eng9-brand small{display:none}
  .eng9-hero,.eng9-section{padding-left:4%;padding-right:4%}
  .eng9-hero h1{font-size:34px}
  .eng9-footer{flex-direction:column}
  .eng9-card{border-radius:15px}
  .eng9-msg{max-width:94%}
}
@media print{
  .eng9-topbar,.eng9-footer,.eng9-to-top,.eng9-hero-actions,.eng9-tabs,.eng9-toolbar,.eng9-acc-btn,.eng9-pager{display:none!important}
  .eng9-section{max-width:none}
  .eng9-card{box-shadow:none}
}
</style>
</head>

      <p>برای نمایش محتوای این ماژول آموزشی، JavaScript مرورگر باید فعال باشد.</p>
      <p>درس‌های این ماژول به ترتیب کتاب عبارت‌اند از: درس ۱ (شخصیت)، درس ۲ (سفر)، درس ۳ (جشن‌ها و مراسم)، درس ۴ (خدمات)، درس ۵ (رسانه) و درس ۶ (سلامتی و آسیب‌ها)؛ هر درس شامل واژگان، گرامر، مکالمه، متن خواندنی، پاسخ تمرین‌های کتاب کار، نکات امتحانی و نمونه‌سؤال است. همچنین واژه‌نامه جامع، پیوست افعال بی‌قاعده و بخش «درباره» در دسترس است.</p>

<script>

window.ENG9_DATA = {
meta:{
  title:"زبان انگلیسی پایه نهم",
  intro:"این ماژول، مرور کامل و درس‌به‌درسِ زبان انگلیسی پایۀ نهم است: واژگان مهم با معنی فارسی، گرامر با توضیح ساده و مثال‌های کتاب، مکالمه‌ها و عبارات کلیدی با ترجمه، متن‌های خواندنی، پاسخ تمرین‌های کتاب کار، نکات امتحانی و نمونه‌سؤال همراه با پاسخ‌نامه.",
  audio:"هر دو کتاب مجموعۀ انگلیسی نهم (Prospect 3) به «کتاب گویا» (فایل صوتی) به‌عنوان بخشی از بستۀ آموزشی ارجاع می‌دهند. دریافت کتاب گویا از وب‌گاه رسمی گروه زبان‌های خارجی دفتر تألیف کتاب‌های درسی: eng-dept.talif.sch.ir — تمرین‌های شنیداری کتاب‌ها به همین فایل صوتی وابسته‌اند و متن صدا در کتاب چاپ نشده است؛ در پاسخ‌نامه‌ها صریحاً مشخص شده‌اند.",
  sources:"برای شفافیت، منبع هر بخش مشخص شده است: «کتاب دانش‌آموز» یعنی محتوا مستقیماً از کتاب دانش‌آموز است، «کتاب کار» یعنی از کتاب کار، و «سؤال تألیفی» یعنی آن سؤال عین سؤال کتاب نیست و فقط بر پایۀ محتوای کتاب برای تمرین ساخته شده است."
},
lessons:[
{
  id:1, icon:"🙂", title:"شخصیت", en:"Personality",
  pages:"کتاب دانش‌آموز: صفحات ۱۵ تا ۲۷ | کتاب کار: صفحات ۸ تا ۲۰",

  exam:[
    "ساختار حال استمراری: am/is/are + فعل + ing؛ یادتان باشد فعل کمکی را فراموش نکنید — غلط رایج در تمرین ویرایش کتاب کار: She is stand به جای She is standing یا Mrs. Kress wearing.",
    "در تمرین ویرایش، ملکی 's برای آدم‌ها (Paul's wife) و of برای اشیاء (the door of the shop) نقطۀ سؤال است.",
    "جملۀ خبری حال استمراری برای «الان» است؛ با قیدهایی مثل now, right now می‌آید.",
    "در پرسش Wh استمراری، کلمۀ پرسشی اول می‌آید: What are you doing now?",
    "لحن پرسش‌های Yes/No خیزانی (بالا می‌رود) و جمله‌های خبری افتانی است — در درس ۱ و ۲ این تمایز مدام تمرین می‌شود.",
    "واژگان سفر (buy a ticket, take off, land, check in, book a hotel...) را با معنی فارسی حفظ کنید؛ در تصویرنامه و تست واژگان می‌آید."
  ],

    {q:"...... they traveling to Shiraz by train?",mcq:["Is","Are","Do","Am"],ans:1,ex:"فاعل جمع (they) در حال استمراری Are می‌گیرد."},

    {q:"شکل ملکی بنویسید: the bag / my sister",wa:["my sister's bag — چون «my sister» اسم جان‌دار است."],ex:"برای اسم جان‌دار از 's استفاده می‌کنیم."},

    en:"Ahmed is from Turkey and he lives in Istanbul. Fitr Eid is an important religious holiday in his country. He likes this day a lot. It's on the first day of Shawwal. On Fitr Eid, Muslims don't fast. They say their Eid prayers before noon. In all Muslim countries people hold the same ceremony.",

    {t:"تمرین ۶ — متن نوروز پیام (کامل کردن با عبارت‌های درس)",src:"کتاب کار، ص ۴۳",body:[],ans:["We go shopping and buy new clothes. We clean our house and wash our carpets. My cousins and I color the eggs. My sister sets the Haft Seen table. On New Year's Day my mother cooks rice with fish. We always visit my grandparents and our relatives. And on Nature Day we go out and play."],ansKind:"پاسخ"},
    {t:"تمرین ۷ — یافتن ۵ کلمه + وصل به فعل‌ها + جمله‌سازی",src:"کتاب کار، ص ۴۴",body:["الف) در این تمرین (برخلاف درس‌های دیگر) جدول حروف وجود ندارد و از شما خواسته می‌شود پنج واژۀ درس را بنویسید؛ نمونه: fireworks, ceremony, national anthem, poems of Hafez, Nature Day"],ans:["ب) وصل کلمه به فعل (پاسخ قطعی): watch → fireworks / hold → a ceremony / bake → a cake / clear → the table / make → lunch (dinner)","پ) جمله‌های نمونه: We watch fireworks on holidays. / They hold a ceremony at school. / My mother bakes a cake. / I clear the table after dinner. / She makes lunch every day."],ansKind:"پاسخ"},
    {t:"تمرین ۸ — ویرایش وب‌لاگ بهارۀ (۶ غلط) + بازنویسی",src:"کتاب کار، ص ۴۵–۴۶",body:[],ans:["people celebrates → celebrate | we cleans → clean our houses | My father give → gives some money | My sister and I always sets → set the Haft Seen Table | we sit around the table and recites → recite the Holy Quran | My mother cook → cooks a special food","الگوی همۀ غلط‌ها یکی است: فعل سوم شخص مفرد بدون s یا فعل غیر سوم شخص با s."],ansKind:"پاسخ"},
    {t:"تمرین ۹ — بله یا خیر؟",src:"کتاب کار، ص ۴۸",body:[],ans:["جمله‌ها دربارۀ زندگی خودِ شماست (پاسخ نظری): 1. بله (در شب یلدا میوه می‌خوریم.) — 2. بله/نظری — 3. نظری — 4. نظری — 5. بله (در تعطیلات به دیدن بستگان می‌رویم.)"],ansKind:"پاسخ نمونه"},
    {t:"تمرین ۱۰ — متن «سولنال» کره: حال ساده + بله/خیر + پرسش‌ها",src:"کتاب کار، ص ۴۹–۵۰",body:[],ans:["الف) فعل‌های حال سادۀ متن: is (×۳) / travel / means / eat / play / don't sleep / are / think / sleep / changes / know / like / stay","ب) بله یا خیر: 1. بله (Koreans visit their families on Solnal.) — 2. بله (بزرگ‌ترهای خانواده مهم‌اند؛ «Sebae» یعنی احترام به آن‌ها.) — 3. بله (برنج‌کیک و نودل می‌خورند؛ پس غذاهای متفاوتی می‌خورند.) — 4. خیر (متن می‌گوید تا نیمه‌شب بیدار می‌مانند؛ پس «همۀ شب» دقیق نیست.) — 5. خیر (بچه‌ها می‌دانند این باور درست نیست: Most children know this is not true.)","پ) پرسش‌ها: 1. It is the Korean New Year (one of Korea's holidays). 2. No, they don't (they eat rice cakes and noodles). 3. No, it doesn't (Solnal = Korean New Year; \"Sebae\" means showing respect). 4. No, they play old games.","ت) نوشتن چند جمله دربارۀ فعالیت‌های شما در یکی از مناسبت‌های اسلامی-ایرانی (نمونه): On Norooz, we set the Haft Seen table. We visit our relatives. My mother cooks special food. We wear new clothes."],ansKind:"پاسخ"}

  exam:[

    "عبارت‌های تبریک: Happy New Year! / Wish you a great holiday!"

    {q:"غلط را پیدا و اصلاح کنید: Does your father works in a bank?",wa:["Does your father work in a bank?"],ex:"بعد از does فعل ساده می‌آید."},

/* ================= منطق ماژول زبان انگلیسی نهم (eng9) ================= */
(function(){
"use strict";
const D=window.ENG9_DATA;
const wrap=document.getElementById("eng9-module");
const app=document.getElementById("eng9-app");
const nav=document.getElementById("eng9-nav");

/* ---------- دسترسی امن به حافظه (اگر مرورگر ذخیره‌سازی را مسدود کند، سایت از کار نمی‌افتد) ---------- */
function sGet(k){try{return window.localStorage.getItem(k)}catch(e){return null}}
function sSet(k,v){try{window.localStorage.setItem(k,v)}catch(e){}}

/* ---------- محافظت: بدون داده یا بدون نقطۀ رندر، پیام خطای مناسب نمایش بده (نه صفحۀ سفید) ---------- */
if(!app){return}
if(!D||!D.lessons){
  app.innerHTML='<div class="eng9-panel" style="margin:24px auto;max-width:640px;text-align:center"><h2>زبان انگلیسی پایه نهم</h2><p>در بارگذاری محتوای ماژول خطایی رخ داد. لطفاً صفحه را دوباره بارگذاری کن.</p><a class="eng9-btn" href="#eng9-home">تلاش دوباره</a></div>';
  return;
}

/* ---------- وضعیت ---------- */
let progress={};
try{progress=JSON.parse(sGet("eng9-progress")||"{}")||{}}catch(e){progress={}}
const S={tabs:{},answered:{},vIdx:0,vFlipped:false,vFlashOn:false,lFlash:{},qSel:"0"};

/* ---------- ابزارها ---------- */
function faNum(n){return String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d])}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function isEn(s){return /^[\x00-\x7F\u200c\s]*$/.test(String(s))&&/[A-Za-z]/.test(String(s))}
function saveP(){sSet("eng9-progress",JSON.stringify(progress));updateRing()}
function updateRing(){
  const done=D.lessons.filter(l=>progress["l"+l.id]).length;
  const pct=Math.round(done/D.lessons.length*100);
  wrap.style.setProperty("--eng9-progress",pct+"%");
  const el=document.getElementById("eng9-pct");if(el)el.textContent=pct+"%";
}
function tbl(t){
  const head=t.head.map(h=>"<th>"+esc(h)+"</th>").join("");
  const rows=t.rows.map(r=>"<tr>"+r.map(c=>{
    const en=isEn(c)?" class=\"eng9-ltr\"":"";
    return "<td"+en+">"+esc(c)+"</td>";
  }).join("")+"</tr>").join("");
  return "<div class=\"eng9-tbl-wrap\"><table class=\"eng9-tbl\"><thead><tr>"+head+"</tr></thead><tbody>"+rows+"</tbody></table></div>";
}
function lessonById(id){return D.lessons.find(x=>x.id===+id)}
function doneBadge(id){return progress["l"+id]?"<span class=\"eng9-done-badge\">✓ خوانده شد</span>":""}
function markBtn(l){
  const done=!!progress["l"+l.id];
  return "<button class=\"eng9-btn"+(done?" secondary":"")+"\" data-act=\"mark\" data-l=\""+l.id+"\">"+(done?"✓ درس تکمیل شده":"علامت‌گذاری به‌عنوان مطالعه‌شده")+"</button>";
}

/* ---------- سازنده‌های محتوا ---------- */
function vocabTableHTML(rows){
  if(!rows.length)return "<p class=\"eng9-muted\">واژه‌ای مطابق جست‌وجو پیدا نشد.</p>";
  const body=rows.map(v=>"<tr><td class=\"eng9-ltr\">"+esc(v.en)+"</td><td>"+esc(v.fa)+"</td><td>"+esc(v.ty)+"</td><td><span class=\"eng9-tag\">درس "+faNum(v.l)+"</span></td></tr>").join("");
  return "<div class=\"eng9-tbl-wrap\"><table class=\"eng9-tbl\"><thead><tr><th>واژۀ انگلیسی</th><th>معنی فارسی</th><th>نوع</th><th>درس</th></tr></thead><tbody>"+body+"</tbody></table></div>";
}
function flashHTML(v,label){
  return "<div class=\"eng9-flash\" data-act=\""+(label||"vflashflip")+"\"><div class=\"eng9-f-en\">"+esc(v.en)+"</div><div class=\"eng9-f-fa\">"+esc(v.fa)+"</div><div class=\"eng9-f-hint\">برای دیدن معنی، روی کارت کلیک کن</div></div>";
}
function filteredVocab(){
  const si=document.getElementById("eng9-vsearch"), se=document.getElementById("eng9-vsel");
  const q=si?(si.value||"").trim().toLowerCase():"";
  const lid=se?se.value:"0";
  const rows=[];
  D.lessons.forEach(L=>{
    if(lid!=="0"&&+lid!==L.id)return;
    L.vocab.forEach(v=>{
      if(q&&!(v[0].toLowerCase().includes(q)||v[1].includes(q)))return;
      rows.push({l:L.id,en:v[0],fa:v[1],ty:v[2]});
    });
  });
  return rows;
}
function grammarCard(g){
  let h="<div class=\"eng9-card\" style=\"margin-bottom:16px\"><h4 class=\"eng9-h4\" style=\"margin-top:0\">"+esc(g.title)+"</h4>";
  (g.body||[]).forEach(p=>{h+="<p>"+esc(p)+"</p>"});
  (g.examples||[]).forEach(e=>{h+="<div class=\"eng9-exbox\"><div class=\"eng9-en\">"+esc(e[0])+"</div><div class=\"eng9-fa\">"+esc(e[1])+"</div></div>"});
  (g.list||[]).forEach(x=>{h+="<div class=\"eng9-formula\">"+esc(x)+"</div>"});
  if(g.table)h+=tbl(g.table);
  (g.notes||[]).forEach(n=>{h+="<div class=\"eng9-tip\"><b>"+esc(n[0])+":</b> "+esc(n[1])+"</div>"});
  return h+"</div>";
}
function convTab(L){
  const c=L.conv;
  let h="<div class=\"eng9-card\"><span class=\"eng9-tag src-book\">"+esc(c.src)+"</span><h4 class=\"eng9-h4\" style=\"margin-top:10px\">"+esc(c.title)+"</h4><div class=\"eng9-chat\">";
  c.lines.forEach((ln,i)=>{h+="<div class=\"eng9-msg "+(i%2?"b":"a")+"\"><div class=\"eng9-msg-name\">"+esc(ln[0])+"</div><div class=\"eng9-msg-en\">"+esc(ln[1])+"</div><div class=\"eng9-msg-fa\">"+esc(ln[2])+"</div></div>"});
  h+="</div><h4 class=\"eng9-h4\">عبارات کلیدی (Key Language)</h4>";
  c.phrases.forEach(p=>{h+="<div class=\"eng9-exbox\"><div class=\"eng9-en\">"+esc(p[0])+"</div><div class=\"eng9-fa\">"+esc(p[1])+"</div></div>"});
  if(c.note)h+="<div class=\"eng9-tip\"><b>نکته:</b> "+esc(c.note)+"</div>";
  return h+"</div>";
}
function readingTab(L){
  const r=L.reading;
  let h="<div class=\"eng9-card\"><span class=\"eng9-tag src-book\">"+esc(r.src)+"</span><h4 class=\"eng9-h4\" style=\"margin-top:10px\">"+esc(r.title)+"</h4>";
  h+="<div class=\"eng9-exbox\"><div class=\"eng9-en\">"+esc(r.en)+"</div></div>";
  h+="<div class=\"eng9-rule\"><b>ترجمه:</b><p>"+esc(r.fa)+"</p></div>";
  h+="<h4 class=\"eng9-h4\">نکات متن</h4><div class=\"eng9-tip\">"+r.notes.map(t=>"<div>✓ "+esc(t)+"</div>").join("")+"</div></div>";
  return h;
}
function wbTab(L){
  let h="";
  L.workbook.forEach((w,i)=>{
    h+="<div class=\"eng9-card eng9-qcard\"><span class=\"eng9-tag src-wb\">"+esc(w.src)+"</span>";
    if(w.img)h+="<span class=\"eng9-tag\" style=\"background:#df4b5818;color:var(--eng9-bad)\">وابسته به تصویر/صوت</span>";
    h+="<h4 class=\"eng9-h4\" style=\"margin-top:10px\">"+esc(w.t)+"</h4>";
    (w.body||[]).forEach(p=>{h+="<p>"+esc(p)+"</p>"});
    if(w.note)h+="<div class=\"eng9-warn\">⚠ "+esc(w.note)+"</div>";
    if(w.ans&&w.ans.length){
      const label=w.ansKind||"پاسخ";
      h+="<button class=\"eng9-acc-btn\" data-act=\"reveal\" data-target=\"eng9-wb-"+L.id+"-"+i+"\">نمایش "+esc(label)+"</button>";
      h+="<div class=\"eng9-result\" id=\"eng9-wb-"+L.id+"-"+i+"\" hidden>"+w.ans.map(a=>"<div style=\"margin:3px 0\">"+esc(a)+"</div>").join("")+"</div>";
    }
    h+="</div>";
  });
  return h;

/* ---------- رندر و مسیریابی ---------- */
function renderView(name,arg){
  let html="",navKey="";
  if(name==="home"){html=viewHome();navKey="home"}
  else if(name==="lessons"){html=viewLessons();navKey="lessons"}
  else if(name==="lesson"){html=viewLesson(arg);navKey="lessons"}
  else if(name==="vocab"){html=viewVocab();navKey="vocab"}
  else if(name==="questions"){html=viewQuestions();navKey="questions"}
  else if(name==="appendix"){html=viewAppendix();navKey="appendix"}
  else if(name==="about"){html=viewAbout();navKey="about"}
  else html=view404();
  app.innerHTML=html;
  if(nav)nav.querySelectorAll("a").forEach(a=>a.classList.toggle("active",a.dataset.nav===navKey));
  updateRing();
  window.scrollTo(0,0);
}
function route(){
  const h=location.hash||"";
  if(h.indexOf("#eng9-")!==0)return;
  const name=h.slice(6);
  const m=name.match(/^lesson-(\d+)$/);
  if(m)renderView("lesson",+m[1]);
  else if(["home","lessons","vocab","questions","appendix","about"].indexOf(name)>=0)renderView(name,name);
  else renderView("404");
}

/* ---------- تعامل‌ها ---------- */
function answerQ(btn){
  const l=+btn.dataset.l,qi=+btn.dataset.q,i=+btn.dataset.i,key=l+"-"+qi;
  if(S.answered[key]!==undefined)return;
  const L=lessonById(l),item=L&&L.questions?L.questions[qi]:undefined;if(!L||!item)return;
  S.answered[key]=i;
  const box=btn.closest(".eng9-options");
  Array.prototype.forEach.call(box.children,(b,j)=>{b.disabled=true;if(j===item.ans)b.classList.add("correct")});
  if(i!==item.ans)btn.classList.add("wrong");
  const card=btn.closest(".eng9-qcard"),r=card.querySelector(".eng9-result");
  r.innerHTML=(i===item.ans?"✅ درست! ":"❌ پاسخ درست نیست. ")+esc(item.ex||"");
  r.hidden=false;
}
function setTab(btn){
  const l=+btn.dataset.l,tab=btn.dataset.tab;
  S.tabs[l]=tab;
  document.querySelectorAll("#eng9-ltabs .eng9-tab").forEach(b=>b.classList.toggle("active",b===btn));
  const body=document.getElementById("eng9-lbody");if(body)body.innerHTML=lessonPanel(l,tab);
}
function reveal(btn){
  const body=document.getElementById(btn.dataset.target);if(!body)return;
  body.hidden=!body.hidden;
  btn.textContent=body.hidden?"نمایش پاسخ":"پنهان کردن پاسخ";
}
function mark(btn){
  const k="l"+btn.dataset.l;
  if(progress[k])delete progress[k];else progress[k]=Date.now();
  saveP();
  btn.classList.toggle("secondary",!!progress[k]);
  btn.textContent=progress[k]?"✓ درس تکمیل شده":"علامت‌گذاری به‌عنوان مطالعه‌شده";
}
function showLFlash(btn){
  const l=+btn.dataset.l,L=lessonById(l);if(!L)return;
  const st=S.lFlash[l]||(S.lFlash[l]={idx:0,flipped:false,on:false});
  const area=document.getElementById("eng9-lflash-"+l);if(!area)return;
  st.on=!st.on;
  area.innerHTML=st.on?lFlashHTML(L):"";
  btn.textContent=st.on?"بستن مرور کارتی":"مرور کارتی این واژگان";
}
function lFlashHTML(L){
  const st=S.lFlash[L.id],v=L.vocab[st.idx];
  return "<div class=\"eng9-flash"+(st.flipped?" flipped":"")+"\" data-act=\"lflashflip\" data-l=\""+L.id+"\"><div class=\"eng9-f-en\">"+esc(v[0])+"</div><div class=\"eng9-f-fa\">"+esc(v[1])+"</div><div class=\"eng9-f-hint\">برای دیدن معنی کلیک کن • "+esc(v[2])+"</div></div>"
  +"<div class=\"eng9-toolbar\" style=\"justify-content:center\"><button class=\"eng9-btn secondary\" data-act=\"lflashnav\" data-l=\""+L.id+"\" data-d=\"-1\">واژۀ قبلی</button><span class=\"eng9-muted\">"+faNum(st.idx+1)+" از "+faNum(L.vocab.length)+"</span><button class=\"eng9-btn secondary\" data-act=\"lflashnav\" data-l=\""+L.id+"\" data-d=\"1\">واژۀ بعدی</button></div>";
}
function lFlashRender(l){
  const L=lessonById(l),area=document.getElementById("eng9-lflash-"+l);
  if(area)area.innerHTML=lFlashHTML(L);
}
function filtersChanged(){
  const tv=document.getElementById("eng9-vtable");
  if(tv)tv.innerHTML=vocabTableHTML(filteredVocab());
  const vf=document.getElementById("eng9-vflash");
  if(vf&&S.vFlashOn){S.vIdx=0;S.vFlipped=false;vf.innerHTML=vFlashHTML()}
}
app.addEventListener("click",function(e){
  const t=e.target.closest("[data-act]");if(!t)return;
  const act=t.dataset.act;
  if(act==="tab")setTab(t);
  else if(act==="opt")answerQ(t);
  else if(act==="reveal")reveal(t);
  else if(act==="mark")mark(t);
  else if(act==="lflash")showLFlash(t);
  else if(act==="lflashflip"){const l=+t.dataset.l;S.lFlash[l].flipped=!S.lFlash[l].flipped;lFlashRender(l)}
  else if(act==="lflashnav"){const l=+t.dataset.l,st=S.lFlash[l],n=lessonById(l).vocab.length;st.idx=(st.idx+ +t.dataset.d+n)%n;st.flipped=false;lFlashRender(l)}
  else if(act==="vflashmode"){S.vFlashOn=!S.vFlashOn;S.vIdx=0;S.vFlipped=false;renderView("vocab")}
  else if(act==="vflashflip"){S.vFlipped=!S.vFlipped;const vf=document.getElementById("eng9-vflash");if(vf)vf.innerHTML=vFlashHTML()}
  else if(act==="vflashnav"){const n=filteredVocab().length;S.vIdx=(S.vIdx+ +t.dataset.d+n)%n;S.vFlipped=false;const vf=document.getElementById("eng9-vflash");if(vf)vf.innerHTML=vFlashHTML()}
});
app.addEventListener("input",function(e){
  if(e.target.id==="eng9-vsearch")filtersChanged();
  else if(e.target.id==="eng9-vsel")filtersChanged();
  else if(e.target.id==="eng9-qsel"){S.qSel=e.target.value;const ql=document.getElementById("eng9-qlist");if(ql)ql.innerHTML=qListHTML()}
  else if(e.target.id==="eng9-asearch"){
    const q=(e.target.value||"").trim().toLowerCase();
    document.querySelectorAll("#eng9-atbl tbody tr").forEach(tr=>{
      tr.style.display=(!q||tr.textContent.toLowerCase().includes(q))?"":"none";
    });
  }
});
app.addEventListener("change",function(e){
  if(e.target.id==="eng9-vsel")filtersChanged();
  else if(e.target.id==="eng9-qsel"){S.qSel=e.target.value;const ql=document.getElementById("eng9-qlist");if(ql)ql.innerHTML=qListHTML()}
});

/* ---------- شروع: اول رندر محتوا، بعد اتصال امکانات جانبی (خطای هر قابلیت نباید کل سایت را از کار بیندازد) ---------- */
function start(){
  try{
    if((location.hash||"").indexOf("#eng9-")===0)route();
    else renderView("home");
  }catch(err){
    try{
      app.innerHTML='<div class="eng9-panel" style="margin:24px auto;max-width:640px;text-align:center"><h2>زبان انگلیسی پایه نهم</h2><p>در نمایش این بخش خطایی رخ داد. لطفاً صفحه را دوباره بارگذاری کن.</p><p class="eng9-muted">'+esc(String((err&&err.message)||err))+'</p><a class="eng9-btn" href="#eng9-home">تلاش دوباره</a></div>';
    }catch(e2){}
  }
}
window.addEventListener("hashchange",function(){start()});
start();

/* ---------- تم، منو، دکمۀ بالا (اختیاری) ---------- */
try{
  const themeBtn=document.getElementById("eng9-themeBtn");
  if(sGet("eng9-theme")==="dark")wrap.classList.add("dark");
  if(themeBtn)themeBtn.onclick=function(){
    wrap.classList.toggle("dark");
    sSet("eng9-theme",wrap.classList.contains("dark")?"dark":"light");
  };
}catch(e){}
try{
  const menuBtn=document.getElementById("eng9-menuBtn");
  if(menuBtn)menuBtn.onclick=function(){nav.classList.toggle("eng9-open")};
  if(nav)nav.addEventListener("click",function(e){if(e.target.closest("a"))nav.classList.remove("eng9-open")});
}catch(e){}
try{
  const toTop=document.getElementById("eng9-toTop");
  if(toTop){
    window.addEventListener("scroll",function(){toTop.classList.toggle("show",window.scrollY>500)});
    toTop.onclick=function(){window.scrollTo({top:0,behavior:"smooth"})};
  }
}catch(e){}
})();

</script>
