{"g": "گفت‌وگو (صفحهٔ ۸۶)", "n": "۲", "q": "دربارهٔ یکی از زنان بزرگ در شاهنامهٔ فردوسی، تحقیق کنید.", "a": ["پاسخ نمونه — <b>شهرنواز و ارنواز:</b> دو خواهر از نزدیکانِ جمشید بودند که ضحاکِ ماری آنان را به همسری گرفت. با قیام کاوهٔ آهنگر و پیروزی فریدون بر ضحاک، فریدون این دو را به همسری خود درآورد؛ از شهرنواز سلم و تور و از ارنواز ایرج زاده شد. ایرج، پاک‌نهاد و فرزانه بود اما برادرانش از حسد او را کشتند؛ خون ایرج سرچشمهٔ جنگ‌های ایران و توران شد و فریدون بعدها منوچهر را به کین‌خواهی او برانگیخت. (نمونهٔ دیگر برای تحقیق: رودابهٔ زال، سودابه، جریره، کتایون — بانوی پارسای شاهنامه.)"]}, {"g": "خودآزمایی (صفحهٔ ۸۷)", "n": "۱", "q": "هر یک از واژگان زیر با کدام نشانة جمع به کار نمی‌روند؟ (واژه‌ها: مخلوق، طرّار، ظالم، نظر، غریب — نشانة جمع: ان، ها، ات)", "a": ["«مخلوق» با «ان» به کار نمی‌رود (مخلوق‌ها، مخلوقات ✓)؛ «طرّار» با «ات» به کار نمی‌رود (طرّارها، طرّاران ✓)؛ «ظالم» با «ات» به کار نمی‌رود (ظالم‌ها، ظالمان ✓)؛ «نظر» با «ان» به کار نمی‌رود (نظرها، نظرات ✓)؛ «غریب» با «ات» به کار نمی‌رود (غریب‌ها، غریبان ✓)."]}, {"g": "خودآزمایی (صفحهٔ ۸۷)", "n": "۲", "q": "با توجه به متن درس، واژهٔ «دوست» در هر جمله، به چه اشاره دارد؟ «اگر یک دوست خفته است، دوستِ دیگر بیدار است.»", "a": ["«دوستِ نخست (خفته)» اشاره دارد به <b>رابعه</b> و به‌طور کلی بندهٔ خوابیدهٔ خدا؛ و «دوستِ دیگر (بیدار)» اشاره دارد به <b>خداوند</b> که بیدار و نگاهبانِ بندهٔ خود است؛ یعنی خدا خود مراقبِ محبوبش است."]}, {"g": "خودآزمایی (صفحهٔ ۸۷)", "n": "۳", "q": "در جاهای خالی، جمله‌های مناسب بنویسید. (نمونهٔ داده‌شده: «او شعری سرود» — ماضی ساده، شخص سوم)", "a": ["جدول انواع فعل ماضی با مصدر نمونه (مثلاً «خواندن») — پاسخ نمونه: <b>۱)</b> ماضی ساده (شخص سوم): او شعری <b>سرود</b>؛ <b>۲)</b> ماضی استمراری: او همواره شعر <b>می‌سرود</b>؛ <b>۳)</b> ماضی مستمر: <b>داشت شعر می‌سرود</b> که مهمان آمد؛ <b>۴)</b> ماضی نقلی: او شعری <b>سروده است</b>؛ <b>۵)</b> فعل از مصدر خواندن: او آن کتاب را <b>خواند / می‌خواند / خوانده است / خوانده بود</b>."]}, {"g": "فرصتی برای اندیشیدن (صفحهٔ ۹۰ — روان‌خوانی)", "n": "۱", "q": "چرا خرمشهر نمادِ هشت سال مقاومت معرفی شده است؟", "a": ["زیرا خرمشهر نخستین شهری بود که به اشغال دشمن درآمد و مقاومتِ مردان و زنانش (به فرماندهی شهیدان محمد جهان‌آرا و ... ) از نخستین روزهای جنگ تا آزادسازی در ۳ خرداد ۱۳۶۱ ادامه یافت؛ ویرانی‌ها، خاکِ خون‌گرفته و ایثارِ رزمندگانش، خلاصهٔ همهٔ فداکاری‌های ملت ایران در هشت سال دفاع مقدس بود؛ آزادسازی خرمشهر نیز پیچیده‌ترین عملیات جنگ و نقطهٔ شکستِ دشمن شمرده می‌شود؛ از این‌رو این شهر، نماد و یادمانِ مقاومتِ ملت ایران است."]}, {"g": "فرصتی برای اندیشیدن (صفحهٔ ۹۰ — روان‌خوانی)", "n": "۲", "q": "دریافت شما از جملهٔ زیر چیست؟ «حیات حقیقی مردان خدا، ققنوس‌وار از میان خاکستر نخل‌های نیم‌سوخته، سر برآورد.»", "a": ["مردان خدا چون ققنوس‌اند: از میان خاکستر و آتشِ جنگ (نخل‌های نیم‌سوخته، خانه‌های ویران و کشتی‌های به‌گل‌نشسته) دوباره حیاتِ حقیقی و روحِ ایمان و انقلاب برمی‌خیزند؛ مرگ و آتش، پایان راه آنان نیست، بلکه سرچشمهٔ زندگیِ دوباره و جاودانگی است — چنان‌که شهیدان با خون خود، حیات و آزادیِ شهر را دوباره زنده کردند."]}],"notes7":[],"exam":["درس ۱۱ «زنِ پارسا»: نثرِ ساده و روانِ <b>تذکرةالاولیاء عطار نیشابوری</b> دربارهٔ <b>رابعهٔ عدویه</b> (زنِ عارف قرن دوم هجری؛ رابعه = چهارم).", "خط داستان: تولدِ بی‌جامه و بی‌چراغ ← عهدِ پدر با خدا (از مخلوق هیچ نخواهد) ← بشارت پیامبر (ص) در خواب («هفتاد هزار از امّت من در شفاعت او خواهند بود») ← یتیمی و قحطی بصره و فروش به چند درم ← شکستن دست و مناجات («مرا از این همه هیچ غم نیست، الّا رضای تو») ← آواز («فردا جاهیت خواهد بود») ← عبادت‌ها ← دزد و چادر (هفت نوبت) ← «اگر یک دوست خفته است، دوستِ دیگر بیدار است».", "روان‌خوانی «دروازه‌ای به آسمان» از <b>شهید سیدمرتضی آوینی</b> (مسیح در شب قدر): خرمشهر = دروازهٔ آسمانیِ کربلا و عشق؛ «در هر وجب از این خاک، شهیدی به معراج رفته است؛ با وضو وارد شوید»؛ حرکتِ امام‌حسینیِ شهید جهان‌آرا («هر کس می‌تواند، بایستد...» — تلمیح به عاشورا).", "دستور کتاب: <b>ماضی استمراری</b> (می + بن گذشته + شناسه: می‌رفتم) و <b>ماضی مستمر</b> (گذشتهٔ داشتن + ماضی استمراری: داشتم می‌رفتم)؛ دیگر نقش‌ها: «را» مالکیت‌ساز در «پدر او را»، عهد کرده بود (بعید)، خفته‌اند (نقلی)، خواهند بود (آینده)، استی (اسنادی)، «الهی» منادا.", "آرایه‌های نمونه: کنایه (روی بر خاک نهاد=سجده؛ دل سپردن=عاشق شدن؛ زهره=جرئت)؛ استعاره (دوستِ دیگر=خدا)؛ اغراق (مقرّبان آسمان به تو نازند)؛ پرسش انکاری (دزد را کی زهرهٔ آن بود...؟)؛ تضاد (خفته/بیدار)؛ تشبیه (ققنوس‌وار)؛ تلمیح (سخن امام حسین ع).", "املا/واژه: عیال=همسر، مخلوق=آفریده، سیّده=سرورِ زن، طرّار=دزد، زهره=جرئت، صومعه=عبادتگاه، ققنوس=نماد جاودانگی، معارج=نردبان‌های عروج."]},
{"id":12,"icon":"✉️","lnum":"درس دوازدهم","title":"پیام‌آورِ رحمت","info":"منبع: «پیام پیامبر» (مجموعهٔ نامه‌ها، خطبه‌ها، وصایا و سخنان حضرت محمّد (ص))، ترجمهٔ خرمشاهی و انصاری | فصل پنجم: اسلام و انقلاب اسلامی | موضوع: بخشی از سفارش‌های پیامبر اکرم (ص) به ابوذر","intro":"<b>پیام اصلی:</b> ارزش انسان به درون و کردار اوست نه ظاهر و دارایی‌اش؛ فرصت‌های عمر (جوانی، تندرستی، بی‌نیازی، آسایش و زندگی) را پیش از از دست دادنشان غنیمت بشمار؛ راست‌گویی حتی در «نمی‌دانم» گفتن؛ کم‌گوییِ سنجیده و خندان‌رویی؛ و همدلی و پیوندِ مؤمنان چون اعضای یک پیکر.","kholase":["درس ۱۲ از فصل «اسلام و انقلاب اسلامی»، بخشی از سفارش‌های پیامبر اکرم (ص) به <b>ابوذر</b> را می‌خواند. کتاب درس با این مقدمه آغاز می‌شود: اسلام، دینی جهانی است و پیام‌آور آن، حضرت محمد (ص)، رحمت و سعادت برای جهانیان است؛ سخنان سرشار از حکمت او مرز مکانی و رنگ روزگار ویژه‌ای ندارد؛ طنین دلنشین کلامش فراتر از جغرافیای فرهنگی تاریخ بشری است و جان‌های پاک پیوسته مشتاق شنیدن آن‌اند؛ پیام او گنجینه و آبشخوری است که انسانیت برای تازگی و شکوفایی و شکوه‌مندی خود همواره بدان نیازمند است. سپس سفارش‌های پیامبر (ص) به ابوذر آمده است: خداوند متعال به سیمای ظاهر و دارایی‌ها و گفته‌های شما نمی‌نگرد؛ بلکه به دل‌ها و کردارتان می‌نگرد. پنج چیز را پیش از پنج چیز غنیمت شمار: جوانی‌ات را پیش از پیری، تندرستی‌ات را پیش از بیماری، بی‌نیازی‌ات را پیش از نیازمندی، آسایشت را پیش از گرفتاری و زندگی‌ات را پیش از مرگ. اگر دربارهٔ چیزی که به آن علم نداری از تو پرسیده شد، بگو «نمی‌دانم» تا از پیامدهای ناگوار آن در امان بمانی. به اندازهٔ نیاز سخن بگو و گشاده‌روی و خندان باش، که خدای تعالی گشاده‌روی و آسان‌گیر را دوست دارد. همنشینِ نیک بهتر از تنهایی است و تنهایی بهتر از همنشینِ بد؛ مَثَلِ مؤمنان جمله چون یک تن است؛ چون یک اندام رنجی ببیند، همهٔ اندام‌ها آگاهی یابند و رنجور شوند. با برادر مسلمانت قهر مکن، زیرا کردار شایسته در هنگام قهر به درگاه پروردگار پذیرفته نمی‌شود؛ مؤمن برای رهایی از گناه و نافرمانی، بیش از گنجشکِ در قفس تلاش می‌کند."],"payam":"<b>پیام اصلی:</b> ارزش انسان به درون و کردار اوست نه ظاهر و دارایی‌اش؛ فرصت‌های عمر (جوانی، تندرستی، بی‌نیازی، آسایش و زندگی) را پیش از از دست دادنشان غنیمت بشمار؛ راست‌گویی حتی در «نمی‌دانم» گفتن؛ کم‌گوییِ سنجیده و خندان‌رویی؛ و همدلی و پیوندِ مؤمنان چون اعضای یک پیکر.","khanesh":"<b>نکتۀ خوانش:</b> این درس با لحن عاطفی خوانده می‌شود: لحنی که به احساسات و عواطف پیوند دارد و با کشش آوایی، نرمی آهنگ کلام، تکیه و درنگ‌های مناسب، عواطف لطیف را بازگو می‌کند.","blocks":[{"k": "prose", "t": "طنین دلنشین کلام ایشان، فراتر از جغرافیای فرهنگی تاریخ بشری است و جان‌های پاک، پیوسته مشتاق شنیدن آن هستند. پیام پیامبر (ص)، گنجینه و آبشخوری است که انسانیّت، همواره برای تازگی و شکوفایی و شکوه‌مندی خود بدان، نیازمند است.", "mean": [["معنی", "آهنگ زیبا و دل‌انگیز سخنان پیامبر (ص) از محدودهٔ فرهنگ‌های تاریخ بشر فراتر است و جوهر پاک همیشه تشتاق شنیدن آن را دارند؛ پیام‌های او همچون گنجی گران‌بها و سرچشمهٔ آب (آبشخور) است که نوع بشر برای شادابی، رشد و عظمتِ خود همواره به آن نیازمند است."], ["آرایه", "«جان‌های پاک» مجاز از انسان‌های درستکار؛ تشبیهِ پیام پیامبر به گنجینه و آبشخور؛ تشبیه پنهانِ انسانیت به گل با نسبت‌دادن «تازگی و شکوفایی» (استعاره از گونهٔ تشخیص‌دار)."]]}, {"k": "prose", "t": "ای ابوذر! خداوند متعال به سیمای ظاهر و دارایی‌ها و گفته‌هایتان نمی‌نگرد؛ بلکه به دل‌ها و کردارتان می‌نگرد.", "mean": [["معنی", "خداوند به زیبایی و چهرهٔ ظاهری و اموال و سخنان شما توجه نمی‌کند؛ بلکه به باطن و قلب و اعمال و رفتار شما می‌نگرد (پس به آراستگیِ درون بیندیشید، نه ظاهر)."], ["آرایه", "«دل» مجاز از درون و قلب؛ «سیمای ظاهر و دل‌ها» تقابل معنایی."]]}, {"k": "prose", "t": "ای ابوذر! پنج چیز را پیش از پنج چیز، غنیمت شمار: جوانی‌ات را پیش از فرا رسیدن پیری، تندرستی‌ات را پیش از بیماری، بی‌نیازی‌ات را پیش از نیازمندی، آسایشت را پیش از گرفتاری و زندگی‌ات را پیش از مرگ.", "mean": [["معنی", "پنج نعمت را پیش از آن‌که در نقطهٔ مقابلشان قرار گیری، ارزش بشمار و از آن‌ها بهره بگیر: جوانی را پیش از پیری، سلامتی را پیش از بیماری، توانگری را پیش از نیازمندی، آسایش را پیش از سختی و زندگی را پیش از مرگ."], ["آرایه", "تضاد و تقابل: «جوانی و پیری، تندرستی و بیماری، بی‌نیازی و نیازمندی، آسایش و گرفتاری، زندگی و مرگ» (پنج جفت متضاد)؛ «پنج چیز» تکرار؛ جناس در «بی‌نیازی/نیازمندی»."], ["دستور", "«غنیمت شمار» فعل امر؛ «ت» و «ات» در «جوانی‌ات، تندرستی‌ات، بی‌نیازی‌ات، آسایشت» مضاف‌الیه؛ «پیش از» متمم حرف اضافه‌دار؛ «پنج» صفت شمارشی."]]}, {"k": "prose", "t": "ای ابوذر! اگر دربارۀ چیزی که به آن علم نداری، از تو پرسیده شود، بگو نمی‌دانم تا از پیامدهای ناگوار آن در امان بمانی.", "mean": [["معنی", "اگر از تو دربارهٔ چیزی که دانشش را نداری بپرسند، راست بگو «نمی‌دانم» تا از عواقب ناخوشایندِ سخن بی‌پشتوانه (گناه و اشتباه و دروغ) در امان بمانی."], ["دستور", "«نمی‌دانم» مضارع اخباری منفی؛ «پیامدهای ناگوار» ترکیب وصفی (مشتق مرکب‌گونه)."], ["نکته", "این سفارش با بیت سعدی «کمال است در نفس انسان، سخن / تو خود را به گفتار، ناقص مکن» تناسب معنایی دارد."]]}, {"k": "prose", "t": "ای ابوذر! به اندازۀ نیاز، سخن بگوی. گشاده‌روی و خندان باش که خدای تعالی، گشاده‌روی و آسان‌گیر را دوست دارد.", "mean": [["معنی", "جز به اندازهٔ نیاز سخن مگو (مگذار سخن زیاد و بی‌مورد گویند) و همیشه شاداب و خندان‌رو باش؛ زیرا خداوند انسانِ خوش‌برخورد و باگذشت را دوست می‌دارد."], ["آرایه", "«بگوی و روی» سجع؛ «گشاده‌روی» کنایه از خوش‌برخوردی؛ «آسان‌گیر» کنایه از باگذشتی."], ["دستور", "«بگوی» و «باش» فعل امر؛ «به اندازهٔ» متمم؛ «را» در «آسان‌گیر را» نشانهٔ مفعولی."]]}, {"k": "prose", "t": "ای ابوذر! همنشینِ نیک، بهتر از تنهایی است و تنهایی، بهتر از همنشینِ بد است. مَثَلِ مؤمنان، جمله چون یک تن است؛ چون یک اندام را رنجی رسد، همۀ اندام‌ها آگاهی یابند و رنجور شوند.", "mean": [["معنی", "همراهی و دوستی با انسان‌های خوب از تنها ماندن بهتر است و تنها ماندن از همنشینی با آدم‌های بد بهتر است؛ وضعیت مؤمنان به یکدیگر، مانند اعضای یک بدن است که وقتی یکی از اعضا آسیب می‌بیند، همهٔ اعضا به درد می‌آیند و رنجور و بی‌قرار می‌شوند (همدلیِ کامل)."], ["آرایه", "تضاد «نیک و بد»؛ تکرار «همنشین و تنهایی»؛ <b>تمثیل</b> (تشبیه رابطهٔ مؤمنان به رابطهٔ اعضای یک بدن)؛ این سخن پیامبر (ص) با بیت سعدی «بنی‌آدم اعضای یک پیکرند / که در آفرینش ز یک گوهرند» هم‌مضمون است."], ["دستور", "«جمله» در «مثل مؤمنان، جمله چون یک تن است» قید (جمله‌گی/همگی)؛ «چون» حرف تشبیهی؛ «رسد»، «یابند»، «شوند» فعل‌های ماضی/مضارع؛ «رنجور» صفت مشتق."]]}, {"k": "prose", "t": "ای ابوذر! مبادا با برادر مسلمانت قهر کنی؛ زیرا کردار شایسته در هنگام قهر، به درگاه پروردگار پذیرفته نمی‌شود. مؤمن برای رهایی از گناه و نافرمانی، بیش از گنجشکِ در قفس، تلاش می‌کند.", "mean": [["معنی", "هرگز با هم‌کیشِ مسلمانت قهر و خشمت را پیوند نده؛ زیرا در حالت قهر و خشم، حتی اعمال نیک تو نزد خدا پذیرفته نمی‌شود؛ و مؤمن برای آزادی از گناه و نافرمانی، بیشتر از گنجشکی که در قفس برای رهایی خود می‌جنگد، تلاش می‌کند."], ["آرایه", "«برادر مسلمان» مجاز از همهٔ هم‌کیشان؛ <b>تمثیل</b> (تشبیه تلاش مؤمن در رهایی از گناه به تلاش گنجشک در قفس)؛ «مبادا» فعل نهی معادل."], ["دستور", "«مبادا...کنی» فعل نهی؛ «برای رهایی» متمم؛ «بیش از» قید مقایسه؛ «می‌کند» مضارع اخباری."]]}, {"k": "sub", "t": "حکایت «سیرت سلمان» — روضةالخُلد، مجد خوافی"}, {"k": "prose", "t": "سلمان فارسی بر لشکری امیر بود. در میان رعایا چنان حقیر می‌نمود که وقتی خادمی به وی رسید، گفت: «این توبرهٔ کاه، بردار و به لشکرگاه سلمان بر.» چون به لشکرگاه رسید، مردم گفتند: «امیر است.» آن خادم بترسید و در قدمِ وی افتاد. سلمان گفت: «به سه وجه، این کار را از برای خودم کردم، نه از بهرِ تو، هیچ اندیشه مدار. اول آنکه تکبر از من دفع شود؛ دوم آنکه دل تو، خوش شود؛ سوم آنکه از عهدة حفظ رعیت، بیرون آمده باشم.»", "mean": [["معنی", "سلمان فارسی فرماندهِ لشکری بود. میان مردم چنان فروتن و خود-کوچک‌بین بود که وقتی خدمتکاری به او رسید (و نشناخت)، سلمان خود به او گفت: «این کیسهٔ بزرگ کاه را بردار و به اردوگاهِ سلمان ببر.» چون خادم به لشکرگاه رسید، مردم گفتند: «او امیر و فرمانده است!» خادم ترسید و به پای سلمان افتاد و عذرخواهی کرد. سلمان گفت: «من این کار را به سه دلیل برای خودم کردم، نه به خاطر تو؛ پس هیچ نگران مباش: نخست آنکه تکبر و خودبینی از من دور شود؛ دوم آنکه دل تو خوش و شاد شود؛ سوم آنکه از زیر بارِ مسئولیتِ نگاهبانی از مردم، سربلند بیرون آمده باشم (به وظیفهٔ خویش عمل کرده باشم).»"], ["مفهوم", "فروتنیِ والای سلمان: بزرگِ واقعی خود را کوچک می‌شمارد؛ انگیزهٔ نیکی‌ها باید رشدِ خود و شادیِ خلق و ادای مسئولیت باشد، نه شهرت."], ["لغت", "رعایا: جمع رعیت، عموم مردم / حقیر: کوچک و بی‌ارزش / توبره: کیسهٔ بزرگ کاه / لشکرگاه: اردوگاه / خادم: خدمتکار / وجه: دلیل و جهت / اندیشه مدار: نترس، نگران مباش / دفع شود: دور شود / از عهدة... بیرون آمدن: از زیر مسئولیتی سربلند بیرون آمدن / حفظ رعیت: نگاهبانی از مردم."], ["آرایه", "«خوش شود» کنایه از خشنود شدن؛ «در قدم وی افتاد» کنایه از عذرخواهی و عرض ادب؛ «حفظ رعیت» ترکیب اضافی."], ["دستور", "«می‌نمود» ماضی استمراری؛ «بر» فعل امر (بُر)؛ «ترسید» و «افتاد» ماضی ساده؛ «گفت» ماضی ساده؛ «شود»، «آمده باشم» مضارع التزامی؛ «مدار» فعل نهی؛ «برای خودم» متمم؛ «سه» صفت شمارشی؛ «اول، دوم، سوم» قید/صفت ترتیبی."]]}],"vocab":[["طنین", "آهنگ و صدا"], ["جغرافیا", "پهنهٔ مکانی"], ["پیوسته", "همواره، دائم"], ["مشتاق", "آرزومند"], ["گنجینه", "گنج و اندوختهٔ گران‌بها"], ["آبشخور", "سرچشمه و جای نوشیدن"], ["شکوه‌مندی", "باشکوه و با عظمت بودن"], ["متعال", "بلندمرتبه"], ["سیمای ظاهر", "چهرهٔ بیرونی"], ["دارایی", "اموال و ثروت"], ["غنیمت شمردن", "ارزش‌دادن، بهره‌بردن"], ["پیامد", "نتیجه و عاقبت"], ["ناگوار", "ناخوشایند"], ["آسان‌گیر", "باگذشت، حلیم"], ["گشاده‌روی", "خوش‌برخورد"], ["مَثَل", "چون و مانند"], ["جمله (جمله چون یک تن)", "همگی، مجموع"], ["رنجور", "رنج‌دیده و بیمار"], ["مبادا", "هرگز مکن (نهی)"], ["رعایا", "جمع رعیت، مردم"], ["حقیر", "کوچک و بی‌ارزش"], ["توبره", "کیسهٔ بزرگ کاه"], ["خادم", "خدمتگزار"], ["وجه", "دلیل، جهت"], ["اندیشه مدار", "نگران مباش، نترس"], ["تکبر", "خودبینی و بزرگ‌نمایی"], ["دفع شود", "دور شود"], ["از عهدة... بیرون آمدن", "از زیر بارِ آن سربلند بیرون آمدن"]],"notes3":["<b>واژه‌های مهم املایی:</b> پیام‌آور، رحمت، جهانیان، طنین، دلنشین، جغرافیای، گنجینه، شکوه‌مندی، متعال، دارایی، غنیمت، تندرستی، بی‌نیازی، گرفتاری، پیامدها، ناگوار، آسان‌گیر، گشاده‌روی، همنشین، مؤمنان، اندام، رنجور، توبره، لشکرگاه، تکبر، مسئولیت، حفظ رعیت."],"lit":[{"name": "«پیام پیامبر»", "t": "کتابی است شامل مجموعهٔ نامه‌ها، خطبه‌ها، وصایا و سخنان حضرت محمد (ص) که <b>ترجمهٔ خرمشاهی و انصاری</b> است و متن درس ۱۲ از آن برگزیده شده است."}, {"name": "مجد خوافی (کمال‌الدین؟ — خواجه مجالدین؟)", "t": "<b>مجد خوافی</b> ادیب و نویسندهٔ قرن هشتم هجری است؛ کتاب او <b>«روضةالخُلد»</b> به شیوهٔ (به تقلید از) <b>گلستان سعدی</b> نوشته شده و حکایت «سیرت سلمان» از آن است."}, {"name": "سلمان فارسی", "t": "یار و صحابی پیامبر (ص) و از سرداران مسلمان؛ الگوی فروتنی و زهد؛ او ایرانی بود که به یاری مدینه آمد و بعدها فرمانده لشکر شد."}],"gram":[{"h": "", "body": ["<b>۱) فعل گذشتهٔ (ماضی) بعید (دور):</b> جمله‌های زیر را بخوانید و به ساخت فعل آنها دقت کنید: «احمد این داستان را قبلاً خوانده بود.» / «آنها با خانوادهٔ خود به مسافرت رفته بودند.» در این جمله‌ها «خوانده بود» و «رفته بودند» فعل گذشتهٔ بعید هستند. به فعلی که در گذشتهٔ دور انجام گرفته است، فعل «گذشتهٔ بعید (دور)» می‌گویند. ساخت آن:", "نمونه از متن درس و حکایت: «پدر رابعه عهد کرده <b>بود</b>» (درس ۱۱)؛ «چادر بر جای نهید؛ بعد از آن، راه باز یافت» — و در درس ۱۲: «به لشکرگاه رسید، مردم گفتند» (ماضی ساده).", "<b>۲) فعل گذشتهٔ (ماضی) التزامی:</b> اکنون به جمله‌های زیر توجه کنید: «شاید احمد از مسافرت برگشته باشد.» / «شاید آوای پرنده‌ای را در سکوت جنگل شنیده باشی.» / «ای کاش بارش برف را در زیر نور خورشید دیده باشید.» در جمله‌های بالا «برگشته باشد»، «شنیده باشی» و «دیده باشید» فعل گذشتهٔ التزامی‌اند. به فعلی که در زمان گذشته با تردید، شرط و آرزو انجام شده باشد، فعل «گذشتهٔ التزامی» گفته می‌شود. ساخت آن:"], "tables": [], "notes": ["<b>نکته:</b> شناسه‌های ماضی بعید و التزامی یکسان‌اند (ـم، ـی، ـد/—، ـیم، ـید، ـند)؛ تفاوت در فعل کمکی است: «بود» برای بعید و «باش» برای التزامی. در حکایت سیرت سلمان: «تکبر از من دفع <b>شود</b>» (مضارع التزامی)؛ «از عهدة حفظ رعیت بیرون آمده <b>باشم</b>» (ماضی التزامی)؛ در درس: «اگر... از تو پرسیده شود، بگو نمی‌دانم» (مضارع التزامی)."]}],"arts":{"intro": [], "tables": [{"head": ["آرایه", "نمونه از درس ۱۲ و حکایت"], "rows": [["تشبیه", "«پیام پیامبر (ص)، گنجینه و آبشخوری است» (پیام به گنج و سرچشمه تشبیه شده)؛ «مثل مؤمنان، جمله چون یک تن است» (همبستگی مؤمنان به یک پیکر)"], ["تمثیل", "«مَثَلِ مؤمنان جمله چون یک تن است؛ چون یک اندام رنجی رسد...» (تمثیلِ اعضای بدن)؛ «مؤمن برای رهایی از گناه بیش از گنجشکِ در قفس تلاش می‌کند» (تمثیلِ گنجشک)"], ["مجاز", "«جان‌های پاک» (انسان‌های درستکار)؛ «برادر مسلمانت» (همهٔ مؤمنان)؛ «دل‌ها» (درون و قلب‌ها)"], ["کنایه", "«گشاده‌روی و خندان بودن» (خوش‌برخوردی)؛ «آسان‌گیر» (باگذشتی)؛ «در قدم وی افتاد» (عذرخواهی و ادب)؛ «دل تو خوش شود» (خشنود شود)"], ["تضاد و تقابل", "«جوانی/پیری، تندرستی/بیماری، بی‌نیازی/نیازمندی، آسایش/گرفتاری، زندگی/مرگ»؛ «همنشینِ نیک/بد»؛ «حقیر/امیر»"], ["تکرار / مراعات نظیر", "تکرار «ای ابوذر» (ساخت درس)، «پنج چیز»، «همنشین و تنهایی»؛ «گنجشک و قفس»؛ «لشکرگاه و لشکر»"], ["سجع", "«سخن بگوی / گشاده‌روی... باش»؛ «دفع شود / خوش شود» (قافیه‌وار نثر آرام)"], ["جناس", "«بی‌نیازی و نیازمندی»؛ «تنها و تنهایی»"]]}], "notes": []},"wb":[{"g": "خود را بیازمایید (صفحهٔ ۹۴)", "n": "۱", "q": "منظور از جملهٔ «خداوند به دل‌ها و کردارتان می‌نگرد» چیست؟", "a": ["یعنی خداوند ملاکِ ارزش و مقرب‌بودن بنده را ظاهر و زیبایی چهره، اموال و دارایی و زیبایی سخن نمی‌داند؛ آنچه نزد او ملاک است، ایمان و نیتِ درونی (دل) و اعمال و رفتارِ نیک است؛ پس آراستگیِ ظاهری بدون پاکیِ ضمیر و کردار، آدمی را پیش خدا بزرگ نمی‌کند."]}, {"g": "خود را بیازمایید (صفحهٔ ۹۴)", "n": "۲", "q": "این درس را با درس ششم (آداب زندگانی) مقایسه کنید و شباهت‌های آن را توضیح دهید.", "a": ["هر دو درس، گونهٔ «تعلیمی» دارند و به آداب رفتار و اخلاقِ نیک می‌پردازند: در هر دو دربارهٔ میزان و چگونگی سخن گفتن سفارش شده است («به اندازهٔ نیاز سخن بگوی» ← «مگوی کم گوی و به جز مصلحت خویش مگوی»)؛ در هر دو دربارهٔ هم‌نشین و دوست (همنشینِ نیک/بد؛ تخلق به اخلاق هم‌نشین) و احترام به دیگران و ادب سخن دیده می‌شود؛ نثر هر دو نصیحت‌گونه و اندرزشده است و از منابع کهن (قابوس‌نامه و اخلاق ناصری ← پیام پیامبر) برگزیده شده است؛ هر دو نیز پیوند اخلاق با خدا (خشنودی خداوند) را رعایت کرده‌اند."]}, {"g": "خود را بیازمایید (صفحهٔ ۹۴)", "n": "۳", "q": "بیت زیر با کدام بخش درس، ارتباط دارد؟ «کمال است در نفس انسان، سخن / تو خود را به گفتار، ناقص مکن» (بوستان، سعدی)", "a": ["با این سفارش پیامبر (ص) ارتباط دارد: «ای ابوذر، اگر دربارۀ چیزی که به آن علم نداری، از تو پرسیده شود، بگو نمی‌دانم تا از پیامدهای ناگوار آن در امان بمانی» و نیز «به اندازهٔ نیاز، سخن بگوی»؛ زیرا هر دو می‌گویند: ارزش انسان به کمالِ نفس و اندیشهٔ اوست نه به پرگویی؛ سخنِ سنجیده و دانش‌پایه، انسان را کامل می‌کند و پرحرفی و گفتارِ بی‌دقت، او را ناقص و در خطر می‌اندازد."]}, {"g": "خود را بیازمایید (صفحهٔ ۹۴)", "n": "۴", "q": "...................................................................................................؟", "a": ["پاسخ نمونه: از سفارش‌های پیامبر (ص) به ابوذر آموختم که فرصت‌های عمر را غنیمت بشمارم؛ در پنداری که جوانی و تندرستی همیشگی است؛ راست‌گویی را حتی در اعتراف به ندانستن رعایت کنم؛ کم و سنجیده سخن بگویم و خندان‌رو باشم و با مؤمنان همدل و مهربان باشم."]}, {"g": "گفت‌وگو (صفحهٔ ۹۵)", "n": "۱", "q": "از رفتارهای پسندیده‌ای که در این درس خوانده‌اید، کدام رفتارها در مدرسه، کاربرد بیشتری دارد؟", "a": ["راست‌گویی و اعتراف به «نمی‌دانم» در پاسخ‌دادن به پرسش‌های درسی (به‌جای پاسخ‌های بслطالله‌آمیز)؛ سخن‌گفتن به اندازهٔ نیاز و رعایت نوبت در کلاس؛ گشاده‌روی و خندان‌روی با هم‌کلاسی‌ها و معلمان؛ پرهیز از قهر و دلخوری با دوستان؛ همدلی و یاریِ یکدیگر چون اعضای یک پیکر (گروهی درس خواندن، کمک به هم‌کلاسیِ در مشکل)."]}, {"g": "گفت‌وگو (صفحهٔ ۹۵)", "n": "۲", "q": "هر گروه برای یکی از موضوع‌های رفتاری درس، داستان، خاطره یا حکایتی مناسب به کلاس عرضه کند.", "a": ["پاسخ نمونه (موضوع «راست‌گویی»): دانشمندِ بزرگی را در مجلسی پرسیدند و او با وقار گفت: «نمی‌دانم.» حاضران شگفت‌زده شدند که چگونه چنین مردی چیزی نمی‌داند؛ گفت: «دانشمندی راست‌گویم، نه دانای بی‌نهایت؛ اگر ندانسته پاسخ گویم، علم را ناقص و خود را دروغگو کرده‌ام.» — این خاطره با سفارش پیامبر (ص) به ابوذر پیوند دارد: اعتراف به ندانستن، از ما حفاظت می‌کند."]}, {"g": "خودآزمایی (صفحهٔ ۹۶)", "n": "۱", "q": "مترادف واژه‌های زیر را در متن درس بیابید و بنویسید: خوشبختی، آواز، بهره بردن، بلندمرتبه، آرزومند، دانش.", "a": ["خوشبختی = <b>سعادت</b>؛ آواز = <b>طنین (کلام)</b>؛ بهره بردن = <b>غنیمت شمردن</b>؛ بلندمرتبه = <b>متعال</b>؛ آرزومند = <b>مشتاق</b>؛ دانش = <b>علم</b>."]}, {"g": "خودآزمایی (صفحهٔ ۹۶)", "n": "۲", "q": "مانند نمونه، جدول زیر را کامل کنید. (ستون‌ها: مصدر — گذشتهٔ ساده — گذشتهٔ استمراری — گذشتهٔ مستمر — گذشتهٔ بعید — گذشتهٔ نقلی — گذشتهٔ التزامی؛ برای اول، دوم و سوم شخص)", "a": ["پاسخ نمونه با مصدر «گفتن»: ماضی ساده: گفتم/گفتی/گفت — ماضی استمراری: می‌گفتم/می‌گفتی/می‌گفت — ماضی مستمر: داشتم می‌گفتم/داشتی می‌گفتی/داشت می‌گفت — ماضی بعید: گفته بودم/گفته بودی/گفته بود — ماضی نقلی: گفته‌ام/گفته‌ای/گفته است — ماضی التزامی: گفته باشم/گفته باشی/گفته باشد. (با هر مصدر دیگری نیز همین الگو صرف می‌شود؛ مثلاً «خواندن»: خواندم/می‌خواندم/داشتم می‌خواندم/خوانده بودم/خوانده‌ام/خوانده باشم.)"]}],"notes7":[],"exam":["درس ۱۲ «پیام‌آور رحمت» از <b>«پیام پیامبر»</b> (ترجمهٔ <b>خرمشاهی و انصاری</b>)؛ فصل اسلام و انقلاب اسلامی؛ سفارش‌های پیامبر (ص) به <b>ابوذر</b>.", "اسلام دینی جهانی است؛ پیامبر (ص) رحمت و سعادت برای جهانیان؛ پیام او «گنجینه و آبشخورِ» انسانیت (تشبیه).", "سفارش‌های کلیدی: خدا به دل‌ها و کردار می‌نگرد، نه ظاهر و دارایی؛ «پنج چیز را پیش از پنج چیز غنیمت شمار» (جوانی/پیری، تندرستی/بیماری، بی‌نیازی/نیازمندی، آسایش/گرفتاری، زندگی/مرگ — پنج تضاد)؛ «نمی‌دانم» گفتنِ راست؛ سخن به اندازهٔ نیاز؛ گشاده‌روی و آسان‌گیری؛ همنشینِ نیک &gt; تنهایی &gt; همنشینِ بد (نیک‌ترین: همنشینِ نیک؛ بدترین: همنشینِ بد)؛ «مثل مؤمنان جمله چون یک تن است» (تمثیل اعضای بدن + تناسب با «بنی‌آدم اعضای یک پیکرند»)؛ قهر ممنوع؛ تلاش مؤمن بیش از گنجشکِ قفس.", "حکایت «سیرت سلمان» از <b>روضةالخُلد مجد خوافی</b> (قرن ۸، به تقلید از گلستان): فروتنیِ سلمان (امیرِ لشکر، حمل توبرهٔ کاه)؛ سه انگیزه: دفعِ تکبر، خوشیِ دلِ خادم، ادای مسئولیتِ حفظ رعیت.", "دستور کتاب: <b>ماضی بعید</b> (بن گذشته + هـ + بود + شناسه: خوانده بودم) و <b>ماضی التزامی</b> (بن گذشته + هـ + باش + شناسه: گفته باشم — با تردید/شرط/آزو: شاید...باشد، ای کاش...باشم).", "آرایه‌ها: تشبیه و تمثیل (گنجینه، آبشخور، اعضای بدن، گنجشک در قفس)؛ مجاز (جان‌های پاک، برادر مسلمان)؛ تضاد (پنج جفت)؛ سجع (بگوی/باش)؛ کنایه (گشاده‌روی، در قدم افتادن)."]},
{"id":13,"icon":"🕌","lnum":"درس سیزدهم","title":"آشنای غریبان — میلادِ گل","info":"شاعر «آشنای غریبان»: قیصر امین‌پور (غزل) | شاعر «میلاد گل»: امام خمینی (قدّس سرّه) (غزل) | موضوع: امامت و مهدویت؛ ستایش امام رضا (ع) و امام زمان (عج)","intro":"<b>پیام اصلی:</b> امامانِ معصوم، آشنایِ همهٔ عالم‌اند و جهانِ هستی با شناخت و محبتشان جان می‌گیرد؛ ولادتِ منجیِ عالم، بهارِ جانِ جهانیان و عیدِ دل‌هاست و مؤمن باید همواره آمادهٔ فرمان او باشد.","kholase":["درس ۱۳ دو غزل دارد. در غزل نخست، <b>«آشنای غریبان»</b>، قیصر امین‌پور خطاب به امام رضا (ع) می‌گوید: همهٔ هستی، آشنای توست: چشمه‌های خروشان و موج‌های پریشان تو را می‌شناسند؛ تو تشنگیِ معرفت را پاسخِ «آبی» می‌دهی و ریگ‌های بیابان تو را می‌شناسند؛ نام تو رخصتِ رویش و طراوت است و به همین سبب برگ و باران تو را می‌شناسند؛ تو گل‌های باغ جهان را می‌شناسی و تمام شهیدان (که گل‌های همیشه‌بهارِ این باغ‌اند) تو را می‌شناسند؛ اینک ای نیکو، فصلِ غریبی سرآمد (زمانِ بی‌وفایی و غربت به پایان رسید) چون تمام غریبان تو را می‌شناسند؛ و شاعر از حسرت می‌گوید: کاش من هم عبورِ تو را دیده بودم؛ کوچه‌های خراسان (مردمش) تو را می‌شناسند. <b>ردیف شعر: «تو را می‌شناسند».</b>", "در غزل دوم، <b>«میلاد گل»</b>، امام خمینی (قدّس سرّه) ولادت حضرت مهدی (عج) را بشارت می‌دهد: میلادِ گل و بهارِ جان آمد؛ برخیز که عیدِ دلشدگان (میکشان) آمد؛ خاموش مباش زیرِ این خرقه (گوشه‌نشینی و بی‌حالی مکن) که بر جانِ جهان دوباره جان آمد؛ گلزارِ عیش، لاله‌باران شد و سلطانِ زمین و آسمان آمد؛ آی آمادهٔ امر و نهی و فرمان باش و هشدار، که منجیِ جهان آمد. <b>ردیف شعر: «آمد».</b>"],"payam":"<b>پیام اصلی:</b> امامانِ معصوم، آشنایِ همهٔ عالم‌اند و جهانِ هستی با شناخت و محبتشان جان می‌گیرد؛ ولادتِ منجیِ عالم، بهارِ جانِ جهانیان و عیدِ دل‌هاست و مؤمن باید همواره آمادهٔ فرمان او باشد.","khanesh":"<b>نکتهٔ خوانش:</b> این درس با <b>لحن عاطفی</b> خوانده می‌شود: لحنی که به احساسات و عواطف پیوند دارد و با کششِ آوایی، نرمیِ آهنگ کلام، تکیه و درنگ‌های مناسب، عواطف لطیف را بازگو می‌کند.","blocks":[{"k": "sub", "t": "غزل «آشنای غریبان» — قیصر امین‌پور"}, {"k": "verse", "lines": [{"n": "۱", "hem": ["چشمه‌  کنعان، غم مخور» — ردیف: «غم مخور» (دو واژه‌ای و فعلی)؛ قافیه‌ها: کنعان/گلستان. یا غزل «الا یا ایها الساقی، ادر کأساً و ناولها» — ردیف ندارد (غزلِ بی‌ردیف). نوع ردیف می‌تواند اسم («رسید»؟)، فعل («غم مخور»)، صفت یا ترکیبی بیش از یک واژه («به یاد» در «توام آمد به یاد») باشد."]}, {"g": "خودآزمایی (صفحه‌های ۱۰۱ و ۱۰۲)", "n": "۱", "q": "هم‌خانوادهٔ واژه‌های «ترخیص، غربت، معابر، اولت (ولادت)، اعیاد، معیشت، تسلّط و نجات» را از متن درس بیابید و بنویسید.", "a": ["هم‌خانواده‌ها (از ریشه‌های مشترک): ترخیص ← <b>رخصت</b> (در بیت ۳ غزل آشنای غریبان)؛ غربت ← <b>غریبی / غریبان</b>؛ اولت (ولادت) ← <b>میلاد</b>؛ اعیاد ← <b>عید</b>؛ معابر ← <b>عبور</b>؛ (معیشت، تسلّط و نجات در متن این درس هم‌خانوادهٔ آشکاری ندارند؛ نجات با «منجی» و تسلّط با «سلطان» پیوند مفهومی دارد.)"]}, {"g": "خودآزمایی (صفحه‌های ۱۰۱ و ۱۰۲)", "n": "۲", "q": "در بیت‌های زیر، قافیه‌ها را مشخص کنید و نوع ردیف آنها را بنویسید. «ای همه هستی ز تو پیدا شده / خاکِ ضعیف از تو توانا شده» — «شد نَفِس آن دو سه همسالِ او / تنگ‌تر از حادثهٔ حالِ او»", "a": ["بیت نخست: قافیه «پیدا شده / توانا شده» — ردیف: «شده» (فعلی)؛ بیت دوم: قافیه «همسالِ او / حادثهٔ حالِ او» (روی: «ال/ـلِ او») — ردیف: «او» (ضمیری/اسمی)."]}, {"g": "خودآزمایی (صفحه‌های ۱۰۱ و ۱۰۲)", "n": "۳", "q": "ارتباط معنایی بیت زیر را با درس پیدا کنید و بنویسید. «آب زنید راه را هین که نگار می‌رسد / مژده دهید باغ را بوی بهار می‌رسد»", "a": ["این بیت مشهور (در بهار و آمدنِ نگار) با غزل «میلاد گل» ارتباط دارد: آمدنِ بهار و نگار، نمادِ ولادتِ حضرت مهدی (عج) است؛ چنان‌که در میلاد او «گلزار عیش لاله‌باران شد» و جهان چون باغِ بهاری، آمادهٔ استقبال از «سلطان زمین و آسمان» می‌شود؛ در هر دو، آمدنِ محبوب، بشارت و شادی می‌آورد و از مخاطبان می‌خواهد آمادهٔ استقبال شوند (برخیز که عید می‌کشان آمد ← آب زنید راه را...)."]}, {"g": "خودآزمایی (صفحه‌های ۱۰۱ و ۱۰۲)", "n": "۴", "q": "جدول را کامل کنید. (جدول ۱۲ خانه‌ای)", "a": ["۱) دروازهٔ آن در روان‌خوانی فصل چهارم آمده است: <b>آسمان</b> («دروازه‌ای به آسمان»)؛ ۲) یکی از پیشوندها: <b>با</b>؛ ۳) مشقِ میان‌تهی: <b>مق</b>؛ ۴) نشانۀ مفعول: <b>را</b>؛ ۵) بخشی از نام فصل پنجم کتاب‌های فارسی: <b>انقلاب اسلامی</b> (فصل «اسلام و انقلاب اسلامی»)؛ ۶) اگر برعکس بخوانید، کتابتان با آن آغاز می‌شود: <b>شیاتس</b> (= «ستایش» برعکس؛ کتاب با «به نام خداوند جان و خرد»/صفحهٔ ستایش آغاز می‌شود)؛ ۷) مخالف آشنایی: <b>دشمنی</b>؛ ۸) دوستان: <b>یاران</b>؛ ۹) جهت: <b>سو</b>؛ ۱۰) نام یکی از سوره‌های قرآن که از آن به نام «قلب قرآن» یاد شده است: <b>یس</b>؛ ۱۱) یکی از ضمایر: <b>او</b>؛ ۱۲) «........ گوش کن جانا که از جان دوست‌تر دارند / جوانان سعادتمند، پند پیر دانا را» (حافظ): <b>نصیحت</b>."]}],"notes7":[],"exam":["درس ۱۳ = دو غزل: <b>«آشنای غریبان» از قیصر امین‌پور</b> (ستایش امام رضا ع؛ ردیف: «تو را می‌شناسند») و <b>«میلاد گل» از امام خمینی</b> (ولادت امام زمان عج؛ ردیف: «آمد»).", "«آشنای غریبان»: چشمه‌های خروشان و موج‌های پریشان تو را می‌شناسند؛ «پرسش تشنگی را تو آبی»؛ نام تو رخصت رویش و طراوت است؛ فصل غریبی سرآمد؛ کاش من هم عبور تو را دیده بودم (تلمیح به عبور امام رضا ع از نیشابور؛ «کوچه‌های خراسان» مجاز از مردم خراسان).", "«میلاد گل»: میلاد گل و بهار جان آمد / برخیز که عید می‌کشان آمد؛ خاموش مباش زیر این خرقه؛ گلزار عیش لاله‌باران شد؛ سلطان زمین و آسمان آمد؛ آمادهٔ امر و نهی باش؛ هشدار که منجی جهان آمد.", "دانش ادبی کتاب: <b>ردیف</b> = واژه یا واژه‌هایی پس از قافیه، با معنای یکسان تکرار می‌شوند؛ آهنگ و ظرفیت معنایی شعر را می‌افزاید؛ اسم/فعل/صفت/بیش از یک واژه («تو را می‌شناسند»، «آمد»، «غم مخور»، «به یاد»).", "آرایه‌ها: تشخیص (چشمه‌ها می‌شناسند)؛ تشبیه (تو آبی)؛ استعاره (گل=انسان‌های خوب، باغ=دنیا، سلطان و منجی=حضرت مهدی عج)؛ تلمیح (عبور از نیشابور)؛ جناس (جان/جهان)؛ تضاد (امر/نهی، زمین/آسمان)؛ مراعات نظیر (میلاد، گل، بهار، عید).", "تاریخ ادبیات: قیصر امین‌پور (۱۳۳۸–۱۳۸۶): دستور زبان عشق، آینه‌های ناگهان، گل‌ها همه آفتاب‌گردان‌اند، مثل چشمه مثل رود، به قول پرستو، ظهر روز دهم. امام خمینی (۱۲۸۱–۱۳۶۸): دیوان اشعار (غزلیات عرفانی)، چهل حدیث.", "نکتهٔ زبانی: «را» در «تو را می‌شناسند» مفعولی و در «پرسش تشنگی را» به معنی «برای»؛ «دیده بودم» ماضی بعید؛ «کاش» شبه‌جمله."]},
{"id":14,"icon":"✨","lnum":"درس چهاردهم","title":"پیدای پنهان","info":"سرآغاز: بیت مولانا محمود شبستری | متن: توحید مُفَضَّل، ترجمهٔ علامه مجلسی (با اندکی تصرّف) | نوع متن: نثرِ علمی–تعبیری (استدلالی) | موضوع: نشانه‌های خداوند در بدن و هستی","intro":"<b>پیام اصلی:</b> جهان و به‌ویژه بدنِ انسان، کتابِ تدبیر و رحمتِ خداوند است؛ هر عضو برای هدف و حاجتی آفریده شده؛ دانستن این نشانه‌ها، دل را از شک و «طبیعت‌گرایی» بیرون می‌آورد و به توحید می‌رساند؛ خدا «پیدای پنهان» است: از شدتِ آشکاری، پنهان است.","kholase":["درس ۱۴ با بیتی از <b>محمود شبستری</b> آغاز می‌شود: «جهان، جمله، فروغِ رویِ حق دان / حق اندر وی ز پیدایی است، پنهان» — یعنی بدان که همگی جهان، روشنیِ چهرهٔ خداست؛ خدا در آن، از شدتِ پیدا بودن، پنهان است (همه‌جا هست و آشکار، اما چون درِ همه چیز است، از چشمِ غافلان پنهان می‌ماند). سپس داستانی از <b>توحید مفضل</b> (گفت‌وگوی امام صادق (ع) با مفضل بن عمر) می‌آید: «مفضل» روضه‌ای (باغ و زمینی) در نزدیکی مزار شهدای [چین‌آباد] داشت که در آن به خرید و فروشِ عطر و بخور مشغول بود و از این راه اندکی روزی به دست می‌آورد. روزی دوستان و آشنایانی نزد او آمدند؛ مفضل از نظم و شگفتیِ آفرینش شگفت‌زده شد و اعتراف کرد که اگر عقل و تدبیرِ الهی در کار نبود، این ترتیبِ شگفت محقق نمی‌شد؛ اما آنان گفتند: این‌ها کارِ «طبیعت» است! مفضل اندوهناک نزد امام صادق (ع) رفت و ماجرا را گفت. امام فرمود: «ابتدا می‌کنم ای مفضل، به یاد کردنِ خلقت انسان؛ پس عبرت گیر از آن» و سپس در سراسر اعضای بدن، تدبیرِ خداوند را نشانش داد: دست‌ها برای کار کردن، پاها برای راه رفتن، چشم‌ها برای دیدن؛ دل را در میان سینه و پنهان (زیر پرده‌ای که جامهٔ داخلی است) قرار داده و دنده‌ها بر بالای آن، با گوشت و پوستی، حافظش کرده تا آسیب به آن نرسد؛ شُش را بادزنِ دل قرار داده که پیوسته در حرکت است تا حرارت در دل جمع نشود و آدمی را تلف کند. سپس قوه‌ها و فواید آنها را برمی‌شمارد: اگر حافظه نبود، حال آدمی و کارهایش به هم می‌ریخت و هیچ‌کس از مصیبتی آرامش نمی‌یافت و کینه از سینه بیرون نمی‌رفت؛ <b>نعمتِ فراموشی</b> نیز — اگر تأمل کنی — عظیم‌تر از نعمت یادآوری است. آن‌گاه دلیلِ آفرینشِ تمام اعضا را «هدایت و ابتی» (رسیدن به کمال) می‌داند: چه کسی آن تدبیرِ شگفت را در این طبیعت انجام داده؟ اگر بگویند طبیعتِ دانا و قدرتمند، پس به خدا قائل شده‌اند و تنها نامش را «طبیعت» گذاشته‌اند (زیرا طبیعتِ بی‌شعور، شعور و اراده ندارد)؛ و اگر بگویند طبیعت بی‌علم و بی‌اراده است، پس معلوم است این کارها از طبیعتِ بی‌شعور صادر نمی‌شود. امام سپس در آفرینش حیوانات (دستِ فیل برای خوردن، پشمِ گوسفند برای پوشش، ... ) و آسمان و زمین و ستارگان و آب و نان، تدبیر و رحمتِ خدا را می‌نماید: نکتهٔ نهایی آن‌که خداوند دانایی را به آدمی داده، جز آنچه صلاح دین و دنیای اوست؛ و دانستنِ برخی چیزها را که در شأن و طاقت او نیست، منع کرده — نظیر امور آینده و آنچه در دل‌های مردم است؛ عمرِ کوتاه و دراز و ترتیبِ معیشت (روزیِ نان و آب) نیز به تدبیر اوست: چون آدمی به آب شدیدتر محتاج است تا به نان، آب فراوان و روان گردانیده شده است. سرانجام امام به مفضل فرمود: «چه کسی در همهٔ هستی، هر چه را می‌بینی، به بهترین وجه و اندازه کامل کرده؟» مفضل پس از شنیدنِ این آموزه‌ها شاد و روشن‌دل بازگشت؛ معرفت بر او حاصل شد، نماز را به جای آورد و خدا را سپاس گفت."],"payam":"<b>پیام اصلی:</b> جهان و به‌ویژه بدنِ انسان، کتابِ تدبیر و رحمتِ خداوند است؛ هر عضو برای هدف و حاجتی آفریده شده؛ دانستن این نشانه‌ها، دل را از شک و «طبیعت‌گرایی» بیرون می‌آورد و به توحید می‌رساند؛ خدا «پیدای پنهان» است: از شدتِ آشکاری، پنهان است.","khanesh":"","blocks":[{"k": "sub", "t": "بیت سرآغاز درس — محمود شبستری"}, {"k": "verse", "lines": [{"n": "۱", "hem": ["جهان، جمله، فروغِ رویِ حق دان", "حق اندر وی ز پیدایی است، پنهان"]}], "mean": [["معنی", "بدان که همگی جهان، روشنی و پرتوِ چهرهٔ خداوند است؛ خداوند در آن، از شدتِ پیدا و آشکار بودن، پنهان است (همه‌جا حاضر و نمایان است و همینِ شدتِ ظهور، او را از چشم‌های غافل پنهان می‌دارد)."], ["لغت", "فروغ: روشنایی و پرتو / روی: چهره / حق: خداوند / دان: مخفف «بدان»."], ["آرایه", "تشبیه در مصراع اول (جهان به نورِ خداوند تشبیه شده)؛ ترکیب اضافی «روی حق» (به معنای چهرهٔ خداوند)؛ تضاد میان «پیدایی و پنهانی»؛ تناقض‌نما در مصراع دوم (ز پیدایی... پنهان: از شدتِ پیدا بودن، پنهان است)."], ["دستور", "«جهان» مفعول؛ «جمله» قید (همگی)؛ «وی» متمم؛ «پنهان» مسند؛ «دان» فعل امر؛ بیت دارای دو جمله است."]]}, {"k": "sub", "t": "معنی متن درس — توحید مفضل، ترجمهٔ علامه مجلسی (با اندکی تصرّف)"}, {"k": "prose", "t": "مفضل، روضه‌ای در نزدیکی مزار شهدای [چین‌آباد] داشت که در آن به خرید و فروشِ عطر و بخور مشغول بود... مفضل از نظم و شگفتیِ آفرینش به اعترافِ تدبیرِ الهی درآمد که اگر عقل و تدبیر در کار نبود، این ترتیبِ شگفت به این صورت محقق نمی‌شد؛ دوستان گفتند: «این‌ها کارِ طبیعت است.» مفضل، اندوهناک، نزد امام صادق (ع) رفت و ماجرا را برای ایشان گفت.", "mean": [["معنی (بازگوی)", "مفضل بن عمر باغ و زمینی در نزدیکی مزار شهدا داشت و به خرید و فروشِ عطر و بخور مشغول بود. روزی دوستانش نزد او آمدند؛ مفضل از نظم و ترتیبِ شگفتِ هستی شگفت‌زده شد و اعتراف کرد که جز با عقل و تدبیرِ الهی این ترتیب پدید نمی‌آمد؛ اما دوستان آن را کارِ «طبیعت» دانستند. مفضل اندوهگین شد و ماجرا را به امام صادق (ع) گزارش کرد."], ["مفهوم", "نظمِ روزی و معیشتِ مردم، نشانهٔ تدبیر و عقلِ الهی است، نه طبیعتِ بی‌شعور."], ["لغت", "سودا کردن: خرید و فروش کردن / احوال: جمع حال، حال‌ها / متانت: وقار و سنگینی."], ["یادآوری", "نام آن مکان در سطر آغازین متن کتاب (صفحهٔ ۱۰۳) با خطّ نستعلیق فشرده نوشته شده و به‌روشنی خوانا نیست؛ جزئیتِ نام مکان، مبحثِ امتحانی نیست و در معنی، اثر ندارد."]]}, {"k": "prose", "t": "امام در پاسخ، کلماتِ آغازینش را چنین بیان فرمودند: «ابتدا می‌کنم ای مفضل، به یاد کردنِ خلقتِ انسان؛ پس عبرت گیر از آن. تفکر کن ای مفضل، در همۀ اعضای بدن و تدبیرِ آنها که هر یک برای هدفی و حاجتی آفریده شده‌اند؛ دست‌ها برای کار کردن، پاها برای راه رفتن، چشم‌ها برای دیدن؛ در بقیع اعمال، شگفتی کنی، می‌بینی هر یک برای کاری نهاده شده‌اند.»", "mean": [["معنی", "امام صادق (ع) فرمود: «ای مفضل، از یادکردِ آفرینشِ انسان آغاز می‌کنم؛ از آن عبرت بگیر. در همهٔ اعضای بدن و تدبیرِ آنها بیندیش که هر عضو برای هدفی و نیازی آفریده شده است: دست‌ها برای کارکردن، پاها برای راه‌رفتن و چشم‌ها برای دیدن؛ در دیگر کارها نیز شگفتی کنی، می‌بینی هر چیز برای کاری معیّن آفریده شده است.»"], ["دستور", "«ابتدا می‌کنم» مضارع اخباری؛ «ای مفضل» منادا و ندا؛ «برای هدفی» متمم؛ «ی» نکره در «هدفی»؛ «پاها و چشم‌ها» جمع با «ها»."]]}, {"k": "prose", "t": "مفضل گفت: «ای مولای من! گروهی می‌گویند که این‌ها کارِ طبیعت است.» فرمود: «بپرس از ایشان که آیا این طبیعت که شما می‌گویید، علم و قدرت دارد بر این کارها یا نه؟ اگر گویند که علم و قدرت دارد، پس به خدا قائل شده‌اند و او را «طبیعت» نام کرده‌اند؛ زیرا معلوم است که طبیعت را شعور و اراده نیست؛ و اگر گویند که طبیعت را علم و اراده نیست، پس معلوم است که این کارها از طبیعتِ بی‌شعور، صادر نمی‌شود.»", "mean": [["معنی", "مفضل گفت: «ای سرور من! برخی می‌گویند این‌ها کار طبیعت است.» امام فرمود: «از آنان بپرس: طبیعتی که می‌گویید، بر انجامِ این کارهای شگفت، دانش و قدرت دارد یا نه؟ اگر بگویند دارد، پس در حقیقت به خداوندِ دانا و توانا اقرار کرده‌اند و تنها نامش را «طبیعت» نهاده‌اند (زیرا روشن است که طبیعتِ بی‌جان، شعور و اراده ندارد)؛ و اگر بگویند طبیعت علم و اراده ندارد، پس روشن است این کارها از طبیعتِ بی‌شعور صادر نمی‌شود (پس سازنده‌ای دانا باید داشته باشد).»"], ["مفهوم", "استدلالِ امام: هر اثرِ نظم‌مند، سازنده‌ای دانا و توانا می‌خواهد؛ نامیدنِ آن سازنده به «طبیعت»، حقیقت را تغییر نمی‌دهد."], ["دستور", "«بپرس» فعل امر؛ «بر» در «قدرت دارد بر این کارها» متمم؛ «گویند» مضارع اخباری؛ «قائل شده‌اند» ماضی نقلی؛ «صادر نمی‌شود» مضارع مجهول/منفی."]]}, {"k": "prose", "t": "ای مفضّل! چه کسی دل را در میانِ سینه قرار داده و پنهان کرده و پیراهنی — که پردهٔ دل است — بر روی آن پوشانده و دنده‌ها بر بالای آن حافظِ گردانیده، با گوشت و پوستی که بر روی دنده‌ها قرار داده، برای آنکه از خارج، چیزی بر آن وارد نشود که موجب جراحتِ آن گردد؟ چه کسی شُش را بادْزنِ دل قرار داده — که پیوسته در حرکت است و باز نمی‌ایستد — برای آنکه حرارت در دل جمع نشود که آدمی را تلف کند؟", "mean": [["معنی", "چه کسی قلب را در میان سینه، در جای امن و پنهان نهاده و آن را با پرده‌ای (از جامه‌های درونی) و سپس با قفسهٔ دنده‌ها و گوشت و پوست، حفظ کرده تا چیزی از بیرون به آن آسیب (زخم) نرساند؟ و چه کسی شش‌ها را بادزنِ (پرخ‌کنندهٔ خونِ) دل قرار داده که پیوسته در حرکت‌اند و نمی‌ایستند تا دمایِ دل بالا نرود و آدمی را از بین نبرد؟"], ["لغت", "بادزن: وسیلهٔ پر کردنِ هوا و خنک‌کردن / جراحت: زخم و آسیب / تلف کردن: از بین بردن / گردانیده: قرار داده."], ["آرایه", "«پیراهنی که پردهٔ دل است» تشبیه؛ «بادزنِ دل» تشبیه (شش به بادزن)؛ «حافظ گردانیده» جان‌بخشی؛ پرسش‌های انکاری–استدلالی (جواب: خداوند)."], ["دستور", "«چه کسی» گروه نهادی پرسشی؛ «قرار داده» ماضی ساده؛ «برای آنکه» پیوندِ وابسته‌ساز؛ «نشود» و «کند» مضارع؛ «پیوسته» قید."]]}, {"k": "prose", "t": "ای مفضّل! اکنون تامّل کن در قوه‌ها و فوایدِ آنها که حق تعالی در وجودِ انسان قرار داده است. اگر از این قوّه‌ها حافظه را نمی‌داشت، چگونه بود حال او و چه خلل‌ها داخل می‌شد در امور و زندگانی و کارهای او! زیرا در خاطرش نمی‌ماند که از او چه در نزد مردم است و از مردم چه در نزدِ اوست؛ چه داده است و چه گرفته است و در خاطرش نمی‌ماند آنچه دیده و آنچه شنیده و آنچه گفته و آنچه به او گفته‌اند و به یاد نداشت که چه کسی به او نیکی کرده و چه کسی به او بدی کرده است و چه چیز نفع دارد او را و چه چیز ضرر دارد.", "mean": [["معنی", "ای مفضل! در توانایی‌ها و فوایدِ نیروهایی که خداوند در انسان نهاده تأمل کن: اگر «حافظه» (نیروی نگه‌داشتنِ یادها) را نمی‌آفرید، حالِ آدمی چگونه بود و چه آسیب‌ها به کارها و زندگی‌اش می‌رسید! چون در یادش نمی‌ماند که نزد مردم چه اعتباری دارد و مردم نزد او چه جایگاهی؛ چه داده و چه گرفته؛ آنچه را دیده، شنیده، گفته و آنچه به او گفته‌اند و این‌که چه کسی به او نیکی و چه کسی بدی کرده و چه چیزی به سود اوست و چه چیزی به زیانش."], ["دستور", "«اگر... نمی‌داشت» ماضی التزامی/شرطی ساخت قدیم؛ «چه» واژهٔ پرسشی (صفت/مفعول پرسشی)؛ «داده و گرفته، دیده، شنیده، گفته» صفت‌های وصفی و ماضی نقلی‌گونه؛ «به یاد نداشت» فعل + متمم."], ["آرایه", "«داده و گرفته، نیکی و بدی، نفع و ضرر» تضاد (سه جفت)؛ «چه» تکرار (ردیف‌گونه)."]]}, {"k": "prose", "t": "و نعمتِ فراموشی در آدمی، اگر تأمّل کنی، عظیم‌تر است از نعمتِ یادآوری. اگر فراموشی در آدمی نبود، هیچ‌کس از مصیبتی آرامش نمی‌یافت و کینۀ هیچ‌کس از سینۀ او بیرون نمی‌شد و از هیچ‌یک از نعمت‌های دنیا بهره‌مند نمی‌شد؛ برای آنکه آسیب‌هایی که بر او وارد شده، همیشه در برابرِ او بود و امید نداشت که شخصی که دشمن اوست، از احوالِ او غافل گردد؛ یا حسودی، لحظه‌ای از لحظه‌ها بر او مسلط شود.", "mean": [["معنی", "و اگر بیندیشی، نعمتِ فراموشی در انسان، بزرگ‌تر از نعمتِ یادآوری است: اگر فراموشی نبود، هیچ‌کس پس از مصیبتی آسوده نمی‌شد و کینه از سینه بیرون نمی‌رفت و از هیچ نعمتی از نعمت‌های دنیا بهره نمی‌برد؛ زیرا رنج‌هایی که بر او وارد شده، همیشه پیشِ چشمش می‌ماند و امید نمی‌داشت دشمن از حالِ او غافل شود یا حسود لحظه‌ای بر او چیره شود (و فراموشی، این مرهمِ دل، غم و کینه را می‌شوید)."], ["دستور", "«عظیم‌تر» صفت برتر (تفضیلی)؛ «نمی‌یافت، نمی‌شد، نمی‌برد» ماضی استمراری منفی؛ «بر او» متمم؛ «هیچ‌کس» نهاد نکره؛ «لحظه‌ای» ی نکره."], ["آرایه", "مقایسه (فراموشی عظیم‌تر از یادآوری)؛ «سینه» مجاز از دل."]]}, {"k": "prose", "t": "ای مفضّل! تامّل کن در مُلکِ درخت‌ها و گونه‌های مختلفِ آنها و خواصِّ شگفتِ میوه‌ها و برگ‌ها... و تامّل کن در تدبیرِ عالمِ حیوانات: چه کسی به حیوانات، دست‌های بلند بخشیده که به دستِ آنها دستِ (فیل) به دهانش می‌رسد و به وسیلهٔ آن غذا را به دهان می‌برد؟ و چه کسی به گوسفند پشم و به کرم، ابریشم داده؟ ... اگر طبیعتِ منظم می‌بود، این همه گونه‌ها و خواصِ شگفت از کجا پدید می‌آمد؟", "mean": [["معنی", "امام سپس به آفرینشِ گیاهان و حیوانات اشاره می‌کند: در فراوانیِ گونه‌های درختان و خواصِّ شگفتِ میوه‌ها و برگ‌ها، و در تدبیرِ عالمِ جانوران بیندیش: چه کسی به فیل دستِ (خرطوم‌مانندِ) بلند داده تا غذا را به دهان برساند؟ چه کسی به گوسفند پشمِ گران‌بها و به کرمِ ابریشم، ابریشمِ نرم داده تا انسان از آن‌ها بپوشد و ببافد؟ (و به همین‌ترتیب در آسمان و ستارگان و زمین و آب و نان). اگر کارِ «طبیعتِ» بی‌تدبیر بود، این‌همه گونه و خواصِ سودمند پدید نمی‌آمد — همه، نشانهٔ خداوندِ تدبیرگر است."], ["مفهوم", "تنوعِ سودمندِ آفرینش، دلیلِ تدبیر و رحمتِ خداست."], ["دستور", "«می‌رسد و می‌برد» مضارع اخباری؛ «داده است» ماضی نقلی؛ «به وسیلهٔ آن» متمم؛ «شگفت» صفت."]]}, {"k": "prose", "t": "ای مفضّل! چه کسی این دو ماء — نان و آب — روان و گوارا گردانیده؟ (چون آدمی به آب شدیدتر احتیاج دارد،) آب را فراوان و در همه جا روان گردانیده است... و اگر انسان را هرگز دردی نرسد، به چه چیز ترکِ گناهان را می‌کرد و به چه چیز توبه را پیشه می‌کرد و به چه چیز مهربانی به مردم و صدقات به محتاجان را جایز می‌شمرد؟ ... و نیز: چه کسی موانعِ راهِ کمال را برمی‌دارد و راهِ پیشرفت و روزی را در پیشِ انسان می‌گشاید؟", "mean": [["معنی", "امام در پایان، حکمتِ روزی و مصیبت را می‌گوید: چه کسی آبِ گوارا را فراوان و روان ساخته (زیرا آدمی به آب، نیازمندتر از نان است و تحملِ تشنگی از گرسنگی دشوارتر است)؟ و اگر هیچ دردی به انسان نمی‌رسید، با چه چیزی ترکِ گناه را می‌آموخت و توبه را پیشه می‌کرد و مهربانی و صدقه به محتاجان را به جا می‌آورد؟ (پس بیماری‌ها و گرفتاری‌ها نیز حکمت دارند: توبه، رشد و نیکوکاری.) و چه کسی همهٔ موانعِ راهِ کمال را برمی‌دارد و راهِ پیشرفت را می‌گشاید؟ همه، کارِ خداوندِ حکیم است."], ["دستور", "«می‌کرد و می‌شمرد» ماضی استمراری (در جملهٔ شرطی)؛ «را» در «راهِ پویا را» فک اضافه‌گونه/مفعول؛ «هرگز» قید."]]}, {"k": "prose", "t": "مفضل گفت: چون ساعتِ دوازدهم رسید، مولای من فرمود: «برو و اکنون با نگاهی نو به نظامِ (بسیار درستِ) هستی بنگر.» چون بازگشتم، معرفت بر من حاصل شد؛ شاد و روشن‌دل شدم، نماز را به جای آوردم و خدا را ستایش کردم.", "mean": [["معنی", "مفضل گفت: چون پایانِ ساعتِ گفت‌وگو رسید، امام صادق (ع) به من فرمود: «برو و اکنون با چشمِ تازه به نظامِ آفرینش بنگر.» من شادان و نورانی بازگشتم؛ معرفت (توحید) بر من حاصل شد و نمازِ معرفت را به جای آوردم و خدا را ستایش کردم."], ["مفهوم", "میوهٔ تأمل در نشانه‌های خدا، ایمانِ روشن و شادیِ دل و عبادت است."], ["دستور", "«رسید» و «فرمود» ماضی ساده؛ «برو» فعل امر؛ «بازگشتم، آوردم، کردم» ماضی ساده؛ «چون» حرف ربط."]]}, {"k": "sub", "t": "شعرخوانی «بود قدر تو افزون از ملایک» — دوبیتی‌های بابا طاهر همدانی"}, {"k": "verse", "lines": [{"n": "۱", "hem": ["دلی دیرُم خریدارِ محبت", "کز او گرم است بازارِ محبت"]}], "mean": [["معنی", "دلی دارم که خواهان و طالبِ محبت (خدا) است و از همین دل است که بازارِ محبت و دوستی گرم و پررونق است."], ["آرایه", "مراعات نظیر «خریدار و بازار»؛ «گرم بودنِ بازار» کنایه از پررونق بودنِ دوستی."], ["دستور", "سه جمله؛ «دیرُم» = «دارم» (فعل اسنادی‌وار)؛ «کز» = «که از» (حرف ربط + حرف اضافه)."]]}, {"k": "verse", "lines": [{"n": "۲", "hem": ["لباسی دوختم بر قامتِ دل", "ز پودِ محنت و تارِ محبت"]}], "mean": [["معنی", "برای تنِ (قد و اندامِ) دل خود، لباسی دوخته‌ام که پودِ آن از رنج و تارِ آ م بودنِ بازار» (پررونق بودن محبت)؛ «سنگ بر پا آمدن» (دچارِ مشکل شدن)؛ «جهان بر کسی تنگ آید» (دچارِ رنج و ناراحتی شدن)؛ «ننگت آید» (شرمسار شوی)"], ["استعاره / مجاز", "«بازارِ محبت» (دنیای محبت)؛ «نامه‌خوانان» (فرشتگانِ حساب)؛ «سینه» (دل)؛ «دوست» (خداوند)"], ["جناس", "«محنت و محبت»؛ «دوست و پوست»؛ «سنگ و تنگ»"], ["پرسش انکاری–استدلالی", "«چه کسی دل را در میانِ سینه قرار داده...؟»؛ «چه کسی شُش را بادْزنِ دل قرار داده...؟» (پاسخِ همه: خداوند — برای اثباتِ تدبیرِ الهی)"], ["تلمیح", "«چو فردا نامه‌خوانان نامه خوانند» (قیامت و صحیفهٔ اعمال)؛ «ملایک» (فرشتگان)"], ["مراعات نظیر", "«دل، سینه، پرده، دنده، شش»؛ «خریدار، بازار، تار و پود»؛ «قبر، قبرستان، کفن، خاک»"]]}], "notes": []},"wb":[{"g": "خود را بیازمایید (صفحهٔ ۱۰۸)", "n": "۱", "q": "پاسخِ شخصِ گمراه به مفضل چه بود؟", "a": ["گفت این‌ها (نظم و ترتیبِ شگفتِ آفرینش) کارِ «طبیعت» است؛ یعنی آفرینش را بی‌سازنده و بی‌تدبیرگر دانست و نظمِ حیرت‌انگیزِ عالم را به طبیعتِ بی‌شعور نسبت داد."]}, {"g": "خود را بیازمایید (صفحهٔ ۱۰۸)", "n": "۲", "q": "این درس را با درس اول («آفرینش همه تنبیه خداوندِ دل است») مقایسه کنید و شباهت‌های آنها را بیان کنید.", "a": ["هر دو درس، توحیدی و ستایشِ آفرینش‌اند: هر دو می‌گویند همهٔ هستی، نشانه (آیه) و جلوهٔ خداوند است — سعدی: «این همه نقش بر در و دیوارِ هستی» و «کوه و دریا و درختان در تسبیح‌اند»؛ مفضل/امام صادق (ع): تدبیرِ خدا در اعضای بدن و گیاهان و حیوانات؛ در هر دو، مخاطب به تفکر و عبرت‌گیری از آفرینش فراخوانده می‌شود («فکرت کن» سعدی؛ «تفکر کن ای مفضل»)؛ هر دو انسانِ غافل را از خوابِ غفلت بیدار می‌کنند (نرگسِ بیدار و بنفشهٔ خفته سعدی ↔ بیدارشدنِ مفضل با معرفت) و هر دو به شکرِ نعمت‌های خداوند (خوشهٔ زرینِ عنب و حقهٔ یاقوتِ انار در درس ۱ ↔ حافظه، فراموشی، آب و نان در درس ۱۴) می‌رسند."]}, {"g": "خود را بیازمایید (صفحهٔ ۱۰۸)", "n": "۳", "q": "چرا خداوند بزرگ، نعمت تفکر و اندیشیدن را به انسان‌ها بخشید؟", "a": ["پاسخ نمونه: تا با اندیشیدن در نشانه‌های آفرینش (اعضای بدن، نظمِ عالم، نعمت‌ها) به خداشناسی و توحید برسند و از غفلت و خیالِ «طبیعت‌گرایی» بگریزند؛ تفکر، کلیدِ معرفت است: «تفکر کن ای مفضل، در همۀ اعضای بدن و تدبیرِ آنها»؛ با اندیشه است که انسان شکرگزار نعمت‌ها، عبرت‌گیر از مصیبت‌ها و کارآمد در زندگیِ دنیا و آخرت می‌شود."]}, {"g": "خود را بیازمایید (صفحهٔ ۱۰۸)", "n": "۴", "q": "...................................................................................................؟", "a": ["پاسخ نمونه: از درس «پیدای پنهان» آموختم که بدنِ خودم را آینه‌ای برای شناختِ خدا کنم: هر بار که دست به کار می‌برم، راه می‌روم، چیزی به یاد می‌آورم یا فراموش می‌کنم، به تدبیرِ شگفتِ خدا در «دست و پا و حافظه و فراموشی» پی می‌برم و خدا را شکر می‌گویم؛ خدا پیداست و از شدتِ پیدا بودن، بر غافلان پنهان می‌ماند."]}, {"g": "گفت‌وگو (صفحهٔ ۱۰۹)", "n": "۱", "q": "دربارۀ تأثیر صلهٔ رحم و احسان به خویشاوندان، با یکدیگر گفت‌وگو کنید.", "a": ["پاسخ نمونه: صلهٔ رحم (دید‌و بازدید و نیکی به بستگان) پیوندِ خانواده و جامعه را استوار می‌کند، برکتِ روزی و عمر می‌آورد (به فرمودهٔ دینی: صلهٔ رحم عمر را افزایش می‌دهد)، دلتنگی‌ها را می‌شوید و مهر را در خاندان زنده نگه می‌دارد؛ احسان به خویشاوندان، مایهٔ محبتِ مردم و نزدیکی به خدا است و جامعه را چون اعضای یک پیکر همدل می‌کند."]}, {"g": "گفت‌وگو (صفحهٔ ۱۰۹)", "n": "۲", "q": "دربارۀ آیات ۳ و ۴ سورهٔ «الرحمان» (خداوند انسان را آفرید [و] به او نطق و بیان آموخت)، بحث کنید و نتیجه را به کلاس گزارش دهید.", "a": ["پاسخ نمونه: این آیات (الرحمان/۳–۴: «خداوند انسان را آفرید و بیان را به او آموخت») با درس ما پیوند دارد: خداوند نه‌تنها بدن و اعضای انسان را با تدبیر آفریده (دست، پا، چشم، دل و شش — آن‌چه امام صادق ع برشمرد)، بلکه نعمتِ بزرگِ «نطق و بیان» (سخن‌گفتن) را نیز به او آموخته است؛ پس همهٔ توانایی‌های جسمی و ذهنیِ ما، آموزشدیده و بخششِ خداست و باید در شکر و نیکوکاری به کار رود."]}, {"g": "خودآزمایی (صفحهٔ ۱۰۹)", "n": "۱", "q": "ده واژه را که ارزش املایی دارند، از متن درس بیابید و بنویسید.", "a": ["پاسخ نمونه: توحید، مفضل، ترجمه، تصرّف، طبیعت، شعور، اراده، جراحت، قوّه، اندوهناک (همچنین: حافظه، فراموشی، مصیبت، متانت، شایسته، خلل، امور، قائل)."]}, {"g": "خودآزمایی (صفحهٔ ۱۰۹)", "n": "۲", "q": "جمله‌های زیر را بخوانید و قیدهای آن را مشخص کنید. الف) تو هم، شایسته سخن بگو. ب) من فعلاً کاری ندارم. ت) همايون دوباره برنده شد. پ) محمد چرا دیروز غایب بود؟", "a": ["الف) «شایسته» (قید حالت — چگونگیِ سخن‌گفتن)؛ ب) «فعلاً» (قید زمان)؛ ت) «دوباره» (قید تکرار)؛ پ) «چرا» (قید پرسشی/علّت) و «دیروز» (قید زمان)."]}, {"g": "خودآزمایی (صفحهٔ ۱۰۹)", "n": "۳", "q": "بیت زیر را بخوانید و ارتباط آن را با متن درس، در یک بند بنویسید. «جهان چون زلف و خال و خط و ابروست / که هر چیزی به جای خویش نیکوست» (محمود شبستری)", "a": ["پاسخ: شبستری در این بیت می‌گوید: جهان، چون چهرهٔ زیبا (زلف و خال و خط و ابرو) است و هر چیز در جای خود نیکوست؛ یعنی همانندِ زلف و خال که هر یک به جای خود در چهره زیبایی می‌بخشد، هر جزءِ آفرینش نیز در جای خود، نیکو و حکیمانه است. این پیوند مستقیم با درس دارد: امام صادق (ع) در توحیدِ مفضل همین را با مثال‌های بدن نشان می‌دهد: «هر یک برای هدفی و حاجتی آفریده شده‌اند؛ دست‌ها برای کار کردن، پاها برای راه رفتن، چشم‌ها برای دیدن» — نظمِ جای‌گرفتهٔ همهٔ اجزا (چه در بدن، چه در جهان) نشانهٔ تدبیرِ خداوندِ «پیدای پنهان» است و هر چیز به جای خویش، نیکوست."]}],"notes7":[],"exam":["درس ۱۴ «پیدای پنهان»: نثرِ <b>توحید مفضل، ترجمهٔ علامه مجلسی، با اندکی تصرّف</b> (گفت‌وگوی امام صادق (ع) و مفضل بن عمر) + بیت سرآغاز از <b>محمود شبستری</b> (گلشن راز) + شعرخوانی <b>«بود قدر تو افزون از ملایک» = دوبیتی‌های بابا طاهر همدانی</b>.", "بیت کلیدی: «جهان، جمله، فروغِ رویِ حق دان / حق اندر وی ز پیدایی است، پنهان» — جهان = روشنیِ چهرهٔ خدا؛ خدا از شدتِ پیدا بودن پنهان است (تشبیه جهان به نور خداوند؛ تضاد پیدایی/پنهانی؛ عنوان درس از همین بیت).", "استدلال امام صادق (ع): نظمِ اعضای بدن (دل در قفسهٔ دنده‌ها؛ شش = بادزنِ دل؛ دست/پا/چشم هر یک برای هدفی) ← اگر «طبیعت» را دانا و توانا بگویند، به خدا قائل شده‌اند (فقط نامش را طبیعت گذاشته‌اند)؛ اگر بی‌شعور بگویند، کارِ شگفت از آن صادر نمی‌شود.", "نعمت‌ها: حافظه (یادآوری) و فراموشی («فراموشی عظیم‌تر است از یادآوری» — آرامش پس از مصیبت، رفتنِ کینه، بهره‌مندی از نعمت‌ها)؛ آبِ فراوان و روان (نیاز به آب &gt; نان)؛ درد و بیماری (پیشینهٔ توبه و نیکوکاری و صدقه).", "دانش زبانی کتاب: <b>قید</b> — واژه‌هایی که حالت، زمان، مکان، تردید، یقین و تکرار را به جمله می‌افزایند؛ رکنِ اصلی جمله نیست؛ جای ثابت ندارد (نمونه: اندوهناک، امروز، مشتاقانه، خوب).", "دانش ادبی کتاب: <b>واژه‌های هم‌خانواده</b> (فضل، فاضل، مفضل، تفضیل، افضل) — شناخت ریشه، کلیدِ درست‌نویسی و دامنهٔ واژگان.", "دوبیتی‌های بابا طاهر (۱۰ دوبیتی): «دلی دیرُم خریدار محبت...»؛ «بود دردِ من و درمانم از دوست»؛ «بود قدرِ تو افزون از ملایک / تو قدرِ خود نمی‌دانی چه حاصل»؛ «مکن کاری که بر پا سنگت آید...»؛ «چو فردا نامه‌خوانان نامه خوانند...» — آرایه‌ها: جناس (محنت/محبت، دوست/پوست، سنگ/تنگ)، تضاد (وصل/هجران، درویش/دولتمند)، کنایه (گرم بودن بازار)، تلمیح (نامه‌خوانان = قیامت).", "مهم‌ترین قیدها و واژه‌ها: فروغ=روشنایی، روی=چهره، دان=بدان، جراحت=زخم، تلف کردن=از بین بردن، خلل=آسیب، خاطر=حافظه، قصاب، سبحان=پاک، ملایک=فرشتگان، فراخ=وسیع."]},
{"id":15,"icon":"🧭","lnum":"درس پانزدهم","title":"درس آزاد — ادبیات بومی (۲)","info":"فصل آزاد | موضوع: ادبیات بومی، سُنّت و آداب محلی، ادبیات زبان مادری","intro":"درس ۱۵ کتاب فارسی نهم، «درس آزاد» فصل آزادِ <b>«ادبیات بومی ۲»</b> است (صفحات ۱۱۲ تا ۱۱۶ کتاب). صفحات این فصل در کتاب درسیِ سراسری، مانند «ادبیات بومی ۱» (درس ۵)، <b>خالی</b> نگه داشته شده است؛ زیرا مطابق <b>اصل پانزدهم قانون اساسی</b>، این درس با مشارکت دانش‌آموزان و راهنمایی دبیران، بر پایهٔ <b>گنجینهٔ فرهنگی هر سرزمین و ادبیاتِ زبان مادریِ همان استان</b> تدوین می‌شود: متن درس و روان‌خوانیِ این فصل را اداره‌های کلّ آموزش و پرورش استان‌ها بر پایهٔ سُنّت‌ها و آداب بومی، قلمرو فرهنگ محلی، نیازهای ویژهٔ نوجوانان و جوانان و دیگر موضوع‌های ناگفتهٔ کتاب تولید می‌کنند (ساختار فصل: «درس آزاد + روان‌خوانی»).","kholase":["درس ۱۵ کتاب فارسی نهم، «درس آزاد» فصل آزادِ <b>«ادبیات بومی ۲»</b> است (صفحات ۱۱۲ تا ۱۱۶ کتاب). صفحات این فصل در کتاب درسیِ سراسری، مانند «ادبیات بومی ۱» (درس ۵)، <b>خالی</b> نگه داشته شده است؛ زیرا مطابق <b>اصل پانزدهم قانون اساسی</b>، این درس با مشارکت دانش‌آموزان و راهنمایی دبیران، بر پایهٔ <b>گنجینهٔ فرهنگی هر سرزمین و ادبیاتِ زبان مادریِ همان استان</b> تدوین می‌شود: متن درس و روان‌خوانیِ این فصل را اداره‌های کلّ آموزش و پرورش استان‌ها بر پایهٔ سُنّت‌ها و آداب بومی، قلمرو فرهنگ محلی، نیازهای ویژهٔ نوجوانان و جوانان و دیگر موضوع‌های ناگفتهٔ کتاب تولید می‌کنند (ساختار فصل: «درس آزاد + روان‌خوانی»)."],"payam":"","khanesh":"","blocks":[],"vocab":[],"notes3":[],"lit":[],"gram":[],"arts":{"intro": [], "tables": [], "notes": []},"wb":[],"notes7":[],"exam":["درس ۱۵ = درس آزادِ «ادبیات بومی ۲»؛ صفحات ۱۱۲–۱۱۶ کتاب سراسری خالی است (متن و روان‌خوانی را استان‌ها تولید می‌کنند).", "مبنای قانونی: <b>اصل پانزدهم قانون اساسی</b> (آزادی زبان‌ها و قومیت‌های ایرانی؛ بهره‌گیری از ادبیات زبان مادری در رسانه‌ها و آموزش آن در کنار زبان فارسی).", "پیشنهاد تولید محتوا برای این فصل (از کتاب): سُنّن و آداب بومی، قلمرو فرهنگ محلی، نیازهای ویژهٔ نوجوانان و جوانان و دیگر ناگفته‌های کتاب.", "برای امتحان: از متن، واژه‌ها و روان‌خوانیِ تدوین‌شدهٔ استان خودتان (با راهنمایی دبیر) مرور کنید.", "نکتۀ امتحانی: از درس آزاد، در آزمون‌های سراسری متن ثابتی طرح نمی‌شود؛ اما بدانید که: ۱) این فصل برای تحقق اصل پانزدهم قانون اساسی است («زبان‌ها و قومیت‌های ایرانی آزاد»؛ بهره‌گیری از ادبیات زبان مادری در رسانه‌های گروهی و تدریس ادبیات آن در کنار زبان فارسی)؛ ۲) ساختار آن مانند دیگر فصل‌هاست؛ ۳) محتوای آن باید با سنّت‌ها، ادبیات بومی و زبان مادری استان شما پیوند داشته باشد. برای امتحان مدرسه، از محتوایی که دبیر شما برای این فصل تدارک دیده است (متن درس و روان‌خوانی استان شما) مرور کنید."]},
{"id":16,"icon":"💭","lnum":"درس شانزدهم","title":"آرزو","info":"نویسنده: ویکتور هوگو (ترجمه، با اندکی تغییر) | فصل ششم: ادبیات جهان | نوع متن: نثر تعلیمی–عاطفی (نامه‌گونه)","intro":"<b>پیام اصلی:</b> آرزوهای راستین برای دوست: عشق به خوبی، دوست و دشمنِ سنجیده (برای رشد و پرهیز از غرّه‌شدن)، صبرِ بزرگ، لذت‌های بی‌دلار طبیعت (دانه‌دادن و آواز پرنده)، رویاندن و همراهی رشد، ارباب‌بودنِ انسان بر پول (نه اسارت در آن) و دوستیِ همدل و پایدار.","kholase":["درس ۱۶ از فصل «ادبیات جهان»، متنی از <b>ویکتور هوگو</b> (نویسندهٔ فرانسوی قرن نوزدهم) است که گونه‌ای نامهٔ مهربانانه و آرزوها برای «دوستی» است. نویسنده آرزو می‌کند: پیش از هر چیز، برایت آرزومندم که به خوبی‌ها عشق بورزی و نیکان و نیکویی‌ها نیز به تو روی بیاورند؛ آرزو دارم دوستانی داشته باشی، برخی نادوست و برخی دوست‌دار، که دست‌کم یکی در جمعشان مورد اعتمادت باشد؛ چون زندگی بدین گونه است، برایت آرزومندم که دشمن نیز داشته باشی، نه کم و نه زیاد، درست به‌اندازه، تا گاهی باورهایت را مورد پرسش قرار دهند و دست‌کم یکی از آنها اعتراضش به حق باشد، تا زیاده به خودت غرّه نشوی؛ همچنین برایت آرزومندم صبور باشی، نه با کسانی که اشتباه‌های کوچک می‌کنند (که این کار ساده‌ای است)، بلکه با کسانی که اشتباه‌های بزرگ می‌کنند؛ امیدوارم به پرنده‌ای دانه بدهی و به آواز مرغ سحری گوش کنی، وقتی که آواز سحرگاهی‌اش را سر می‌دهد، چرا که از این راه احساسی زیبا خواهی یافت، به رایگان؛ امیدوارم که دانه‌ای هم بر خاک بیفشانی، هرچند خُرد بوده باشد، و با روییدنش همراه شوی تا دریابی چقدر زندگی در یک درخت جریان دارد؛ آرزومندم اگر به پول و ثروتی رسیدی، آن را پیش رویت بگذاری و بگویی: «این داراییِ من است»، فقط برای اینکه آشکار شود کدامتان اربابِ دیگری است! آری، پول اربابِ بدی است؛ اما خدمتگزارِ خوبی است؛ و در پایان، برایت ای مهربان، آرزومندم همواره دوستیِ خوب و یک‌دل داشته باشی تا اگر فردا آزرده شوی یا پس‌فردا شادمان گشتی، با هم از عشق سخن بگویید و دوباره شکوفا شوید."],"payam":"<b>پیام اصلی:</b> آرزوهای راستین برای دوست: عشق به خوبی، دوست و دشمنِ سنجیده (برای رشد و پرهیز از غرّه‌شدن)، صبرِ بزرگ، لذت‌های بی‌دلار طبیعت (دانه‌دادن و آواز پرنده)، رویاندن و همراهی رشد، ارباب‌ {"id":17,"icon":"🦊","lnum":"درس هفدهم","title":"شازده کوچولو","info":"نویسنده: آنتوان دو سنت‌اگزوپری (با تلخیص) | فصل ششم: ادبیات جهان | نوع متن: داستان (نثر داستانی، با لحن روایی) | موضوع: دوستی، مسئولیت و اهلی شدن","intro":"<b>پیام اصلی:</b> «هرچه را اهلی کنی، مسئولِ آن هستی» — دوستی و مسئولیت‌پذیری، هستهٔ داستان است؛ بزرگ‌ها چیزهای مهم را با چشمِ قلب نمی‌بینند؛ رابطه (پیوند) است که برای ما و برای دیگری «یکتا» می‌سازد و زندگی را چون خورشید می‌درخشاند؛ آنچه با قلب دیده شود، واقعی است.","kholase":["درس ۱۷، تلخیصی است از داستان مشهور <b>«شازده کوچولو»</b> آنتوان دو سنت‌اگزوپری. راوی (خلبان) می‌گوید: وقتی شش‌ساله بود، در کتابی قصه‌ای زیبا دید که مار «بوآ»یی را نشان می‌داد که در حال بلعیدن یک درنده بود؛ در آن کتاب نوشته بود که مارهای بوآ شکار خود را یک‌جا می‌بلعند و دیگر نمی‌توانند حرکت کنند و تا شش ماه که غذایشان را هضم می‌کنند، می‌خوابند. راوی دربارهٔ این ماجرا و مارهای دیگر بسیار فکر کرد و بالاخره نتیجه گرفت که کار خود بسازد: «قصهٔ شمارهٔ یک» را با مداد رنگی کشید — مار بوآیی که دردستان؟ فیلی را بلعیده بود. شاهکار خود را به آدم‌های بزرگ نشان داد، اما آنها نگرانش شدند و گفتند به جای تصویر مار بوآ و جنگل‌های بدوی، به جغرافیا، تاریخ، حساب و دستور زبان بپردازم! به همین سبب در شش‌سالگی، کارِ درخشانِ نقاشیِ خود را رها کرد و ناچار شغل دیگری (خلبانی) برگزید. سال‌ها گذشت؛ در تمام زندگی، با آدم‌های بزرگ سر و کار داشت و آنان را از نزدیک شناخت — اما همیشه به قصهٔ شمارهٔ یکِ خود نظر می‌انداخت و از آنها می‌پرسید آیا قصه را می‌فهمند یا نه؛ و همیشه پاسخشان این بود: «این یک کلاه است» — در حالی که قصهٔ شمارهٔ یک، مار بوآیی بود که یک فیلی را بلعیده بود! چون نمی‌توانست از روی تصویر با آنها حرف زد، به تقلب گفتن با آنها چاره‌ای نبود: از پل معادن، ارکستر و اپرا حرف می‌زد و آدم‌های بزرگ خوشحال می‌شدند که با انسانی معقول روبه‌رو شده‌اند. یک بار، در صحبت‌هایش با آدم‌های بزرگ کم‌بیش دراز کشید و خلوتش پیش آمد: شش سال پیش، هواپیمایش در صحرای بزرگ آفریقا دچار عیب فنی شد و مجبور شد تنها، با ابزارهای محدود، تعمیرش کند؛ مسئلهٔ مرگ و زندگی بود چون آب آشامیدنی فقط برای هشت روز داشت. در سحرگاه روز نخست، صدای نازک و عجیبی او را بیدار کرد: شازده کوچولو! کودکی با وقارِ تمام که از او خواست برایش «قوچی» بکشد؛ راوی با مداد رنگی، قصهٔ شمارهٔ دو را کشید (مار بوآیی که درونش قوچ بود!) اما شازده گفت: «نه! این مار بوآ خیلی خطرناک است و این فیل خیلی بزرگ؛ ... قوچ را برایم بکش.» راوی بارها کشید و بارها پس زد؛ سرانجام با شتابی عصبانی خطی کشید و گفت: «این جعبه است؛ قوچی که می‌خواهی درونش است!» — و شازده کوچولو چنان شاد شد که هفته‌ها به همان «قوچ در جعبه» بسنده کرد.", "در ادامه، خلبان از زندگی شازده کوچولو و سیاره‌اش می‌گوید: سیارهٔ کوچکِ او با دسته‌های مهاجرِ پرندگانِ وحشی کوچ می‌کرد (برای کوچ، دسته‌های مهاجر را سفارش می‌داد) (برای کوچ کردن، چهار قطار گازِ مهاجر سفارش می‌داد)؛ روزها کار می‌کرد و عصرها به غروب خورشید می‌نگریست — روزی چهل‌وسه غروب دید! روزی در گوشه‌ای از سیاره، دانه‌های بابونه سبز شد و شازده یک روز صبح، از میان آن دانه‌ها، گلی به زیباییِ تمام رویید؛ گلی متکبر و خودستا که هرچه شکوفه‌تر می‌شد، عطرآگین‌تر می‌شد و با شازده کوچولو غر می‌زد. شازده گلی را آب می‌داد و از آن مراقبت می‌کرد، اما گلِ غرغرو به او گفت: «شب که می‌شود، باید از پشت شیشه مرا بپوشانی؛ سرمای تو در این سیاره سخت است...» و با هیچ چیز قناعت نمی‌کرد؛ شازده کوچولو سرانجام از گل و «چهار خار» به ستوه آمد و به کوچ کردن از سیارهٔ خود تصمیم گرفت. در سیاره‌های دیگر، با پیرمردِ ادعایی (که خود را پادشاه می‌دانست)، آدم متکبر، شراب‌خوش‌نوش، بازرگانِ حساب‌کنندهٔ ستاره‌ها و... روبه‌رو شد و سرانجام به سیارهٔ زمین رسید — جایی که با روباهی روبه‌رو شد.", "<b>گفت‌وگو با روباه، قلب داستان است:</b> شازده از روباه خواست با او بازی کند؛ روباه گفت: «من نمی‌توانم با تو بازی کنم؛ من اهلی نیستم!» — «اهلی شدن یعنی چه؟» — «اهلی شدن یعنی ایجادِ رابطه (پیوند)» — «تو برای من هنوز مثل هزاران پسر دیگر هستی و من به تو نیازی ندارم؛ تو هم به من نیازی نداری. برای تو من فقط یک روباه هستم، مثل صد هزار روباه دیگر. اما اگر مرا اهلی کنی، به یکدیگر نیازمند می‌شویم؛ تو برای من یکتا در جهان می‌شوی و من هم برای تو یکتا می‌شوم» روباه خواست که آیین اهلی‌شدن رعایت شود: «باید بسیار صبور باشی. ابتدا آن‌قدر از من دور بنشین — مثل این‌که روی چمنی دور نشسته‌ای — و من از گوشهٔ چشم به تو نگاه کنم و تو هیچ چیزی نگوْی؛ زبان، سرچشمهٔ بدفهمی‌هاست. اما هر روز کم‌کم می‌توانی کمی نزدیک‌تر بنشینی...» و بهترین ساعت را پیدا کن: «اگر تو ساعتِ چهار بعدازظهر بیایی، من از ساعت سه شاد می‌شوم؛ هرچه ساعتش نزدیک‌تر شود، خوشحال‌تر می‌شوم...» روباه گفت: «اگر مرا اهلی کنی، زندگی من چون خورشید خواهد درخشید؛ صدای پای تو، مرا از لانه بیرون می‌کشد (مثل نغمه‌ای)» و بالاخره — پس از روزها — شازده کوچولو روباه را اهلی کرد. ساعت جدایی فرا رسید؛ روباه گفت: «می‌خواهم بگریم!» — «تقصیر تو بود؛ من برای تو ضروری نبودم و تو هیچ‌وقت دوست نداشتی مرا اهلی کنی...» اما روباه راز را به او داد: «گندم را خوب می‌شناسم، اما گندم برای من سودی ندارد و مزرعه‌های گندم چیزی به من نمی‌گویند و این تلخ است؛ اما تو موهای طلایی داری: وقتی مرا اهلی کنی، گندم نیز طلایی می‌شود؛ صدای پای تو مرا از لانه بیرون می‌کشد و من به صدای چرخ‌های آسیاب در شب گوش می‌دهم و به گندم‌ها می‌خندم...» و سرانجام رازِ بخشش‌گون: «با قلب خوب ببین؛ با چشم، هیچ چیزی به‌درستی دیده نمی‌شود؛ رازِ واقعی در چیزهایی است که با قلب دیده می‌شوند.» (تلخیص بخش پایانی در کتاب): هنگام جدایی، روباه به شازده گفت: «آموخته‌های مرا در خاطر داشته باش: هرچه را اهلی کنی، مسئولِ آن هستی؛ تو مسئولِ گلِ خود شدی...»", "در سیارهٔ زمین، شازده کوچولو با «کارفرما» (بازرگانِ شمارندهٔ ستاره‌ها) نیز روبه‌رو شد که همهٔ عمر را به شمارش و مالک‌شدنِ ستاره‌ها گذرانده بود؛ شازده کوچولو این شمارش را بی‌فایده می‌دانست: «نه ستاره‌ها برای کارفرما فایده داشتند و نه کارفرما برای آنها؛ من یک گل دارم که هر شب آبش می‌کنم و یک روباه که هر شب در برابرش چهل‌وسه غروب تماشا می‌کنم...» و راستی — این «مسئولیت» و «عشق» است که ارزش دارد. بخش پایانی درس از فراقت راوی و شازده حکایت دارد: «اکنون شش سال از آن ماجرا می‌گذرد... من هرگز این داستان را برای کسی تعریف نکرده بودم؛ دوستانی که دوباره دیدم، شاد بودم که زنده بازمی‌گردانم؛ گاه از خود می‌چرسم: او اکنون در سیارهٔ خود چه می‌کند؟ و آن وقت باز از غم و شادی می‌نالم و همهٔ ستاره‌ها آهسته به من بخرید می‌کنند — چون دوست دارم شب‌ها به ستاره‌ها نگاه کنم؛ همه مثل چراغ‌هایی جلوه کنند...»"],"payam":"<b>پیام اصلی:</b> «هرچه را اهلی کنی، مسئولِ آن هستی» — دوستی و مسئولیت‌پذیری، هستهٔ داستان است؛ بزرگ‌ها چیزهای مهم را با چشمِ قلب نمی‌بینند؛ رابطه (پیوند) است که برای ما و برای دیگری «یکتا» می‌سازد و زندگی را چون خورشید می‌درخشاند؛ آنچه با قلب دیده شود، واقعی است.","khanesh":"<b>نکتهٔ خوانش:</b> نویسنده داستان را با لحن روایی و آهنگی نرم و لطیف آغاز می‌کند و به‌تناسبِ تغییر فضای داستان و شخصیت‌ها از لحن‌های دیگر بهره می‌جوید؛ مثلاً آنجا که شازده کوچولو با روباه و کارفرما صحبت می‌کند، باید از لحن گفت‌وگو استفاده شود؛ به‌گونه‌ای که داستان، شنونده را تحت تأثیر قرار دهد و در او کشش و انتظار ایجاد کند؛ همچنین با درنگ‌های مناسب در خوانش متن، تحت‌تأثیر فضای داستان قرار گیرد.","blocks":[{"k": "p", "t": "<b>عبارت‌های دشوار درس ۱۷ (با معنی):</b> «لحن روایی»: لحنِ روایت‌گرایانه / «قاب‌قابی، آهنگی نرم و لطیف»: نرمی و ملایمت صدا / «کشش و انتظار ایجاد کند»: کنایه از ایجادِ علاقه / «درنگ»: مکث و توقف / «از آنِ»: مالِ / «مار بوآ»: نوعی مار بزرگِ بی‌زهر و زنده‌زا که از پستانداران کوچک (مثل خرگوش و موش) تغذیه می‌کند و به انسان حمله نمی‌کند؛ برخی گونه‌هایش تا ۶ متر می‌رسند / «هضم»: گوارش و تحلیل غذا در معده / «بلعیدن»: قورت‌دادن / «شاهکار»: کار بزرگ و برجسته / «هضم می‌کرد»: کنایه از خوردن / «دست برداشتن»: کنایه از کنار کشیدن و رها کردن / «فن»: راه و روش و هنر / «قدری»: مقدار کم / «ظریف»: نکته‌سنج و لطیف / «ناچار»: مجبور / «کم‌بیش»: کم‌وزیاد / «از کار افتادن»: کنایه از خراب شدن / «تعمیر»: درست کردن / «مرگ و زندگی»: متضاد / «لابد»: ناگزیر / «عجیب»: شگفت‌آور / «چشمم افتاد»: کنایه از نگاه کردم / «وقار»: آرامی و شکوه / «می‌نگریست»: نگاه می‌کرد / «به نظر آمدن»: کنایه از معلوم شدن / «نور اندیشه»: اضافه استعاری و حس‌آمیزی (اندیشه چون چراغی روشن) / «نور اندیشه همچون آذرخش»: تشبیه / «آذرخش»: صاعقه و برق / «دلِ شب»: تشخیص و اضافه استعاری / «عزیمت»: رفتن و عازم شدن / «پی بردن»: کنایه از فهمیدن / «بیش از حد»: کنایه از بسیار زیاد / «مهر»: محبت / «روز و راز»: جناس ناهمسان اختلافی / «فاش شدن»: کنایه از معلوم شدن / «دریافتن»: کنایه از فهمیدن / «کارفرما»: صاحب‌کار / «لبریز»: پُر / «سر برنداشتن»: کنایه از بلند نکردن / «پانزده، هفت، بیست‌ودو...»: تناسب / «پاسخی نیافت»: کنایه از نشنیدن پاسخ / «ماجرا»: اتفاق / «اهلی»: رام و خانگی / «تأمل»: اندیشیدن / «محتاج»: نیازمند / «یگانه»: تنها و بی‌همتا / «عالم»: جهان."}, {"k": "sub", "t": "روان‌خوانی «دو نقّاش» — داستان‌هایی برای فکر کردن، رابرت فیشر"}, {"k": "p", "t": "<b>خلاصهٔ روان‌خوانی:</b> سال‌ها پیش، در یونان مسابقه‌ای برگزار می‌شد که بهترین نقاش را معلوم می‌کرد؛ یونانیان زیبایی را از هر نوع آن دوست می‌داشتند و سعی می‌کردند در هر چیز بهترین را پیدا کنند (بازی‌های المپیک برای یافتن بهترین در ورزش و مسابقات شعر، موسیقی، نقاشی و مجسمه‌سازی). هیچ‌کس نمی‌توانست بگوید کدام یک از دو نقاش هنرمند بهتری بودند؛ بعضی یکی را ترجیح می‌دادند و برخی دیگری را. تصمیم گرفتند از پیرمردی — که خود زمانی بهترین نقاش روزگار بود — بخواهند داوری کند. پیرمرد وظیفه‌ای بر عهدهٔ نقاشان گذاشت: هر یک باید تا آنجا که می‌توانست، تصویری واقعی از زندگی می‌کشید و بعد از سه ماه بازمی‌گشتند. دو نقاش رفتند و بعد از سه ماه، هر کدام با یک تصویر برگشتند؛ جمعیت در بازار گرد آمدند. به اولین نقاش علامت دادند؛ او پرده‌ها را کنار زد: نقاشی زیبا و شبیهِ زندگی — تصویر کاسه‌ای از انگور آن‌چنان رسیده و آبدار که مردم باور نمی‌کردند انگورها واقعی نباشند؛ ناگهان پرندگانی که آن حوالی پرواز می‌کردند با شتاب فرود آمدند و شروع کردند به نوک‌زدن به تصویر و می‌خواستند انگورها را بخورند! جمعیت کف می‌زدند: اگر نقاشی آن‌قدر خوب بود که پرندگان را فریب دهد، این نقاش مطمئناً باید برنده می‌شد. حالا نوبت نقاش دیگر بود؛ نقاش جوان لبخندی زد اما حرکتی نکرد؛ داور گفت: «نوبت توست؛ بگذار نقاشی‌ات را ببینیم»؛ اما او ثابت ماند. پیرمرد صبرش را از دست داد، قدمی برداشت تا پرده را کنار بزند — اما مثل این بود که نمی‌تواند آن را در دست بگیرد! رو به جمعیت کرد و گفت: «اینجا پرده‌ای نیست؛ پرده، همان نقاشی است! او یک پرده را نقاشی کرده است؛ درست شبیه یک پردهٔ واقعی!» جمعیت مات و مبهوت ماند. پیرمرد رو به نقاش اول گفت: «نقاشی تو آن‌قدر خوب بود که پرندگان را به اشتباه انداخت»؛ سپس رو به نقاش دوم: «اما نقاشی تو بهتر است؛ چون چشم‌های انسان‌ها را فریب داده است! بنابراین برنده تویی.» جمعیت هورا کشید و نقاش به جلو قدم برداشت تا جایزه را دریافت کند — آیا آنها به بهترین نقاش رسیدند؟ (این پرسش، پرسشِ پایانی داستان است: فریبِ چشمِ حیوان، ملاکِ هنر است یا فریب چشمِ انسان و عمقِ تقلید؟)"}, {"k": "p", "t": "<b>مفهوم:</b> ظرافتِ هنر در آن است که حتی چشمِ دانای انسانی را به تقلیدِ واقعیت وادارد؛ اما پرسش داستان باقی است: آیا معیارِ «بهترین»، فریب‌دادن است؟ رابرت فیشر با این پرسش، اندیشیدن دربارهٔ معیارهای قضاوت و واقعی‌بودن را تمرین می‌دهد. <b>لغت و کنایه‌ها:</b> «برگزار شدن»: برپا شدن / «مجسمه‌سازی»: پیکرتراشی / «داوری»: قضاوت / «بر عهدهٔ... گذاشتن»: سپردن به... / «کنار زدن»: برداشتن / «رسیده»: پخته / «آبدار»: شاداب و تازه / «نوک زدن»: منقار زدن / «هورا کشیدن»: شادمانه صدا بلند کردن / «ثابت ماند»: جا خشک‌شدن و حرکت‌نکردن / «صبر از دست دادن»: ناشکی‌بودن / «مات و مبهوت»: شگفت‌زده و بی‌حرکت / «به اشتباه انداختن»: فریب دادن."}],"vocab":[["لحن روایی", "لحنِ روایت‌گرایانه"], ["درنگ", "مکث و توقف"], ["مار بوآ", "مار بزرگ بی‌زهر و زنده‌زا"], ["هضم", "گوارش غذا در معده"], ["بلعیدن", "قورت دادن"], ["شاهکار", "کار بزرگ و برجسته"], ["دست برداشتن", "کنار کشیدن، رها کردن"], ["فن", "راه و روش، هنر"], ["قدری", "مقداری، کم"], ["ظریف", "نکته‌سنج، لطیف"], ["ناچار", "مجبور"], ["کم‌بیش", "کم‌وزیاد"], ["تعمیر", "درست کردن، اصلاح"], ["عجیب", "شگفت‌آور"], ["وقار", "آرامی و شکوه"], ["به نظر آمدن", "معلوم شدن"], ["آذرخش", "صاعقه، برق"], ["عزیمت", "رفتن، عازم شدن"], ["کارفرما", "استاد، صاحب‌کار"], ["لبریز", "پُر"], ["ماجرا", "اتفاق"], ["اهلی", "رام، خانگی"], ["محتاج", "نیازمند"], ["یگانه", "تنها، بی‌همتا"], ["تأمل", "اندیشیدن"], ["مجسمه‌سازی", "پیکرتراشی"], ["مات و مبهوت", "شگفت‌زده"], ["به اشتباه انداختن", "فریب دادن"]],"notes3":["<b>واژه‌های مهم املایی (با تصحیح اشتباه‌های رایج):</b> مار بوآ، هضمِ غذا (نه «حضم»)، حدس و گمان (نه «حدث»)، وداع و خداحافظی (نه «ودا»)، عزیمت به سیارهٔ زمین (نه «عظیمت»)، مالکِ ستارگان (نه «مالک ستاره‌گان»)، انسان علاقه‌مند (نه «اعلاقمند»)، تعمیر، عجیب، وقار، یگانه، مسئول، آذرخش."],"lit":[{"name": "آنتوان دو سنت‌اگزوپری (۱۹۰۰–۱۹۴۴ م)", "t": "نویسنده، شاعر و خلبان فرانسوی؛ از پیشگامان ادبیات داستانی مدرن. داستان مشهور <b>«شازده کوچولو» (Le Petit Prince)</b> — یکی از پرفروش‌ترین کتاب‌های جهان — از اوست؛ اثری شاعرانه با مضامین دوستی، مسئولیت و معنویت که از زبان یک کودکِ سیاره‌گرد، نقدِ بزرگ‌سالانِ مادی‌اندیش را روایت می‌کند. اگزوپری خلبان بود و در جنگ جهانی دوم، در ۱۹۴۴ میلادی در یکی از مأموریت‌های پروازی ناپدید شد. متن درس ۱۷ تلخیصی از این داستان است (با تلخیص)."}, {"name": "رابرت فیشر", "t": "نویسندهٔ معاصر و پژوهشگر تعلیم‌وتربیت؛ نویسندهٔ کتاب <b>«داستان‌هایی برای فکر کردن»</b> که روان‌خوانی «دو نقاش» از آن برگزیده شده است؛ داستان‌های کوتاه او برای پرورش مهارت اندیشه در کودکان و نوجوانان نوشته شده‌اند."}],"gram":[{"h": "", "body": ["<b>املا (دانش زبانی کتاب):</b> واژه‌هایی که به «های بیانیِ حرکت» (هـ ـه) تمام می‌شوند، هنگامِ اضافه‌شدنِ «ی» نکره به آخر آنها، بدین‌گونه نوشته می‌شوند:", "اما واژه‌هایی که با «واو» تمام می‌شوند، هنگامِ اضافه‌شدنِ «ی» نکره به آخر آنها، این‌گونه نوشته می‌شوند:"], "tables": [], "notes": ["<b>نکته:</b> پس از «هـ» بیانی، «ی» نکره جدا نوشته نمی‌شود بلکه به‌صورت «ه‌ای» می‌آید (خوشه‌ای، جامه‌ای، کوهی? نه — کوهِ...)؛ و پس از «واو»، «ی» بدون فاصله می‌چسبد (نمونه‌های کتاب: دانشجویی، رادیویی، آهویی)."]}],"arts":{"intro": [], "tables": [{"head": ["آرایه", "نمونه از درس ۱۷ و دو نقّاش"], "rows": [["اضافه استعاری / حس‌آمیزی", "«نورِ اندیشه» (اندیشه همچون چراغی روشنایی می‌دهد)"], ["تشبیه", "«نور اندیشه همچون آذرخش» (به آذرخش/صاعقه)؛ «درست شبیه یک پردهٔ واقعی است»"], ["تشخیص (جان‌بخشی)", "«دلِ شب»؛ «صدای پای تو مرا از لانه بیرون می‌کشد»"], ["کنایه", "«چشمم افتاد» (نگاه کردم)؛ «دست برداشتن» (رها کردن)؛ «از کار افتادن» (خراب شدن)؛ «به نظر آمدن» (معلوم شدن)؛ «سر برنداشتن» (بلند نکردن)؛ «پاسخی نیافت» (نشنیدن پاسخ)؛ «به اشتباه انداختن» (فریب دادن)؛ «صبر از دست دادن» (ناشکی‌بودن)؛ «با قلب خوب ببین» (با عاطفه دریاب)"], ["جناس", "«روز و راز» (جناس ناهمسان اختلافی)"], ["تناسب (مراعات نظیر)", "«پانزده، هفت، بیست‌ودو» (شمارگان)؛ «مار، بلعیدن، هضم، غذا»؛ «نقاشی، پرده، انگور، پرندگان»"], ["مبالغه / اغراق‌گونه", "«مزرعه‌های گندم چیزی به من نمی‌گویند» (شخصیت‌دادن به گندم‌ها)؛ «همهٔ ستاره‌ها مثل چراغ‌هایی به من بخرید می‌کنند»"]]}], "notes": []},"wb":[{"g": "خود را بیازمایید (صفحهٔ ۱۳۲)", "n": "۱", "q": "خلبان چگونه با شازده کوچولو آشنا شد؟", "a": ["خلبان به‌ناچار در صحرایی دور (آفریقا) فرود آمد و هواپیمایش دچار عیب فنی شده بود؛ هنگام طلوع خورشید، صدای نازک و عجیبی او را از خواب بیدار کرد؛ کودکی با وقارِ تمام بر فراز صحرا ایستاده بود و از او می‌خواست برایش قوچی بکشد؛ خلبان در آشنایی، او را «شازدهٔ کوچک» یافت — سیاره‌گردی کوچک از آسمان."]}, {"g": "خود را بیازمایید (صفحهٔ ۱۳۲)", "n": "۲", "q": "چرا شازده کوچولو، شمارش ستارگان را برای کارفرما، بی‌فایده می‌دانست؟", "a": ["زیرا نه ستاره‌ها (ثروتِ شمرده‌شده) برای کارفرما فایده‌ای داشتند و نه کارفرما برای ستاره‌ها؛ شمارشِ صرف، مالکیتِ واقعی و مسئولیت نمی‌آورد؛ در حالی که شازده یک گل داشت که هر شب به یاد آن بیدار می‌شد و آبش می‌داد و به عطرش نیاز داشت و یک روباه که هر شب در برابرش غروب‌ها را تماشا می‌کرد — داشتنِ رابطه و مسئولیت، فایدهٔ واقعی است."]}, {"g": "خود را بیازمایید (صفحهٔ ۱۳۲)", "n": "۳", "q": "چرا روباه، دوست داشت اهلی شود؟", "a": ["چون زندگی روباه یک‌نواخت و تکراری بود و او به رابطه (پیوند) و دوستی نیاز داشت؛ خودش می‌گوید: «اگر مرا اهلی کنی، زندگی من چون خورشید خواهد درخشید»؛ با اهلی‌شدن، صدای پای شازده از صدای پای دیگران متفاوت می‌شود و مانند نغمه‌ای موسیقایی، او را از لانه بیرون می‌کشد؛ او به «یگانه» بودن برای دیگری و دیگری برای خود می‌رسد (ایجادِ رابطه، معنا می‌آورد)."]}, {"g": "خود را بیازمایید (صفحهٔ ۱۳۲)", "n": "۴", "q": "...................................................................................................؟", "a": ["پاسخ نمونه: از داستان شازده کوچولو آموختم که با «قلب» ببینم نه فقط با چشم؛ هرچه و هرکه را دوست می‌دارم، «مسئولِ» او باشم (گلِ خود را آب بدهم) و بدانم بزرگ‌شدن به معنای فراموش‌کردنِ قصه‌ها و لذت‌های ساده نیست."]}, {"g": "گفت‌وگو (صفحهٔ ۱۳۲)", "n": "۱", "q": "دربارهٔ شخصیت‌های داستان با هم گفت‌وگو کنید.", "a": ["پاسخ نمونه: <b>خلبان (راوی):</b> انسانی رویاگر و نقاش‌دل که کودکی‌اش را در بزرگ‌سالی باخته اما با شازده آن را بازمی‌یابد؛ صبور و دلسوز. <b ای من فاش بشود</b>."]}, {"g": "خودآزمایی و فعالیت‌های نوشتاری (صفحه‌های ۱۳۳ و ۱۳۴)", "n": "۴", "q": "جدول صفحهٔ بعد را کامل کنید. (۱۵ توضیح)", "a": ["۱) غزل، مثنوی، قصیده نوعی ... شعری هستند: <b>قالب</b>. ۲) یکی از اجزای جمله و به معنی بند است: <b>قید</b>. ۳) دو مصرعی که با هم بیایند: <b>بیت</b>. ۴) یکی از عناصر مهم داستان: <b>درون‌مایه</b>. ۵) به ادبیات دفاع مقدس می‌گویند: <b>ادبیات پایداری</b>. ۶) از آن طرف بخوانید نوعی جمله است: <b>یرما</b> (= «امری» برعکس). ۷) صفت «ادب» و یکی از انواع نوشته: <b>ادبی</b>. ۸) اگر از آن طرف بخوانید مترادف هویدا است: <b>ادیپ</b> (= «پیدا» برعکس). ۹) با فعل اسنادی می‌آید: <b>مسند</b>. ۱۰) ریشهٔ فعل: <b>بن</b>. ۱۱) نوعی فعل گذشته است: <b>استمراری</b>. ۱۲) کتاب مشهور مولوی: <b>مثنوی</b>. ۱۳) «دوست» به زبان ترکی: <b>یولداش</b>. ۱۴) معمولاً همراه آموزش می‌آید: <b>پرورش</b>. ۱۵) حرف ربط: <b>و</b>."]}, {"g": "فرصتی برای اندیشیدن (صفحهٔ ۱۳۷ — روان‌خوانی دو نقّاش)", "n": "۱", "q": "یکی از نقاشی‌ها پرندگان را به اشتباه انداخت؛ آنها چگونه فریب خورده بودند؟", "a": ["پرندگان با چشمِ خود، نقاشیِ کاسهٔ انگور را انگورِ واقعی پنداشتند و برای خوردنِ آن، با شتاب بر تصویر فرود آمدند و به آن نوک می‌زدند؛ یعنی هنرمند آن‌چنان استادانه انگورها را رسیده و آبدار کشیده بود که حتی غریزه و بیناییِ حیوان نیز تقلید را از واقعیت بازنشناخت — فریبِ حواسِ جانور."]}, {"g": "فرصتی برای اندیشیدن (صفحهٔ ۱۳۷ — روان‌خوانی دو نقّاش)", "n": "۲", "q": "نقاشی دیگر، چشم‌های انسان‌ها را به اشتباه انداخت. معنای این جمله چیست؟ آیا چشم‌های شما هم تا به حال اشتباه کرده است؟", "a": ["معنی: نقاش دوم، خودِ «پرده» را نقاشی کرده بود؛ آن‌چنان شبیهِ پردهٔ واقعی که حتی داورِ آگاه و جمعیتِ تماشاگر — که می‌دانستند پرده‌ای بر نقاشی هست — فریب خوردند و دستِ داور به پردهٔ تصویری برخورد و او گمان کرد پردهٔ واقعی است؛ یعنی این‌بار نه حواسِ حیوان، بلکه چشم و ذهنِ انسان (با همهٔ آگاهی‌اش) به تقلیدِ واقعیت فریب خورد. پاسخ شخصی: بله؛ مثلاً بارها تصویرِ آینه را شیء واقعی پنداشته‌ام، یا در راهِ تاریک عارضهٔ درخت را انسانی دیده‌ام و جابه‌جا شده‌ام — چشم‌ها گاهی در تشخیصِ واقعیت خطا می‌کنند و تجربه و عقل آنها را تصحیح می‌کند."]}],"notes7":[],"exam":["درس ۱۷ «شازده کوچولو»: تلخیصی از داستان مشهور <b>آنتوان دو سنت‌اگزوپری</b> (خلبان و نویسندهٔ فرانسوی؛ ۱۹۰۰–۱۹۴۴ م) + روان‌خوانی <b>«دو نقّاش» از رابرت فیشر</b> («داستان‌هایی برای فکر کردن») — فصل ادبیات جهان.", "داستان: خلبانِ کودکِ نقاش ← قصهٔ شمارهٔ ۱ (مار بوآ با فیل در دلش) و شمارهٔ ۲ (مار بوآ با قوچ) ← آدم‌های بزرگ آن را «کلاه» پنداشتند ← فرود در صحرای آفریقا ← شازدهٔ کوچک و «قوچ در جعبه» ← کوچ با دسته‌های پرندگان مهاجر ← گلِ خودستا و کوچ از سیاره ← روباه: «اهلی شدن یعنی ایجاد رابطه»، «اگر مرا اهلی کنی زندگی‌ام چون خورشید می‌درخشد»، «صدای پای تو نغمه است»، «هرچه را اهلی کنی مسئولِ آن هستی» ← کارفرمای شمارندهٔ ستاره‌ها (شمارش بی‌فایده) ← «اکنون شش سال از آن ماجرا می‌گذرد... دوست دارم شب‌ها به ستاره‌ها نگاه کنم».", "پیام‌های کلیدی: با قلب ببین (چیزهای مهم با چشم دیده نمی‌شوند)؛ مسئولیتِ اهلی‌شدن؛ نقدِ آدم‌های بزرگِ مادی‌اندیش؛ دوستی = یگانه شدن.", "دو نقّاش: مسابقهٔ بهترین نقاش در یونان ← نقاش اول: کاسهٔ انگور (فریبِ پرندگان) ← نقاش دوم: پردهٔ نقاشی‌شده (فریبِ چشمِ انسان‌ها و داور) ← برندهٔ رسمی: نقاش دوم؛ پرسشِ پایانی: آیا به بهترین نقاش رسیدند؟", "دانش زبانی کتاب (املا): «ی» نکره پس از «های بیانی»: خانه + ی ← خانه‌ای، بنده‌ای؛ پس از «واو»: دانشجو + ی ← دانشجویی، رادیویی، آهویی.", "دستور (تمرین): قیدهای بند اول (وقتی، روزی، در کتابی)؛ تبدیل زمان فعل‌ها (نشان داده بودم — داشت پرواز می‌کرد — فاش بشود).", "املا: هضم، حدس، وداع، عزیمت، ستارگان، علاقه‌مند (اشتباه‌ها: حضم، حدث، ودا، عظیمت، ستاره‌گان، اعلقمند)."]},
{"id":18,"icon":"🤲","lnum":"بخش پایانی کتاب","title":"نیایش — بیا تا برآریم دستی ز دل","info":"شعر: سعدی (بوستان، باب دهم: در مناجات و ختم کتاب) | نثر: دکتر علی شریعتی | موضوع: دعا و مناجات","intro":"بخش پایانی کتاب فارسی نهم، «نیایش» است: شش بیت از باب دهم بوستان سعدی («در مناجات و ختم کتاب») و پس از آن، نیایشی نثر از دکتر علی شریعتی. سعدی، خواننده را به مناجات و نیایشِ بی‌درنگ فرامی‌خواند: بیا تا از تهِ دل و با تمامِ وجود دستی به درگاه خدا برآوریم؛ زیرا پس از مرگ، در گلزارِ قبر نمی‌توان عبادت کرد — «بیا تا برآریم دستی ز دل / که نتوان برآورد فردا ز گل»؛ ما به رزق و انعام و لطف تو پرورده شده‌ایم و به آنها خو کرده‌ایم؛ تو ما را در دنیا عزیز کردی، در آخرت نیز همین را از تو چشم داریم؛ ما را به لطف بخوان و از درم مران، که به جز آستانِ تو پناهی نداریم؛ چراغِ یقینم را بر راهم نگه دار و دستم را از بدکردن کوتاه کن؛ و مرا با ذلت از درِ خودم مران، که دری‌جز درِ تو نمی‌پذیرم. سپس شریعتی (در نثرِ مشهور خود) از خدا می‌خواهد: «خدایا، به من توفیقِ تلاش در شکست، صبر در نومیدی، ایمانِ بی‌ریا، مناجاتِ بی‌غرور، عشقِ بی‌هوس، دوست‌داشتنِ بی‌آنکه دوست بداند، روزی کن. خداوندا! به من زیستنی عطا کن که در لحظهٔ مرگ، بر بی‌ثمریِ لحظه‌ای که برای زیستن گذشته است، حسرت نخورم و مردنی عطا کن که بر بیهودگی‌اش سوگوار نباشم. خداوندا! به مؤمنان ما روشنایی و به روشنفکران ما ایمان و به خفتگان ما بیداری و به بیداران ما اراده و به مسلمانان ما قرآن، به فرقه‌های ما وحدت، به مردم ما خودآگاهی و عزت ببخش.»","kholase":["بخش پایانی کتاب فارسی نهم، «نیایش» است: شش بیت از باب دهم بوستان سعدی («در مناجات و ختم کتاب») و پس از آن، نیایشی نثر از دکتر علی شریعتی. سعدی، خواننده را به مناجات و نیایشِ بی‌درنگ فرامی‌خواند: بیا تا از تهِ دل و با تمامِ وجود دستی به درگاه خدا برآوریم؛ زیرا پس از مرگ، در گلزارِ قبر نمی‌توان عبادت کرد — «بیا تا برآریم دستی ز دل / که نتوان برآورد فردا ز گل»؛ ما به رزق و انعام و لطف تو پرورده شده‌ایم و به آنها خو کرده‌ایم؛ تو ما را در دنیا عزیز کردی، در آخرت نیز همین را از تو چشم داریم؛ ما را به لطف بخوان و از درم مران، که به جز آستانِ تو پناهی نداریم؛ چراغِ یقینم را بر راهم نگه دار و دستم را از function lessonById(id){return D.lessons.find(x=>x.id===+id)}
function doneBadge(id){return progress["l"+id]?"<span class=\"fa9-done-badge\">✓ خوانده شد</span>":""}

function vocabTableHTML(rows){
  if(!rows.length)return "<p class=\"fa9-muted\">واژه‌ای مطابق جست‌وجو پیدا نشد.</p>";
  const body=rows.map(v=>"<tr><td>"+esc(v.w)+"</td><td>"+esc(v.m)+"</td><td><span class=\"fa9-tag\">"+(v.l===18?"نیایش":"درس "+faNum(v.l))+"</span></td></tr>").join("");

function flashHTML(v,label){
  return "<div class=\"fa9-flash\" data-act=\""+(label||"vflashflip")+"\"><div class=\"fa9-f-word\">"+esc(v[0])+"</div><div class=\"fa9-f-fa\">"+esc(v[1])+"</div><div class=\"fa9-f-hint\">برای دیدن معنی، روی کارت کلیک کن</div></div>";
}
function filteredVocab(){
  const si=document.getElementById("fa9-vsearch"), se=document.getElementById("fa9-vsel");
  const q=si?(si.value||"").trim().toLowerCase():"";
  const lid=se?se.value:"0";
  const rows=[];
  D.lessons.forEach(L=>{
    if(lid!=="0"&&+lid!==L.id)return;
    L.vocab.forEach(v=>{
      if(q&&!(v[0].includes(q)||v[1].includes(q)))return;
      rows.push({l:L.id,w:v[0],m:v[1]});
    });
  });
  return rows;
}

function availableTabs(L){
