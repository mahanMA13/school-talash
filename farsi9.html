  if(S.vIdx>=rows.length)S.vIdx=rows.length-1;if(S.vIdx<0)S.vIdx=0;
  const v=rows[S.vIdx];
  return "<div class=\"fa9-flash"+(S.vFlipped?" flipped":"")+"\" data-act=\"vflashflip\"><div class=\"fa9-f-word\">"+esc(v.w)+"</div><div class=\"fa9-f-fa\">"+esc(v.m)+"</div><div class=\"fa9-f-hint\">برای دیدن معنی، روی کارت کلیک کن • "+(v.l===18?"نیایش":"درس "+faNum(v.l))+"</div></div>"
  +"<div class=\"fa9-toolbar\" style=\"justify-content:center\"><button class=\"fa9-btn secondary\" data-act=\"vflashnav\" data-d=\"-1\">واژۀ قبلی</button><span class=\"fa9-muted\">"+faNum(S.vIdx+1)+" از "+faNum(rows.length)+"</span><button class=\"fa9-btn secondary\" data-act=\"vflashnav\" data-d=\"1\">واژۀ بعدی</button></div>";
}
function viewQuestions(){
  const sel="<div class=\"fa9-toolbar\"><select class=\"fa9-select\" id=\"fa9-qsel\"><option value=\"0\">همۀ درس‌ها</option>"+D.lessons.map(l=>"<option value=\""+l.id+"\""+(S.qSel===String(l.id)?" selected":"")+">"+(l.id<=17?"درس "+faNum(l.id):"نیایش")+" — "+esc(l.title)+"</option>").join("")+"</select></div>";
  return shell("نمونه‌سؤال‌های تألیفی و پاسخ‌نامه","نمونه‌سؤال‌های هر درس بر پایۀ محتوای جزوه؛ سؤال‌های چهارگزینه‌ای تعاملی‌اند.",""+sel+"<div id=\"fa9-qlist\">"+qListHTML()+"</div>","questions");
}
function qListHTML(){
  const lid=S.qSel;
  let h="",n=0;
  D.lessons.forEach(L=>{
    if(lid!=="0"&&+lid!==L.id)return;
    h+="<h3 style=\"margin:22px 0 10px\">"+(L.id<=17?"درس "+faNum(L.id):"نیایش")+" — "+esc(L.title)+"</h3>";
    (L.questions||[]).forEach((q,qi)=>{h+=questionCardHTML(L,q,qi);n++});
  });
  return n?h:"<p class=\"fa9-muted\">سؤالی برای این فیلتر نیست.</p>";
}
function viewAppendix(){
  const a=D.appendix;
  const rows=a.rows.map(r=>"<tr><td>"+esc(r[0])+"</td><td>"+esc(r[1])+"</td><td>"+esc(r[2])+"</td></tr>").join("");
  return shell("پیوست — جدول کامل آرایه‌های ادبی و دانش‌های ادبی",esc(a.note),""
  +"<div class=\"fa9-searchbar\"><input id=\"fa9-asearch\" placeholder=\"جست‌وجوی آرایه (مثلاً: کنایه یا تلمیح)...\"></div>"
  +"<div class=\"fa9-tbl-wrap\"><table class=\"fa9-tbl\" id=\"fa9-atbl\"><thead><tr><th>آرایه</th><th>تعریف</th><th>نمونه‌ها از درس‌ها</th></tr></thead><tbody>"+rows+"</tbody></table></div>","appendix");
}
function viewAbout(){
  const I=FA9_INTRO;
  return shell("درباره",esc(I.aboutSub),""
  +"<div class=\"fa9-card\"><h3 style=\"margin-top:0\">سازنده</h3><p style=\"font-size:18px\"><strong>سازنده: ماهان شریفی</strong></p>"
  +"<p>"+esc(I.aboutBody)+"</p>"
  +"<p class=\"fa9-muted\">"+esc(I.aboutTech)+"</p></div>","about");
}
function view404(){
  return shell("صفحه پیدا نشد","مسیر واردشده معتبر نیست.","<a class=\"fa9-btn\" href=\"#fa9-home\">بازگشت به خانه</a>","");
}

/* ---------- رندر و مسیریابی ---------- */
function renderView(name,arg){
  let html="",navKey="";
  if(name==="home"){html=viewHome();navKey="home"}
  else if(name==="lessons"){html=viewLessons();navKey="lessons"}
  else if(name==="lesson"){html=viewLesson(arg);navKey="lessons"}
  else if(name==="vocab"){html=viewVocab();navKey="vocab"}
  else if(name==="questions"){html=viewQuestions();navKey="questions"}
  else if(name==="appendix"){html=viewAppendix();navKey="appendix"}
  else if(name==="about"){html=viewAbout();navKey="about"}
  else html=view404();
  app.innerHTML=html;
  if(nav)nav.querySelectorAll("a").forEach(a=>a.classList.toggle("active",a.dataset.nav===navKey));
  updateRing();
  window.scrollTo(0,0);
}
function route(){
  const h=location.hash||"";
  if(h.indexOf("#fa9-")!==0)return;
  const name=h.slice(5);
  const m=name.match(/^lesson-(\d+)$/);
  if(m)renderView("lesson",+m[1]);
  else if(["home","lessons","vocab","questions","appendix","about"].indexOf(name)>=0)renderView(name,name);
  else renderView("404");
}

/* ---------- تعامل‌ها ---------- */
function answerQ(btn){
  const l=+btn.dataset.l,qi=+btn.dataset.q,i=+btn.dataset.i,key=l+"-"+qi;
  if(S.answered[key]!==undefined)return;
  const L=lessonById(l),item=L&&L.questions?L.questions[qi]:undefined;if(!L||!item)return;
  S.answered[key]=i;
  const box=btn.closest(".fa9-options");
  Array.prototype.forEach.call(box.children,(b,j)=>{b.disabled=true;if(j===item.ans)b.classList.add("correct")});
  if(i!==item.ans)btn.classList.add("wrong");
  const card=btn.closest(".fa9-qcard"),r=card.querySelector(".fa9-result");
  r.innerHTML=(i===item.ans?"✅ درست! ":"❌ پاسخ درست نیست. ")+esc(item.ex||"");
  r.hidden=false;
}
function setTab(btn){
  const l=+btn.dataset.l,tab=btn.dataset.tab;
  S.tabs[l]=tab;
  document.querySelectorAll("#fa9-ltabs .fa9-tab").forEach(b=>b.classList.toggle("active",b===btn));
  const body=document.getElementById("fa9-lbody");if(body)body.innerHTML=lessonPanel(l,tab);
}
function reveal(btn){
  const body=document.getElementById(btn.dataset.target);if(!body)return;
  body.hidden=!body.hidden;
  btn.textContent=body.hidden?"نمایش پاسخ":"پنهان کردن پاسخ";
}
function mark(btn){
  const k="l"+btn.dataset.l;
  if(progress[k])delete progress[k];else progress[k]=Date.now();
  saveP();
  btn.classList.toggle("secondary",!!progress[k]);
  btn.textContent=progress[k]?"✓ درس تکمیل شده":"علامت‌گذاری به‌عنوان مطالعه‌شده";
}
function showLFlash(btn){
  const l=+btn.dataset.l,L=lessonById(l);if(!L)return;
  const st=S.lFlash[l]||(S.lFlash[l]={idx:0,flipped:false,on:false});
  const area=document.getElementById("fa9-lflash-"+l);if(!area)return;
  st.on=!st.on;
  area.innerHTML=st.on?lFlashHTML(L):"";
  btn.textContent=st.on?"بستن مرور کارتی":"مرور کارتی این واژگان";
}
function lFlashHTML(L){
  const st=S.lFlash[L.id],v=L.vocab[st.idx];
  return "<div class=\"fa9-flash"+(st.flipped?" flipped":"")+"\" data-act=\"lflashflip\" data-l=\""+L.id+"\"><div class=\"fa9-f-word\">"+esc(v[0])+"</div><div class=\"fa9-f-fa\">"+esc(v[1])+"</div><div class=\"fa9-f-hint\">برای دیدن معنی کلیک کن</div></div>"
  +"<div class=\"fa9-toolbar\" style=\"justify-content:center\"><button class=\"fa9-btn secondary\" data-act=\"lflashnav\" data-l=\""+L.id+"\" data-d=\"-1\">واژۀ قبلی</button><span class=\"fa9-muted\">"+faNum(st.idx+1)+" از "+faNum(L.vocab.length)+"</span><button class=\"fa9-btn secondary\" data-act=\"lflashnav\" data-l=\""+L.id+"\" data-d=\"1\">واژۀ بعدی</button></div>";
}
function lFlashRender(l){
  const L=lessonById(l),area=document.getElementById("fa9-lflash-"+l);
  if(area)area.innerHTML=lFlashHTML(L);
}
function filtersChanged(){
  const tv=document.getElementById("fa9-vtable");
  if(tv)tv.innerHTML=vocabTableHTML(filteredVocab());
  const vf=document.getElementById("fa9-vflash");
  if(vf&&S.vFlashOn){S.vIdx=0;S.vFlipped=false;vf.innerHTML=vFlashHTML()}
}
app.addEventListener("click",function(e){
  const t=e.target.closest("[data-act]");if(!t)return;
  const act=t.dataset.act;
  if(act==="tab")setTab(t);
  else if(act==="opt")answerQ(t);
  else if(act==="reveal")reveal(t);
  else if(act==="mark")mark(t);
  else if(act==="lflash")showLFlash(t);
  else if(act==="lflashflip"){const l=+t.dataset.l;S.lFlash[l].flipped=!S.lFlash[l].flipped;lFlashRender(l)}
  else if(act==="lflashnav"){const l=+t.dataset.l,st=S.lFlash[l],n=lessonById(l).vocab.length;st.idx=(st.idx+ +t.dataset.d+n)%n;st.flipped=false;lFlashRender(l)}
  else if(act==="vflashmode"){S.vFlashOn=!S.vFlashOn;S.vIdx=0;S.vFlipped=false;renderView("vocab")}
  else if(act==="vflashflip"){S.vFlipped=!S.vFlipped;const vf=document.getElementById("fa9-vflash");if(vf)vf.innerHTML=vFlashHTML()}
  else if(act==="vflashnav"){const n=filteredVocab().length;S.vIdx=(S.vIdx+ +t.dataset.d+n)%n;S.vFlipped=false;const vf=document.getElementById("fa9-vflash");if(vf)vf.innerHTML=vFlashHTML()}
});
app.addEventListener("input",function(e){
  if(e.target.id==="fa9-vsearch")filtersChanged();
  else if(e.target.id==="fa9-vsel")filtersChanged();
  else if(e.target.id==="fa9-qsel"){S.qSel=e.target.value;const ql=document.getElementById("fa9-qlist");if(ql)ql.innerHTML=qListHTML()}
  else if(e.target.id==="fa9-asearch"){
    const q=(e.target.value||"").trim().toLowerCase();
    document.querySelectorAll("#fa9-atbl tbody tr").forEach(tr=>{
      tr.style.display=(!q||tr.textContent.toLowerCase().includes(q))?"":"none";
    });
  }
});
app.addEventListener("change",function(e){
  if(e.target.id==="fa9-vsel")filtersChanged();
  else if(e.target.id==="fa9-qsel"){S.qSel=e.target.value;const ql=document.getElementById("fa9-qlist");if(ql)ql.innerHTML=qListHTML()}
});

/* ---------- شروع: اول رندر محتوا، بعد اتصال امکانات جانبی ---------- */
function start(){
  try{
    if((location.hash||"").indexOf("#fa9-")===0)route();
    else renderView("home");
  }catch(err){
    try{
      app.innerHTML='<div class="fa9-panel" style="margin:24px auto;max-width:640px;text-align:center"><h2>فارسی پایه نهم</h2><p>در نمایش این بخش خطایی رخ داد. لطفاً صفحه را دوباره بارگذاری کن.</p><p class="fa9-muted">'+esc(String((err&&err.message)||err))+'</p><a class="fa9-btn" href="#fa9-home">تلاش دوباره</a></div>';
    }catch(e2){}
  }
}
window.addEventListener("hashchange",function(){start()});
start();

/* ---------- تم، منو، دکمۀ بالا (اختیاری) ---------- */
try{
  const themeBtn=document.getElementById("fa9-themeBtn");
  if(sGet("fa9-theme")==="dark")wrap.classList.add("dark");
  if(themeBtn)themeBtn.onclick=function(){
    wrap.classList.toggle("dark");
    sSet("fa9-theme",wrap.classList.contains("dark")?"dark":"light");
  };
}catch(e){}
try{
  const menuBtn=document.getElementById("fa9-menuBtn");
  if(menuBtn)menuBtn.onclick=function(){nav.classList.toggle("fa9-open")};
  if(nav)nav.addEventListener("click",function(e){if(e.target.closest("a"))nav.classList.remove("fa9-open")});
}catch(e){}
try{
  const toTop=document.getElementById("fa9-toTop");
  if(toTop){
    window.addEventListener("scroll",function(){toTop.classList.toggle("show",window.scrollY>500)});
    toTop.onclick=function(){window.scrollTo({top:0,behavior:"smooth"})};
  }
}catch(e){}
})();

</script>
</body>
</html>
