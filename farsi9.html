/* ============================================================
   ماژول آموزشی فارسی پایه نهم — استایل مستقل (fa9-*)
   سبک هماهنگ با ماژول نمونه (ریاضی نهم)
   ============================================================ */
#fa9-module{
  --fa9-bg:#f5f7fb; --fa9-surface:#fff; --fa9-surface2:#eef2f7;
  --fa9-text:#172033; --fa9-muted:#647084;
  --fa9-primary:#5b5cf0; --fa9-primary2:#7b61ff;
  --fa9-good:#18a46a; --fa9-bad:#df4b58;
  --fa9-border:#dde3ed;
  --fa9-shadow:0 12px 35px rgba(25,35,55,.08);
  --fa9-progress:0%;
  font-family:"Vazirmatn",Tahoma,Arial,sans-serif;
  background:var(--fa9-bg); color:var(--fa9-text);
  line-height:1.9; direction:rtl; text-align:right;
  min-height:100vh;
}
#fa9-module *{box-sizing:border-box}
#fa9-module.dark{
  --fa9-bg:#0d1119; --fa9-surface:#151b26; --fa9-surface2:#202938;
  --fa9-text:#edf1f7; --fa9-muted:#a4afbf; --fa9-border:#293344;
  --fa9-shadow:0 12px 35px rgba(0,0,0,.22);
}
#fa9-module a{text-decoration:none;color:inherit}
#fa9-module p{margin:8px 0}

/* ---------- نوار بالای ماژول ---------- */
.fa9-topbar{height:72px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:24px;padding:0 5%;background:var(--fa9-surface);background:color-mix(in srgb,var(--fa9-surface) 92%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--fa9-border)}
.fa9-brand{display:flex;align-items:center;gap:10px;min-width:175px}
.fa9-brand-logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--fa9-primary),var(--fa9-primary2));color:#fff;font-weight:800;font-size:17px;box-shadow:0 7px 18px rgba(27,45,85,.25);border:1px solid var(--fa9-border)}
.fa9-brand small{display:block;color:var(--fa9-muted);font-size:11px}
.fa9-nav{display:flex;gap:4px;flex:1;justify-content:center}
.fa9-nav a{padding:8px 11px;border-radius:10px;color:var(--fa9-muted);font-size:14px}
.fa9-nav a:hover{background:var(--fa9-surface2);color:var(--fa9-text)}
.fa9-nav a.active{background:var(--fa9-surface2);color:var(--fa9-primary)}
.fa9-actions{display:flex;gap:7px}
.fa9-actions button,.fa9-mobile-only{border:1px solid var(--fa9-border);background:var(--fa9-surface);color:var(--fa9-text);border-radius:10px;width:40px;height:40px;cursor:pointer;font-size:16px}
.fa9-mobile-only{display:none}
.fa9-actions .fa9-back-btn{width:auto;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--fa9-border);background:var(--fa9-surface);color:var(--fa9-primary);border-radius:10px;height:40px;padding:0 13px;cursor:pointer;font:inherit;font-size:13px;font-weight:700;white-space:nowrap;transition:background .15s ease}
.fa9-actions .fa9-back-btn:hover{background:var(--fa9-surface2)}
@media(max-width:600px){.fa9-actions .fa9-back-btn{width:40px;padding:0}.fa9-actions .fa9-back-btn .fa9-back-text{display:none}}

/* ---------- هیرو ---------- */
.fa9-hero{padding:70px 5% 45px;background:radial-gradient(circle at 85% 15%,#7b61ff22,transparent 35%),radial-gradient(circle at 15% 10%,#5b5cf018,transparent 30%)}
.fa9-hero-grid{max-width:1180px;margin:auto;display:grid;grid-template-columns:1.35fr .65fr;gap:40px;align-items:center}
.fa9-eyebrow{display:inline-block;padding:5px 11px;border-radius:99px;background:#5b5cf012;color:var(--fa9-primary);font-size:12px;font-weight:bold}
.fa9-hero h1{font-size:clamp(32px,5vw,58px);line-height:1.2;margin:15px 0}
.fa9-hero h1 span{color:var(--fa9-primary)}
.fa9-hero .fa9-lead{color:var(--fa9-muted);max-width:690px;font-size:17px}
.fa9-hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}
.fa9-btn{border:0;border-radius:12px;padding:11px 18px;cursor:pointer;font:inherit;font-weight:bold;background:var(--fa9-primary);color:#fff;display:inline-block}
.fa9-btn:hover{filter:brightness(1.07)}
.fa9-btn.secondary{background:var(--fa9-surface);color:var(--fa9-text);border:1px solid var(--fa9-border)}
.fa9-progress-card{background:var(--fa9-surface);border:1px solid var(--fa9-border);padding:25px;border-radius:24px;box-shadow:var(--fa9-shadow)}
.fa9-progress-ring{width:150px;height:150px;margin:auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--fa9-primary) var(--fa9-progress,0%),var(--fa9-surface2) 0)}
.fa9-progress-ring>div{width:116px;height:116px;border-radius:50%;background:var(--fa9-surface);display:grid;place-items:center;font-size:27px;font-weight:bold}

/* ---------- بخش‌ها و کارت‌ها ---------- */
.fa9-section{max-width:1180px;margin:0 auto;padding:45px 5%}
.fa9-section-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px;flex-wrap:wrap}
.fa9-section h2{margin:0;font-size:29px}
.fa9-muted{color:var(--fa9-muted)}
.fa9-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.fa9-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.fa9-card{background:var(--fa9-surface);border:1px solid var(--fa9-border);border-radius:19px;padding:19px;box-shadow:var(--fa9-shadow);transition:.2s}
.fa9-card:hover{transform:translateY(-3px)}
.fa9-lesson-card{min-height:190px;position:relative;overflow:hidden;display:block}
.fa9-chapter-num{font-size:12px;color:var(--fa9-primary);font-weight:bold}
.fa9-chapter-icon{position:absolute;left:15px;top:13px;font-size:42px;opacity:.14}
.fa9-lesson-card h3{margin:35px 0 5px}
.fa9-done-badge{position:absolute;top:14px;right:14px;background:var(--fa9-good);color:#fff;border-radius:99px;font-size:11px;font-weight:bold;padding:3px 10px}
.fa9-tags{display:flex;gap:6px;flex-wrap:wrap}

.fa9-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

.fa9-stat b{display:block;font-size:25px}

.fa9-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px;position:sticky;top:72px;z-index:10;background:var(--fa9-bg);padding:10px 0;border-bottom:1px solid var(--fa9-border)}
.fa9-tab{border:1px solid var(--fa9-border);background:var(--fa9-surface);color:var(--fa9-muted);border-radius:12px;padding:8px 14px;cursor:pointer;font:inherit;font-size:14px;font-weight:600;transition:.15s}
.fa9-tab:hover{border-color:var(--fa9-primary);color:var(--fa9-primary)}
.fa9-tab.active{background:var(--fa9-primary);border-color:var(--fa9-primary);color:#fff}
.fa9-panel{animation:fa9fade .25s ease}

.fa9-rule{padding:14px 16px;border-radius:16px;background:var(--fa9-surface2);border-right:4px solid var(--fa9-primary);margin:10px 0 16px}
.fa9-rule p{margin:6px 0 0;line-height:2}
.fa9-exbox{background:#5b5cf00c;border-right:4px solid var(--fa9-primary);padding:12px 16px;margin:10px 0;border-radius:9px}
.fa9-exbox .fa9-en{direction:ltr;text-align:left;font-family:Arial,sans-serif;font-weight:600}
.fa9-exbox .fa9-fa{color:var(--fa9-muted);font-size:14px;margin-top:2px}
.fa9-formula{background:#5b5cf00c;border-right:4px solid var(--fa9-primary);padding:12px 16px;margin:10px 0;border-radius:9px;font-family:Arial,sans-serif;direction:ltr;text-align:left}
.fa9-example{background:#18a46a0b;border-right:4px solid var(--fa9-good);padding:14px;border-radius:10px}
.fa9-tip{background:#f59e0b0c;border-right:4px solid #f59e0b;padding:14px;border-radius:10px}
.fa9-warn{background:#df4b5818;border-right:4px solid var(--fa9-bad);padding:12px 14px;border-radius:10px;font-size:14px}
.fa9-h4{margin:22px 0 8px;font-size:17px}
.fa9-tbl-wrap{overflow:auto;border:1px solid var(--fa9-border);border-radius:14px;margin:10px 0}
.fa9-tbl{width:100%;border-collapse:collapse;background:var(--fa9-surface);font-size:15px;min-width:480px}
.fa9-tbl th{background:var(--fa9-surface2);padding:10px 12px;text-align:right;font-size:13px;color:var(--fa9-muted)}
.fa9-tbl td{padding:9px 12px;border-top:1px solid var(--fa9-border)}
.fa9-tbl .fa9-ltr{direction:ltr;text-align:left;font-family:Arial,sans-serif;font-weight:600;white-space:nowrap}

.fa9-chat{display:grid;gap:10px;margin:14px 0}

.fa9-msg.b{margin-inline-start:auto;background:#5b5cf00c;border-start-start-radius:4px}
.fa9-msg-name{font-size:12px;color:var(--fa9-primary);font-weight:800}
.fa9-msg-en{direction:ltr;text-align:left;font-family:Arial,sans-serif;font-weight:600}
.fa9-msg-fa{color:var(--fa9-muted);font-size:14px;border-top:1px dashed var(--fa9-border);margin-top:6px;padding-top:6px}

.fa9-qcard{margin-bottom:13px}

.fa9-option:hover{border-color:var(--fa9-primary);background:var(--fa9-surface)}
.fa9-option.selected{border-color:var(--fa9-primary);background:#5b5cf01c}

.fa9-option.wrong{border-color:var(--fa9-bad);background:#df4b5818}
.fa9-option:disabled{opacity:1}
.fa9-result{padding:14px;border-radius:12px;background:var(--fa9-surface2);margin-top:15px}
.fa9-acc-btn{border:1px solid var(--fa9-border);background:var(--fa9-surface2);color:var(--fa9-text);border-radius:10px;padding:8px 14px;cursor:pointer;font:inherit;font-size:13px;font-weight:700;margin-top:10px}
.fa9-acc-btn:hover{border-color:var(--fa9-primary);color:var(--fa9-primary)}
.fa9-acc-body[hidden]{display:none}

/* ---------- ابزارها ---------- */
.fa9-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0;align-items:center}
.fa9-select{padding:10px;border:1px solid var(--fa9-border);border-radius:10px;background:var(--fa9-surface);color:var(--fa9-text);font:inherit}
.fa9-searchbar{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.fa9-searchbar input{flex:1;min-width:200px;padding:13px 15px;border:1px solid var(--fa9-border);background:var(--fa9-surface);color:var(--fa9-text);border-radius:12px;font:inherit;outline:none}
.fa9-searchbar input:focus{border-color:var(--fa9-primary)}
.fa9-pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:25px}

/* ---------- فلش‌کارت واژگان ---------- */
.fa9-flash{max-width:460px;margin:18px auto;text-align:center;padding:34px 22px;border-radius:19px;border:2px solid var(--fa9-border);background:var(--fa9-surface);box-shadow:var(--fa9-shadow);cursor:pointer;min-height:180px;display:flex;flex-direction:column;justify-content:center;gap:10px;transition:.2s;user-select:none}
.fa9-flash:hover{border-color:var(--fa9-primary);transform:translateY(-3px)}
.fa9-flash .fa9-f-en{font-size:32px;font-weight:800;direction:ltr;font-family:Arial,sans-serif}
.fa9-flash .fa9-f-word{font-size:31px;font-weight:800}
.fa9-flash .fa9-f-fa{font-size:21px;color:var(--fa9-primary);font-weight:800;visibility:hidden}
.fa9-flash.flipped .fa9-f-fa{visibility:visible}
.fa9-flash .fa9-f-hint{font-size:12px;color:var(--fa9-muted)}

/* ---------- فوتر و دکمه بالا ---------- */
.fa9-footer{padding:35px 5%;margin-top:35px;border-top:1px solid var(--fa9-border);display:flex;justify-content:space-between;gap:20px;color:var(--fa9-muted);flex-wrap:wrap}
.fa9-to-top{position:fixed;bottom:20px;left:20px;border:0;border-radius:12px;width:43px;height:43px;background:var(--fa9-primary);color:#fff;cursor:pointer;display:none;z-index:30;font-size:16px}
.fa9-to-top.show{display:block}

@media(max-width:600px){

  .fa9-card{box-shadow:none}

{"id":2,"icon":"🌌","lnum":"درس دوم","title":"عجایب صُنعِ حق تعالی","info":"نویسنده: امام محمّد غزّالی | منبع: کیمیای سعادت | نوع متن: توصیفی و تعلیمی","intro":"<b>پیام اصلی:</b> جهان هستی، سراسر نشانهٔ قدرت و مهربانی خداوند است؛ انسان باید با نگاهِ تفکر در آیات الهی، خود را از غفلت برهاند و به آفرینندهٔ جهان پی ببرد؛ همیشه در خانهٔ خداییم، پس هیچ‌وقت از شگفتی‌های آن تعجب نکنیم و غافل نباشیم.","kholase":["این درس نثری توصیفی از کتاب <b>کیمیای سعادت</b> غزالی است که به توصیف شگفتی‌های آفرینش می‌پردازد. نویسنده می‌گوید هر ذرهٔ عالم، آفریدهٔ خداوند بلندمرتبه است: آسمان و آفتاب و ماه و ستارگان، زمین و کوه‌ها و بیابان‌ها و رودها، جواهر و معادن، گیاهان گوناگون، حیوانات خشکی و دریا و پدیده‌هایی مانند ابر و باران و برف و تگرگ و رعد و برق و رنگین‌کمان. همهٔ این‌ها نشانه‌ها (آیات) خداوندند که به ما فرمان داده شده در آنها بنگریم و تفکر کنیم. غزالی سپس زمین را به فرشی گسترده و بهار را به دیبایی (پارچهٔ ابریشمی) رنگارنگ تشبیه می‌کند و می‌گوید: این عالم خانهٔ خداست؛ سقفش آسمان، چراغش ماه و شعله‌اش آفتاب و چراغدان‌هایش ستارگان‌اند. اگر انسان در خانه‌ای نقاشی‌شده وارد شود شگفت‌زده می‌شود، اما همیشه در این خانهٔ عظیم خدا هستی و تعجب نمی‌کنی! انسان مثل مورچه‌ای کوچک است، اما هرچه در کوه و دریا و هستی ببیند، در خودش نیز نهاده شده است."],"payam":"<b>پیام اصلی:</b> جهان هستی، سراسر نشانهٔ قدرت و مهربانی خداوند است؛ انسان باید با نگاهِ تفکر در آیات الهی، خود را از غفلت برهاند و به آفرینندهٔ جهان پی ببرد؛ همیشه در خانهٔ خداییم، پس هیچ‌وقت از شگفتی‌های آن تعجب نکنیم و غافل نباشیم.","khanesh":"<b>نکتۀ خوانش:</b> متن‌های توصیفی را با لحن توصیفی و آهنگی آرام و لطیف می‌خوانیم؛ در خواندن این‌گونه متن‌ها دقت در مفهوم جمله‌ها در بیان آهنگ کلام مؤثر است.","blocks":[{"k": "sub", "t": "بخش نخست متن (صفحهٔ ۱۷)"}, {"k": "prose", "t": "«بدان که هرچه ذره در وجود است، همه صنعِ خدای تعالی است. آسمان‌ها و ابرها و بادها و ماه و ستارگان و زمین و آنچه بر وی است، چون کوه‌ها و بیابان‌ها و نهرها و آنچه در کوه‌هاست از جواهر و معادن و آنچه بر روی زمین است از انواع نباتات و آنچه در بَرّ و بحر است از انواع حیوانات و آنچه در میان آسمان و زمین است، چون مرغ و میغ و رعد و برق و قوس و قزح و علاماتی که در هوا پدید آید، همه عجایب صنع حق تعالی است و این همه، آیات حق تعالی است که تو را فرموده است که در آنها نگری؛ پس در این آیاتِ حق تعالی تفکر کن.»", "mean": [["معنی", "بدان که هرچه در جهان هستی وجود دارد، همه ساختهٔ (آفریدهٔ) خداوند بلندمرتبه است: آسمان‌ها، ابرها، بادها، ماه و ستارگان؛ زمین و هرچه بر آن است مانند کوه‌ها، بیابان‌ها و رودها؛ هرچه در کوه‌هاست از سنگ‌های گران‌بها و معدن‌ها؛ هرچه بر زمین است از گیاهان گوناگون؛ هرچه در خشکی و دریاست از جوندگان؛ و هرچه در میان آسمان و زمین است مانند پرندگان، ابر، صدای ابرها (رعد)، برق، رنگین‌کمان و نشانه‌هایی که در هوا پیدا می‌شود. همهٔ این‌ها شگفتی‌های آفرینش خداوندند و نشانه‌هایی از اویند که به تو فرمان داده در آنها بنگری؛ پس در این نشانه‌های خداوند فکر و اندیشه کن."], ["لغت", "صنع: آفرینش و ساختن / تعالی: بلندمرتبه / نهرها: رودها و جوی‌ها / جواهر: گوهرها / معادن: جمع معدن / نباتات: گیاهان / بَرّ: خشکی / بحر: دریا / میغ: ابر / رعد: صدای ابر / قوس و قزح: رنگین‌کمان / علامات: نشانه‌ها / عجایب: شگفتی‌ها / آیات: نشانه‌ها."]]}, {"k": "sub", "t": "بخش دوم متن (صفحهٔ ۱۸)"}, {"k": "prose", "t": "«زمین را فرشی گشوده و جوانبِ آن را فراخ ساخت و از زیرِ سنگ‌ها، آبِ لطیف و گوارا روان کرد تا هر گیاهی که در میانِ زمین است بر آن جاری شود؛ چون بهار فرا رسد، زمین زنده و شاداب گردد و هر گیاهی، آنچه را به کارِ او باید، داد (برگ و گل و میوه پدید آورد) و دنیا چون دیبایی رنگارنگ شود.»", "mean": [["معنی", "خداوند زمین را مانند فرشی گسترده ساخت و کرانه‌های آن را پهنا داد و از زیر سنگ‌ها آب گوارا جاری کرد تا هر گیاهی سیراب شود؛ چون بهار فرا رسد، زمین زنده و شاداب می‌شود و به هر گیاهی آنچه را لازم دارد داده می‌شود؛ پس برگ و گل و میوه می‌رویاند و جهان چون پارچه‌ای ابریشمی رنگارنگ می‌شود. جملهٔ «هر یکی را آنچه به کار باید، داد» یعنی خداوند نیازِ هر موجود را کامل و متناسب با او فراهم کرده است."], ["لغت", "بساط: فرش و هر چیز گسترده / جوانب: کرانه‌ها و اطراف / فراخ: گشاده و پهنا / لطیف: خوش‌گوار / روان: جاری / دیبا: پارچهٔ ابریشمی رنگارنگ."]]}, {"k": "sub", "t": "بخش پایانی متن (صفحهٔ ۱۹)"}, {"k": "prose", "t": "«مَثَل تو چون مورچه‌ای کوچکی؛ چون در همه کوه‌ها و دریا و هستی بینی، در خودت نیز... و اگر داخل خانه‌ای شوی که نقّاشی و گچ‌بری کرده باشند، سالها در آن درنگ کنی و از تعجب بیرون نروی و همیشه در خانهٔ خدایی، هیچ تعجب نکنی! این عالم خانهٔ خداست؛ چراغ وی ماه است و شعلهٔ وی آفتاب و تو از عجایب این غافل؛ که خانه بس بزرگ است و چشم تو بس مختصر.»", "mean": [["معنی", "تو مانند مورچهٔ کوچکی هستی که با چشمِ کوچک خود، کوه‌ها و دریاها و هستیِ عظیم را می‌بیند، در حالی که همان شگفتی‌ها در اندامِ خودِ او نیز نهاده شده است. اگر وارد خانه‌ای شوی که نقاشی و گچ‌بری زیبایی دارد، سال‌ها در آن می‌مانی و از شگفتیِ آن بیرون نمی‌آیی؛ اما تو همیشه در خانهٔ خدا (جهان) هستی و اصلاً تعجب نمی‌کنی و غافلی! این جهان، خانهٔ خداست: چراغِ او ماه است و شعلهٔ چراغ او خورشید و ستارگان چراغدان‌های اویند؛ خانه بسیار بزرگ است و چشمِ تو بسیار کوچک (و کوتاه‌بین)."], ["لغت", "مختصر: کوچک و اندک / غافل: بی‌خبر."]]}, {"k": "sub", "t": "شعرخوانی «پرواز»"}, {"k": "p", "t": "<b>شاعر: علی اسفندیاری (نیما یوشیج)</b> — این شعرخوانی گفت‌وگویی شیرین میان <b>مرغِ آزاد و پروازآموز</b> و <b>کرمِ پیله‌ساز</b> است. مرغ با فروتنی از کرم می‌پرسد: «تا کی در پیلهٔ خویش می‌مانی و دور از دیگران، برای خودت تار می‌بافی (می‌تنی)؟ تا کی گوشه‌گیر و در انزدا (محبسِ تنِ خویش) می‌مانی؟» مرغ به کرم یادآوری می‌کند که <b>همسالانِ او پروازگان شده‌اند</b> و او نیز می‌تواند از پیله بیرون آید و پرواز کند. پیام شعر این است که انسان نباید در انزوا و خودتنماندگی، مانند کرم در پیله، بماند؛ باید دلات را به پرواز و رشد و آزادی بگشاید و با یادگیری و هم‌سفر شدن با دیگران، پرواز را بیاموزد."}, {"k": "verse", "lines": [{"n": "٭", "hem": ["در پیله تا به کی، بر خویشتن تنی؟", "تا که پرِ پرواز، برآوری به تنِ خویش؟"]}], "mean": [["معنی", "تا کی در پیله (انزوا) می‌مانی و تنها برای خودت تار می‌بافی؟ تا کی می‌خواهی برای تنِ خویش، پرِ پرواز نرویانی؟ (در پیله ماندن = انزوا و خودتن‌پروری؛ پرِ پرواز = آمادگیِ رشد و آزادی)."], ["نکتهٔ دستوری (از کتاب درس ۶)", "فعل «تنی» در مصراع نخست، مضارعِ التزامی است که به صورت کوتاه‌شدهٔ «می‌تنی {"id":3,"icon":"🪞","lnum":"درس سوم","title":"مثل آیینه، کار و شایستگی","info":"نویسندهٔ متن و شاعر: پروین اعتصامی | قالب شعر: قطعه | منبع: دیوان پروین اعتصامی","intro":"<b>پیام اصلی:</b> جوانی، بهارِ کار و تلاش است؛ آن را غنیمت بشمار، از راه راست منحرف نشو، آموختن را ننگ مگیر و با چشمِ بصیرت، خود را بیازما؛ زیرا فرصت دگربار نیست و همهٔ روزگار، درس است و پند.","kholase":["درس ۳ دو بخش دارد. در بخش <b>نثر</b> آمده است: انسان در مرحلهٔ نوجوانی دوباره «متولد» می‌شود؛ دوران کودکی به پایان می‌رسد و ارتباط‌های او با دیگران گسترش می‌یابد. در این دوره، <b>دوستی و رفاقت</b> مهم‌ترین موضوع زندگی است؛ دوستِ خوب مانند آیینه، نقش‌ها و عیب‌های ما را به ما نشان می‌دهد و ما را از آفت‌های راهِ رشد می‌رهاند، و دوستِ بد مانند گرگ در جامهٔ میش، ما را به بیراهه می‌کشاند. در بخش <b>شعر</b>، پروین اعتصامی نوجوانان را به کار و شایستگی، دوراندیشی، بردباری و آموختن فرا می‌خواند: جوانی زمانِ کار و نشان دادن لیاقت است نه خودپسندی؛ فرصتِ زندگی یک بار بیش نیست؛ باید از راهِ راست خارج نشد، از آزادگان بردباری و کوشش آموخت و از راه‌های پلید دوری کرد؛ روزگار نیز همه‌اش درس و عبرت است، اما شاگردِ هشیاری اندک است."],"payam":"<b>پیام اصلی:</b> جوانی، بهارِ کار و تلاش است؛ آن را غنیمت بشمار، از راه راست منحرف نشو، آموختن را ننگ مگیر و با چشمِ بصیرت، خود را بیازما؛ زیرا فرصت دگربار نیست و همهٔ روزگار، درس است و پند.","khanesh":"","blocks":[{"k": "sub", "t": "معنی نثر آغاز درس (صفحهٔ ۲۴)"}, {"k": "p", "t": "«انسان در مرحلهٔ نوجوانی، دوباره متولد می‌شود و دوران کودکی به پایان می‌رسد. در این مرحله، علاوه بر ارتباط با والدین (پدر و مادر)، ارتباط نوجوان با هم‌سالان و هم‌کلاسانِ خود، جنبهٔ تازه‌ای به خود می‌گیرد و گسترش می‌یابد؛ زیرا این ارتباط‌ها، رابطهٔ نوجوان را با دوستان و هم‌سن‌وسالانش مانند (روزهای آغاز زندگی) می‌کند. این ارتباط‌ها وابسته به دوست‌یابی است که به نوجوان برای رسیدن به خودشناسی کمک می‌کند. دوستِ خوب و واقعی، مانند آیینه است: همان‌گونه که آیینه، صورت و نظافت ما را به ما نشان می‌دهد، دوستِ صادق نیز، هم عیب‌های ما را به ما می‌گوید و هم ما را یاری می‌دهد تا خود را بشناسیم و اصلاح کنیم. به همین سبب، عیب‌جوییِ دوست مانند آیینه است: اگر عیبی در ما نشان دهد، شکستنِ آیینه خطاست و درست آن است که خود را اصلاح کنیم. در یافتن دوستِ خوب، مشورت با پدر و مادر، معلمان دلسوز و... به ما یاری می‌رساند و ما را از دام‌ها و خطرها (همچون گرگ در جامهٔ میش) آگاه می‌سازد؛ چه بسیارند کسانی که لافِ (میش‌نوازی و) دوستی می‌زنند، اما در حقیقت گرگ‌اند.»"}, {"k": "note", "t": "<b>نکتهٔ خوانش (از کتاب):</b> متن‌های تعلیمی با هدف آموزش و اندرز نوشته شده‌اند؛ خواننده باید آهنگ و لحنِ متناسب با فضای تعلیمی را رعایت کند: با حفظ روحیهٔ نیک‌اندیشی و خیرخواهی، <b>نرمی و ملایمت</b> در گفتار به کار گیرد. البته گاهی اندرز با زنهار و پرهیز همراه است که نباید آن را با لحن دستوری و فرمان یکسان دانست."}, {"k": "sub", "t": "شعر درس (صفحهٔ ۲۵ و ۲۶) — بیت‌به‌بیت"}, {"k": "verse", "lines": [{"n": "٭", "hem": ["آیینه، چون نقشِ تو بنمود راست", "خود شکِن، آیینه شکستن خطاست"]}], "mean": [["معنی", "اگر آیینه، صورت و عیب‌های تو را درست نشان داد، نباید آیینه را بشکنی (تا عیب‌ها را نبینی!)؛ خطا شکستنِ آیینه است، نه نشان دادنِ حقیقت؛ پس خودت را اصلاح کن."], ["دستور", "«شکن» و «شکستن» هم‌خانواده‌اند. این بیت <b>ضرب‌المثل</b> شده است («آیینه را شکستن، عیب را نمی‌پوشاند»)."]]}, {"k": "verse", "lines": [{"n": "۱", "hem": ["جوانی، گهِ که کار و شایستگی است", "گهِ خودپسندی و پندار نیست"]}], "mean": [["معنی", "دوران جوانی، زمانِ کار و نشان دادن شایستگی و لیاقت است؛ زمانِ تکبر و خودخواهی و خیال‌پردازی نیست."], ["لغت", "گه: زمان (مخفف «گاه») / شایستگی: لیاقت / خودپسندی: غرور / پندار: خیال و وهم."], ["دستور", "«جوانی» و «شایستگی» مشتق‌اند."]]}, {"k": "verse", "lines": [{"n": "۲", "hem": ["چو بفروختی، از که خواهی خرید؟", "متاعِ جوانی به بازار نیست"]}], "mean": [["معنی", "(اگر سرمایهٔ جوانی را به بازی و غفلت فروختی و از دست دادی) از کسی دیگر نمی‌توانی آن را بخری؛ زیرا جوانی، کالایی نیست که در بازار به فروش برسد و دگربار به دست آید."], ["لغت", "متاع: کالا، جنسِ گران‌بها."], ["آرایه", "«متاع جوانی» اضافه تشبیهی؛ فروختن/خریدن/متاع/بازار: مراعات نظیر؛ «بازار»: استعاره از دنیا."], ["دستور", "«بفروختی» ماضی ساده (ساخت قدیم)؛ «که»: ض {"id":5,"icon":"🗺️","lnum":"درس پنجم","title":"درس آزاد — ادبیات بومی (۱)","info":"فصل آزاد | موضوع: ادبیات بومی، سُنّت و آداب محلی، ادبیات زبان مادری","intro":"درس ۵ کتاب فارسی نهم، «درس آزاد» فصل آزادِ «ادبیات بومی ۱» است (صفحات ۴۲ تا ۴۶ کتاب). صفحات این فصل در کتاب درسیِ سراسری <b>خالی</b> نگه داشته شده است، زیرا مطابق <b>اصل پانزدهم قانون اساسی</b>، این درس با مشارکت دانش‌آموزان و راهنمایی دبیران، بر پایهٔ <b>گنجینهٔ فرهنگی هر سرزمین و ادبیاتِ زبان مادریِ همان استان</b> تدوین می‌شود: متن درس، حکایت و شعرخوانیِ این فصل را اداره‌های کلّ آموزش و پرورشِ استان‌ها بر پایهٔ سُنّت و آداب بومی، قلمرو فرهنگ محلی، نیازهای نوجوانانِ همان منطقه و موضوع‌های ناگفتهٔ کتاب، تولید می‌کنند.","kholase":["درس ۵ کتاب فارسی نهم، «درس آزاد» فصل آزادِ «ادبیات بومی ۱» است (صفحات ۴۲ تا ۴۶ کتاب). صفحات این فصل در کتاب درسیِ سراسری <b>خالی</b> نگه داشته شده است، زیرا مطابق <b>اصل پانزدهم قانون اساسی</b>، این درس با مشارکت دانش‌آموزان و راهنمایی دبیران، بر پایهٔ <b>گنجینهٔ فرهنگی هر سرزمین و ادبیاتِ زبان مادریِ همان استان</b> تدوین می‌شود: متن درس، حکایت و شعرخوانیِ این فصل را اداره‌های کلّ آموزش و پرورشِ استان‌ها بر پایهٔ سُنّت و آداب بومی، قلمرو فرهنگ محلی، نیازهای نوجوانانِ همان منطقه و موضوع‌های ناگفتهٔ کتاب، تولید می‌کنند."],"payam":"","khanesh":"","blocks":[],"vocab":[],"notes3":[],"lit":[],"gram":[],"arts":{"intro": [], "tables": [], "notes": []},"wb":[],"notes7":[],"exam":["درس ۵ = درس آزادِ «ادبیات بومی ۱»؛ صفحات ۴۲–۴۶ کتاب سراسری خالی است.", "مبنای قانونی: اصل پانزدهم قانون اساسی (به رسمیت شناختن زبان‌ها و اقوام ایرانی در رسانه‌ها و آموزش ادبیاتِ زبان مادری).", "محتوا را استان‌ها می‌سازند: سُنّت و آداب بومی، فرهنگ محلی، ادبیات زبان مادری، نیازهای ویژهٔ نوجوانان آن سرزمین.", "ساختار فصل: درس آزاد + حکایت + شعرخوانی.", "نکتۀ امتحانی: از درس آزاد، در آزمون‌های سراسری متن ثابتی طرح نمی‌شود؛ اما بدانید که: ۱) این فصل برای تحقق اصل پانزدهم قانون اساسی (زبان‌ها و قومیت‌های ایرانی آزاد) است؛ ۲) ساختار آن مانند دیگر فصل‌هاست: «درس آزاد + حکایت + شعرخوانی»؛ ۳) محتوای آن باید با سنّت‌ها، ادبیات بومی و زبان مادری استان شما پیوند داشته باشد. برای امتحان مدرسه، از محتوایی که دبیر شما برای این فصل تدارک دیده است (متن، حکایت و شعرخوانی استان شما) مرور کنید."]},
{"id":6,"icon":"📜","lnum":"درس ششم","title":"آداب زندگی","info":"منبع: قابوس‌نامه (عنصرالمعالی کیکاووس) و اخلاق ناصری (خواجه نصیرالدین طوسی)","intro":"<b>پیام اصلی:</b> هنر و شایستگی از نژاد و ثروت مهم‌تر است؛ و زیستنِ نیکو، رعایت آداب گفتار (راستی، کم‌گویی، نیک‌گویی) و آداب رفتار (پرهیز از بدنشینی، انصاف، بردباری و دوراندیشی) است.","kholase":["درس ۶ دو متن کهن دربارهٔ <b>آداب معاشرت و زیستن</b> دارد. متن نخست از <b>قابوس‌نامه</b> است و به فرزند توصیه می‌کند: انسانِ بی‌هنر مانند خارشتر (مُغیلان) است که تن دارد و سایه ندارد؛ نه خود را سود می‌رساند و نه دیگران را. تلاش کن که افزون بر اصالت و نژاد نیکو، <b>گوهرِ هنر و شایستگیِ فردی</b> نیز داشته باشی؛ زیرا گوهرِ تن از گوهرِ اصل بهتر است و بزرگی انسان به خرد و دانش است نه به تخمه و نژاد. اگر کسی این دو گوهر را داشت، از دستش مگذار؛ او به کارِ همه می‌آید. سپس آداب گفتار و رفتار را می‌آموزد: سخنِ ناپرسیده مگو و از گفتار بیهوده بپرهیز؛ چون پرسیدند، جز راست مگو؛ تا نخواهند کسی را نصیحت مکن (به‌ویژه پندشنوَد را که خود گرفتار می‌شود)؛ در میان جمع کسی را تنبیه مکن؛ از جای تهمت‌زده و یارِ بداندیش و بدآموز بگریز؛ به غم مردم شادی مکن تا مردم نیز به غم تو شادی نکنند؛ <b>داد ده تا داد یابی؛ خوب گو تا خوب شنوی</b>؛ و اگر طالب علمی، پرهیزگار، قانع، علم‌دوست، بردبار، کم‌سخن و دوراندیش باش. متن دوم از <b>اخلاق ناصری</b>، آدابِ شنیدن سخنِ دیگران را می‌آموزد: سخن دیگران را تا پایان بشنو و در میان گفتارِ کسی، درنگ مکن؛ در گفت‌وگوی میان دو تنِ دیگر دخالت مکن؛ و اگر سخنِ کسی را نپسندی، با مدارا و بدون طعنه به آن بپرداز."],"payam":"<b>پیام اصلی:</b> هنر و شایستگی از نژاد و ثروت مهم‌تر است؛ و زیستنِ نیکو، رعایت آداب گفتار (راستی، کم‌گویی، نیک‌گویی) و آداب رفتار (پرهیز از بدنشینی، انصاف، بردباری و دوراندیشی) است.","khanesh":"","blocks":[{"k": "sub", "t": "متن اول — قابوس‌نامه (صفحهٔ ۴۸)"}, {"k": "prose", "t": "«بدان که مردمِ بی‌هنر، مادام بی‌سود باشد، چون مُغیلان که تن دارد و سایه ندارد؛ نه خود را سود کند و نه غیرِ خود را. جهد کن که اگرچه اصیل و گوهری باشی، گوهرِ تن نیز داری که گوهرِ تن از گوهرِ اصل بهتر بُوَد؛ چنان‌که گفته‌اند: بزرگی، خرد و دانش راست نه گوهر و تخمه را. اگر مردم را با گوهرِ اصل، گوهرِ هنر نباشد، صحبتِ هیچ‌کس را به کار نیاید و در هر که این دو گوهر یابی، چنگ در وی زن و از دست مگذار که وی همه را به کار آید.»", "mean": [["معنی", "بدان که انسانِ بی‌هنر همیشه بی‌فایده است؛ مانند خارشتر که تن (تنه) دارد اما سایه ندارد؛ نه به خود سود می‌رساند و نه به دیگران. بکوش که هرچند اصیل و نژاده (دارای گوهرِ اصل/نسب) هستی، <b>گوهرِ هنر و شایستگیِ شخصی</b> نیز داشته باشی؛ زیرا شایستگیِ فردی از نژاد و خانواده بهتر است؛ چنان‌که گفته‌اند بزرگیِ انسان به عقل و دانش اوست نه به نژاد و پدر و مادرش. اگر کسی با اصالتِ خانوادگی، هنر و توانایی نداشته باشد، همنشینی با او به درد هیچ‌کس نمی‌خورد؛ و هر کس را که این دو گوهر (اصالت + هنر) یافتی، بگیر و از دستش مده؛ زیرا او به کارِ همه می‌آید."], ["لغت", "مادام: همیشه / مغیلان: خارشتر، گیاه خاردار بی‌سایه (در باور قدما، جای دیوها!) / جهد کن: بکوش / اصیل: نژاده / گوهر تن: شایستگی و توانِ فردی / گوهر اصل: نژاد و خانواده / تخمه: نژاد و تبار / صحبت: همنشینی / چنگ در وی زن: به او چنگ زن، با او ارتباط برقرار کن."], ["آرایه", "تشبیه: مردمِ بی‌هنر به مُغیلان؛ «بزرگی، خرد و دانش راست» (حذف فعل اسنادی و کنایه از انتساب)."]]}, {"k": "prose", "t": "«سخنِ ناپرسیده مگوی و از گفتار خیره پرهیز کن. چون بپرسند، جز راست مگو. تا نخواهند، کس را نصیحت مگوی و پند مده؛ خاصه کسی را که پند نشنود که او خود اوفتد. در میان جمع، هیچ‌کس را پند مده. از جایِ تهمت‌زده پرهیز کن و از یارِ بداندیش و بدآموز بگریز. به غمِ مردمان شادی مکن تا مردمان نیز به غمِ توی شادی نکنند. داد ده تا داد یابی. خوب گوی تا خوب شنوی. اگر طالبِ علم باشی، پرهیزگار و قانع باش و علم‌دوست و بردبار و کم‌سخن و دوراندیش.»", "mean": [["معنی", "تا از تو نپرسیده‌اند سخن مگو و از گفت‌وگوی بیهوده بپرهیز؛ وقتی پرسیدند، جز راستی نگوی. تا از تو نخواسته‌اند، کسی را نصیحت نکن و پند نده؛ مخصوصاً آن که پند نمی‌شنود، که خودش گرفتار می‌شود. در میان جمع، کسی را سرزنش و تعریف نکن. از رفتن به جایی که به آنجا بدگمانی (تهمت) می‌زنند بپرهیز و از دوستِ بداندیش و بدآموز بگریز. به غمِ دیگران خوشحال مشو تا دیگران نیز در غمِ تو شادی نکنند. <b>انصاف را رعایت کن تا به انصاف برسی؛ سخن نیک بگو تا سخن نیک بشنوی.</b> اگر خواهانِ دانشی، پارسا و قانع باش و دوستدارِ علم و شکیبا و کم‌حرف و آینده‌نگر."], ["لغت", "خیره: بیهوده / خاصه: مخصوصاً / خود اوفتد: خودش گرفتار می‌شود / تهمت‌زده: مورد بدگمانی / داد: انصاف و حق / طالب: خواهنده / پرهیزگار: پارسا / قانع: به مقدار نصیب خود راضی / بردبار: شکیبا / دوراندیش: احتیاط‌کار و آینده‌نگر."], ["دستور", "«بازپرسند» فعل پیشوندی؛ «راست» صفت جانشین اسم (= سخنِ راست)؛ «تهمت‌زده» مشتق-مرکب؛ «بداندیش و بدآموز» صفت مرکب؛ «مده و مکن» فعل نهی؛ «علم‌دوست، بردبار، کم‌سخن و دوراندیش» مرکب؛ فعل اسنادی «باش» پس از «دوراندیش» به قرینهٔ لفظی حذف شده و همهٔ این واژه‌ها «مسند»‌اند."]]}, {"k": "sub", "t": "متن دوم — اخلاق ناصری (صفحهٔ ۴۹)"}, {"k": "prose", "t": "«آدمی باید که سخنِ دیگری را به سخن خود مقید(نکند) و درنگرد و آگاه باشد: اگر سؤالی از معیشت و زندگی کسی کند که او اهلِ آن معیشت بود، به آن درنگد؛ و اگر کسی به سخن (کار خود) مشغول شد، تا آن سخن تمام شود صبر کند و در میانِ گفتارش نرود؛ در گفت‌وگوهایی که میان دو کس رود دخالت نکند؛ و اگر سخنی از او (بد) شنیده شده باشد، (با استماعِ آرام) آن را بپذیرد تا او را با خود در آن گفتار مشارکت دهد و مداخلت نکند.» (به مضمون متن کتاب)", "mean": [["معنی و مفهوم", "آدمی باید آدابِ شنیدن بداند: سخنِ دیگران را با وقار و دقت گوش دهد و آن را به سخن خودش نیفکنَد؛ اگر از کسی دربارهٔ کار و زندگی‌اش پرسید که او بدان داناست، درنگی برای پرسش و پاسخ بگذارد؛ اگر کسی مشغولِ سخن گفتن است، صبر کند تا سخنش تمام شود و در میانِ گفتارش وارد نشود؛ در گفت‌وگویی که میان دو نفر در جریان است، دخالت نکند؛ و اگر سخنِ ناخوشایندی از کسی شنیده است، با آرامش و مدارا برخورد کند و بی‌مورد با طعنه، آن را به روی او نیاورد."], ["لغت", "محاورات: گفت‌وگوها / مداخلت: داخل شدن در کار دیگران / استماع: گوش سپردن / تهمت: بدگمانی و نسبت ناروا."]]}, {"k": "sub", "t": "حکایت «شو، خطر کن!» — چهار مقاله، نظامی عروضی"}, {"k": "prose", "t": "امیرِ خراسان را پرسیدند که تو فردی فقیر و بی‌چیز بودی و شغلی پست داشتی؛ به امیریِ خراسان چون افتادی؟ گفت: روزی دیوان «حَنظله بادغیسی» همی‌خواندم؛ بدین دو بیت رسیدم: شو، خطر کن ز کامِ شیر {"id":8,"icon":"🇮🇷","lnum":"درس هشتم","title":"همزیستی با مامِ میهن","info":"نویسنده: فریدون اکبری شلدره | موضوع: وحدت، همدلی و اقوام ایرانی | لحن خوانش: میهنی","intro":"<b>پیام اصلی:</b> میهن، مادرِ همهٔ ماست؛ با همهٔ رنگ‌ها و زبان‌ها و اقوام، یک خانواده‌ایم: هم‌صدا، هم‌پیمان و هم‌دل؛ باید مثل فرزندانِ شایسته، در رفاه و سختی با او و با یکدیگر هم‌زیستی و همدلی کنیم و ایران را گرامی بداریم.","kholase":["نویسنده در این درسِ میهنی، <b>ایران را به مادر</b> تشبیه می‌کند: مادران، دل به مهرِ فرزندان گرم و تپنده دارند و فرزندان در دامانِ مادر، جان می‌گیرند و می‌پرورند؛ خوشی و ناخوشیِ هر یکی از فرزندان، به دیگری پیوند می‌خورد. مادر نیز گوهری گرامی است که در کارگاهِ آفرینش، همتیافتهٔ مهر و محبت است؛ اگر مادر را گرامی نداریم و از راهِ هم‌دوری او را به خشم آوریم، برکت و رحمتِ او می‌رود و در خانه چیزی جز کدورت نمی‌ماند. تعبیر «مامِ میهن» از همین دوستی‌های دل است: اگر میهن را در پرورش و رفاهِ عمومی، مادر بدانیم و نسبت به او هم‌دل و خوش‌رفتار باشیم، میهن با همهٔ فرزندانش، مانند مادری مهربان، رفتارِ محبت‌آمیز می‌کند.", "سپس نویسنده دربارهٔ <b>تنوع اقوام ایران</b> سخن می‌گوید: اگرچه رنگ و نژاد و لهجه‌های گوناگونی در ایران هست (گل‌های رنگارنگ باغِ ایران: ترک، فارس، لر، عرب، ترکمن، بلوچ، کرد، ارمنی، آشوری و...)، اما همهٔ این اقوام در منطق و مغز و رگ و ریشه‌ی یکدیگرند؛ همه در زیبایی، هم‌صدا و هم‌پیمان‌اند و این تنوع، زیبایی و شورِ فراوان می‌آفریند. انگشت‌به‌دهان گذاشتن (تعجب) از این هم‌زیستی جای شگفتی دارد؛ در دفاع مقدس، همه برای وطن تن را سپر کردند؛ آوارگان و مجروحان، مهرِ هم‌دلی و هم‌وطنی را از یاد نبردند؛ و در آستانهٔ پیروزی، تنِ این مادرِ میهنِ آزرده، در آغوشِ عزیزترین فرزندانش آرام گرفت. در پایان، به سخنان رهبر انقلاب (از کتاب «مسیح در شب قدر»، روایتِ حضور ایشان در منازل شهیدان ارمنی و آشوری) اشاره می‌شود: «ما در ایران، عربِ ایران، ترکِ ایران، ترکمنِ ایران، فارسِ ایران، لرِ ایران، بلوچِ ایران، کردِ ایران، آشوری و ارمنی و... همهٔ ما ایرانی‌ایم؛ ایرانِ همهٔ ما به هر رنگ و نژادی که در این سرزمین پدید آمده است... جمهوری اسلامی متعلق به همه است و مال همه است.»"],"payam":"<b>پیام اصلی:</b> میهن، مادرِ همهٔ ماست؛ با همهٔ رنگ‌ها و زبان‌ها و اقوام، یک خانواده‌ایم: هم‌صدا، هم‌پیمان و هم‌دل؛ باید مثل فرزندانِ شایسته، در رفاه و سختی با او و با یکدیگر هم‌زیستی و همدلی کنیم و ایران را گرامی بداریم.","khanesh":"<b>نکتۀ خوانش (از کتاب):</b> لحن میهنی گونه‌ای از لحن خوانش متن است که در آن، خواننده می‌کوشد با شور و حرارتی برانگیزاننده، غیرت ملی و حس همدلی را بیدار سازد و با بهره‌گیری از عاطفه و حس حال مناسب، شنونده را به احترام و دوستی میهن فراخواند.","blocks":[{"k": "sub", "t": "عبارت‌های کلیدی متن و معنی آنها"}, {"k": "prose", "t": "«مادران، دل به مهرِ فرزندان، گرم و تپنده می‌دارند و فرزندان در دامانِ مادر، جان می‌گیرند و می‌پرورند؛ این دو را بی‌وفایی‌ها و آفت‌ها به سرچشمه‌های یکتای یافتنی می‌رساند و خوشی و ناخوشیِ یکی را به دیگری پیوند می‌زند.»", "mean": [["معنی", "میان مادر و فرزندان پیوندی زنده و دوسویه است: مادر با محبت، فرزندان را زنده و بالنده می‌کند و فرزندان نیز دلِ مادر را گرم می‌سازند؛ آفت‌ها و بی‌وفایی‌ها این پیوند را به ستیز می‌کشاند و شادی و ناشادیِ هر یک، بر دیگری اثر می‌گذارد."], ["دوسویه بودن رابطهٔ مادر و فرزند", "هم مادر به فرزند مهر می‌ورزد و هم فرزند باید مادر را گرامی دارد و مایهٔ گرمیِ دل او شود."]]}, {"k": "prose", "t": "«مادر، گوهری گرامی است که در کارگاهِ آفرینش، همتیافتهٔ مهر است؛ اگر مادر را گرامی بداری و از راهِ هم‌دوری، مایهٔ گرمیِ دلِ او شوی، به مام (مادر) خود مفتخر... و اگر مایهٔ دلسردیِ او شوی، مهرِ او از تو می‌رود. همین دید، دربارهٔ میهن نیز درست است: اگر همه، میهن را در پرورش و رفاه، مادر بدانند و نسبت به او هم‌دل و خوش‌رفتار باشند، میهن نیز با همهٔ فرزندانش مانند مادری مهربان رفتار می‌کند.» (به مضمون متن کتاب)", "mean": [["معنی (به مضمون)", "اگر مادر را ارجمند بدانیم و با محبت و خوش‌رفتاری، مایهٔ گرمیِ او شویم، مادر نیز دلسوزانه به فریاد فرزندان می‌آید؛ اما اگر مایهٔ آزار و دلسردیِ او شویم، مهرِ او از ما می‌رود. همین نگاه، دربارهٔ میهن هم درست است: میهن، مادرِ همهٔ فرزندان (مردم) است؛ اگر همهٔ اقوام، به او هم‌دل و خوش‌رفتار باشند، میهن نیز مادری مهربان و بهره‌مند برای همه خواهد بود."]]}, {"k": "prose", "t": "«اگرچه در لهجه‌ها و زبان‌ها و رنگ‌ها تنوع و گوناگونی هست، همه در منطق و مغز و رگ و ریشهٔ یکدیگرند؛ همه در زیبایی، هم‌صدا و هم‌پیمان‌اند و در آشوب، بی‌قرار و غمگین؛ گل‌های رنگارنگِ باغِ ایران، زیبایی و شورِ فراوان می‌آفرینند.»", "mean": [["معنی", "تنوعِ اقوام و زبان‌ها و رنگ‌ها در ایران، نه سبب جدایی که سبب زیبایی و پویایی است؛ مانند گل‌های رنگارنگِ یک باغ که هرچه رنگ‌ها گوناگون‌تر، باغ شورانگیزتر؛ همهٔ قومیت‌ها در سرزمین ایران، هم‌ریشه و هم‌سرنوشت‌اند: در شادی هم‌صدا و در سختی هم‌دردند."]]}, {"k": "prose", "t": "«در همین دورانِ دفاع مقدس، ایرانیانِ همهٔ رنگ و نژاد، برای وطن، تن را سپر کردند؛ در سنگرها دلاورانه جنگیدند؛ در دشواری‌ها، مردمِ شهرهای مختلف با دعا و کمک، هم‌صدا و هم‌دل بودند؛ همه با هم، در راهِ شکستِ دشمن گام برداشتند و در آستانهٔ پیروزی، تنِ این مادرِ میهنِ آزرده، در آغوشِ عزیزترین فرزندانش (شهیدان و رزمندگان) آرام و قرار گرفت.» (به مضمون متن کتاب)", "mean": [["معنی (به مضمون)", "در دوران دفاع مقدس، ایرانیان با هر رنگ و قومی، برای حفظِ میهن فداکاری کردند و تنِ خود را سپرِ وطش ساختند؛ مردم در جاهای گوناگونِ کشور، هم‌صدا برای میهن دعا می‌کردند و دست‌به‌دستِ یکدیگر، دل‌ها را مهرِ میهن گره می‌زدند و در آستانهٔ پیروزی، این مادرِ میهنِ رنج‌کشیده، در آغوشِ فرزندانِ فداکارش آرامش یافت."], ["کنایه‌های مهم", "«تن را سپر کردن» = فداکاری و جان‌بازی؛ «انگشت به دهان گذاشتن» = تعجب و شگفتی."]]}, {"k": "prose", "t": "«ایرانِ ما به گلستانی می‌ماند که در دل و دامانِ خود، عزیزکانی را می‌پروراند و شیرهٔ جانِ خویش را در کامشان می‌دارد.» (از خودآزمایی درس)", "mean": [["معنی", "ایران مانند باغی است که فرزندانِ عزیزش را در دامان خود بزرگ می‌کند و شیرین‌ترین برکت‌ها (شیرهٔ جان) را به کامِ آنها می‌چشاند؛ یعنی میهن، هم‌زمانِ پرورنده و شیرین‌بخشِ همهٔ فرزندانش است."]]}, {"k": "sub", "t": "شعرخوانی «دوراندیشی» — مخزن‌الاسرار، نظامی گنجه‌ای"}, {"k": "p", "t": "این مثنوی داستان آموزنده‌ای دربارهٔ <b>عاقبت‌اندیشی و آینده‌نگری</b> است: کودکی از خانوادهٔ آزادگان با دو سه هم‌سالِ خود برای بازی بیرون می‌رود؛ آن‌قدر می‌دود تا مهرهٔ (بازیچهٔ) پشتش می‌شکند. دوستانش (که دوراندیشی ندارند) می‌گویند رازِ این ماجرا را در چاهی پنهان کنیم تا پدرمزدهایمان شرمنده نشوند؛ اما عاقبت‌اندیش‌ترینِ آنها (که حتی دشمنِ او در میانشان بود) می‌گوید: «این راز، پنهان نمی‌ماند؛ روزی آشکار می‌شود و تهمتش بر من می‌افتد؛ پس از همان حالا خودم به پدرم خبر می‌دهم تا او چاره‌ای بیندیشد.» او نزد پدر رفت و خبر داد و پدر، چارهٔ کار را کرد. (و در ادامهٔ داستان که در مخزن‌الاسرار آمده:) هر که جوهرِ دانایی دارد، بر همه چیز توانایی است؛ و «بندِ فلک را کس تواند گشاد؟ آنکه بر او پایت تواند نهاد»."}, {"k": "verse", "lines": [{"n": "۱", "hem": ["کودکی از جملهٔ آزادگان", "رفت برون با دو سه همزادگان"]}, {"n": "۲", "hem": ["پای چو در راه نهاد آن پسر", "پویه همی‌کرد و درآمد به سِر"]}, {"n": "۳", "hem": ["پایش ازان پویه درآمد ز دست", "مهرِ دل و مهرهٔ پشتش شکست"]}, {"n": "۴", "hem": ["شد نفسِ آن دو سه همسالِ او", "تنگ‌تر از حادثه حالِ او"]}, {"n": "۵", "hem": ["آنکه ورا دوست‌ترین بود گفت", "در بنِ چاهیش بباید نهفت"]}, {"n": "۶", "hem": ["تا نشود راز چو روز آشکار", "تا نشویم از پدرش شرمسار"]}, {"n": "۷", "hem": ["عاقبت‌اندیش‌ترین کودکی", "دشمنِ او بود در ایشان یکی"]}, {"n": "۸", "hem": ["گفت همانا که در این همرهان", "صورتِ این حال نماند نهان"]}, {"n": "۹", "hem": ["چون‌که مرا زین همه دشمن نهند", "تهمتِ این واقعه بر من نهند"]}, {"n": "۱۰", "hem": ["زی پدرش رفت و خبردار کرد", "تا پدرش چارهٔ آن کار کرد"]}, {"n": "۱۱", "hem": ["هرکه درو جوهرِ دانائیست", "بر همه چیزیش توانائیست"]}, {"n": "۱۲", "hem": ["بندِ فلک را که تواند گشاد؟", "آنکه بر او پایت تواند نهاد"]}], "mean": [["معنی خلاصه", "۱) کودکی آزاده با چند هم‌سن برای بازی از خانه بیرون رفت. ۲) چون در راه می‌دوید، به سرعتِ تمام پیش می‌رفت. ۳) از این دویدن، پای و مهرهٔ پشتش بی‌جا رفت و دل و مهره‌اش شکست (مهره: بازیچهٔ پشت؛ «مهر دل و مهرهٔ پشتش شکست» = هم داغ دل دید و هم بازیچه‌اش شکست). ۴) نفسِ دوستانش از حادثه، تنگ‌تر از خودِ او شد. ۵–۶) دوست‌ترینشان گفت: باید این راز را در چاهی پنهان کرد تا آشکار نشود و شرمندهٔ پدرش نباشیم. ۷–۹) اما عاقبت‌اندیش‌ترین آنها (که اتفاقاً دشمنِ او در میانشان بود) گفت: این حالت پنهان نمی‌ماند؛ از منِ بی‌دوست را دشمن می‌شمارند و تهمتش را بر ین»، «لیلی و مجنون»، «هفت‌پیکر» و «اسکندرنامه»."}],"gram":[{"h": "", "body": ["به بیت و جملهٔ زیر دقت کنید: «همی‌خواهم از کردگارِ جهان / شناسندهٔ آشکار و نهان» (فردوسی) — «خوشی و ناخوشی یکی را به دیگری پیوند می‌زند.» در بیت و عبارت بالا به ترتیب واژه‌های «آشکار و نهان» و «خوشی و ناخوشی» به کار رفته است؛ این واژه‌ها با هم «<b>متضاد</b>» هستند: هرگاه دو یا چند واژه از نظر معنایی در تضاد باشند، به آنها واژه‌های «متضاد» می‌گویند. تضاد یک عنصر <b>معنایی</b> است و نوع رابطهٔ دو واژه از این دید، رابطهٔ <b>معنوی</b> خوانده می‌شود. بهره‌گیری از این ویژگی، سبب گسترش دامنهٔ معنا و جذابیت فضای معناییِ سخن می‌شود."], "tables": [], "notes": ["<b>یادآوری:</b> «ترادف» (هم‌معنایی) نیز رابطهٔ معنوی است: واژه‌های هم‌معنا مانند «فراست و زیرکی» (در تمرین درس ۹)."]}],"arts":{"intro": [], "tables": [{"head": ["آرایه", "نمونه از درس ۸", "توضیح"], "rows": [["تشبیه", "«میهن مانند مادر» / «ایرانِ ما به گلستانی می‌ماند که عزیزکانی را می‌پروراند»", "میهن به مادر و گلستان تشبیه شده است"], ["جان‌بخشی", "«میهن با همهٔ فرزندانش، مادرانه رفتار می‌کند» / «تنِ این مادرِ میهن آزرده آرام گرفت»", "به میهن، رفتار و احساسِ انسانی نسبت داده شده"], ["کنایه", "«تن را سپر کردن» = فداکاری / «انگشت به دهان گذاشتن» = تعجب", "معنای غیرمستقیم"], ["مراعات نظیر", "«لهجه‌ها و زبان‌ها و رنگ‌ها» / «ترک، فارس، لر، عرب...»", "واژه‌های هم‌مجموعه (قومیت‌ها)"], ["تشبیه و استعاره (شعرخوانی)", "«مهرِ دل و مهرهٔ پشتش شکست» / «بندِ فلک»", "فلک به بند و گره تشبیه شده؛ شکستنِ مهرِ دل، جان‌بخشی"], ["تضاد", "«آشکار و نهان» (بیت فردوسیِ دانش‌زبانی) / «آرامش و آشوب»", "واژه‌های متقابل"]]}], "notes": []},"wb":[{"g": "خود را بیازمایید (صفحهٔ ۶۲)", "n": "۱", "q": "چرا میهن را به مادر تشبیه می‌کنند؟", "a": ["زیرا میان میهن و شهروندان، رابطه‌ای مانند مادر و فرزندان برقرار است: میهن مانند مادر، فرزندانِ خود (مردم) را در دامان خود پرور می‌دهد، و در رفاه و سختی با آنها هم‌دل است؛ همچنان که فرزندان نیز باید مهرِ مادر را پاس بدارند، مردم نیز باید به میهنِ خود عشق بورزند، او را گرامی بدارند و در حفظ و آبادانی‌اش بکوشند؛ خوشی و ناخوشیِ فرزندانِ میهن نیز مانند خانواده به همه سرایت می‌کند و همه در سرنوشتِ یکدیگر شریک‌اند."]}, {"g": "خود را بیازمایید (صفحهٔ ۶۲)", "n": "۲", "q": "به نظر شما منظور از دو سویه بودن رابطهٔ مادر و فرزند چیست؟", "a": ["یعنی این رابطه، از هر دو سو برقرار است: هم مادر به فرزندان مهر می‌ورزد، آنها را می‌پرورد و در سختی‌ها یاورشان است؛ و هم فرزندان باید مادر را گرامی بدارند، مایهٔ گرمیِ دلِ او شوند و از او یاد کنند؛ اگر یک سوی رابطه (مهرِ فرزندان یا مهرِ مادر) از میان برود، پیوندِ خانواده آسیب می‌بیند. همین اصل دربارهٔ میهن و مردم نیز صادق است."]}, {"g": "خود را بیازمایید (صفحهٔ ۶۲)", "n": "۳", "q": "یک جامعهٔ همدل چه ویژگی‌هایی دارد؟", "a": ["اعضایش با وجود تفاوت‌های قومی و زبانی و رنگی، هم‌صدا و هم‌پیمان‌اند؛ در شادی و سختیِ یکدیگر شریک‌اند؛ برای خیرِ عمومی فداکاری می‌کنند (مانند دفاع مقدس)؛ به جای جدایی و تفرقه، از تنوعِ اقوام به‌عنوان زیبایی و سرمایه استفاده می‌کنند؛ در برابرِ آفا و دشمنان، متحد و یکدل‌اند و رنجِ هر عضو، رنجِ همه است."]}, {"g": "خود را بیازمایید (صفحهٔ ۶۲)", "n": "۴", "q": "..........................................", "a": ["به نظر من، راهِ هم‌دلی بیشتر، شناخت فرهنگ و زبان و آداب اقوام هم‌وطن، تربیت خانوادگیِ محبت‌محور و مشارکت همه در کارهای اجتماعی و خیریه است؛ گنجینهٔ مشترک ایران ما، همه رنگ‌های این باغ است."], "ansKind": "پاسخ نمونه"}, {"g": "گفت‌وگو (صفحهٔ ۶۳)", "n": "۱", "q": "شعری با محتوای همدلی و اتحاد انتخاب کنید و دربارهٔ آن، گفت‌وگو کنید.", "a": ["نمونه: بیت سعدی «بنی‌آدم اعضای یک پیکرند / که در آفرینش ز یک گوهرند» — همه آدمیان و به‌ویژه هم‌وطنان، اعضای یک بدن‌اند: دردِ یک عضو، دیگر اعضا را بی‌قرار می‌کند؛ پس همدلی و همراهی، فطرت انسان و نیاز جامعهٔ سالم است."], "ansKind": "پاسخ نمونه"}, {"g": "گفت‌وگو (صفحهٔ ۶۳)", "n": "۲", "q": "نمونه‌هایی از همزیستی و همدلی اقوام ایرانی را در کلاس مطرح کنید.", "a": ["نمونه‌ها: همراهی همهٔ اقوام در دفاع مقدس (ترک و فارس و لر و عرب و بلوچ و کرد و ... در یک سنگر)؛ کمک‌رسانی مردمی در سیل و زلزله (مانند زلزلهٔ کرمانشاه و سیل‌های اخیر)؛ هم‌نشینی و همسایگی صلح‌آمیز پیروان ادیان و اقوام در تهران، ارومیه، اهواز و...؛ و کمک آشوری‌ها و ارمنی‌ها در کنار سایر ایرانیان در جنگ تحمیلی (که در همین درس، روایتِ مالقات رهبری با خانواده‌های شهیدان ارمنی و آشوری آمده است)."], "ansKind": "پاسخ نمونه"}, {"g": "خودآزمایی (صفحهٔ ۶۳)", "n": "۱", "q": "ده واژهٔ مهم املایی از متن درس بیابید و بنویسید.", "a": ["نمونه: میهن، مادران، تپنده، فرزندان، هم‌زیستی، هم‌دلی، دفاع مقدس، سپر، گوناگونی، رنگارنگ (نیز: جمهوری، اسلامی، آشوری، ارمنی، ترکمن، بلوچ، شرمنده، پیروزی)."]}, {"g": "خودآزمایی (صفحهٔ ۶۳)", "n": "۲", "q": "در گروه‌های اسمی مشخص‌شده، هسته، وابسته و نوع آنها را بنویسید: الف) فرزندان در پرتوِ گرم و گوارای مادر، جان می‌گیرند. — ب) در همین دوران دفاع مقدس، ایرانیان همه برای وطن، تن را سپر کرده‌اند.", "a": ["الف) «فرزندان»: هسته= فرزندان، بدون وابسته (هستهٔ جمع). «پرتوِ گرم و گوارای مادر»: هسته= پرتو؛ وابستهٔ پسین= «گرم و گوارا» (صفت) و «مادر» (اضافه؛ گروه اسمی وابسته). ب) «همین دوران دفاع مقدس»: هسته= دوران؛ وابستهٔ پیشین= «همین» (اشاره)؛ وابستهٔ پسین= «دفاع مقدس» (اضافه + صفت) — «تن»: هسته= تن (بی‌وابسته)؛ «وطن»: هسته= وطن (بی‌وابسته در ساخت «برای وطن»)."]}, {"g": "خودآزمایی (صفحهٔ ۶۳)", "n": "۳", "q": "پیام عبارت زیر را بنویسید: «ایرانِ ما به گلستانی می‌ماند که در دل و دامانِ خود، عزیزکانی را می‌پروراند و شیرهٔ جانِ خویش را در کامشان می‌دارد.»", "a": ["پیام: ایران چون باغی زیباست (و مادری مهربان) که همهٔ فرزندانش (مردم با هر قوم و رنگ و زبان) را در دامان خود بزرگ می‌کند و بهترینِ برکت‌ها و موهبت‌هایش را به کامِ آنها می‌چشاند؛ پس همهٔ ما موظفیم پاسدارِ این مامِ مهربان باشیم و هم‌دلی و هم‌زیستی را پاس بداریم."]}, {"g": "خودآزمایی (صفحهٔ ۶۳)", "n": "۴", "q": "جمله و بیت‌های زیر را از نظر رابطهٔ تضادِ معناییِ واژه‌ها بررسی کنید و نتیجه را بنویسید: ـ تا کی آخر چو بنفشه، سرِ غفلت در پیش؟ / حیف باشد که تو در خوابی و نرگس، بیدار (سعدی) ـ گر تکبّر می‌کنی، با خواجگانِ سفله کن / ور تواضع می‌کنی، با مردمِ درویش کن (شمس‌الدین محمد جوینی) ـ به نزدِ مِهان و به نزدِ کِهان / به آزارِ موری، نیرزد جهان (فردوسی) ـ ... با آرامشِ آن آرمیده‌اند و در آشوبش بی‌قراری کرده‌اند.", "a": ["در همهٔ این جمله‌ها، واژه‌های متضاد به کار رفته و هر بار، تضاد، معنا را عمیق‌تر و گویاتر کرده است: ـ بیت سعدی: «خواب و بیدار» (و «غفلت و بیداری») — تضاد، حالتِ انسانِ غافل را در برابر گلِ بیدار برجسته می‌کند و بر شایستگیِ بیداری تأکید می‌آورد. ـ بیت جوینی: «تکبّر و تواضع» و «خاجه (بزرگ) و سفله (پست)» و «مردم و درویش» — تضادها درسِ اخلاقیِ بیت را گویا می‌کند: با بزرگ‌مانانِ پست‌شده فروتنی نکن و با مردمِ درویش، متواضع باش. ـ بیت فردوسی: «مهان و کهان» (بزرگان و خردسالان) — تضاد، مفهومِ «هیچ‌کس» را تقویت می‌کند: آزارِ حتی یک مورچه بر هیچ انسانی (چه بزرگ چه کوچک) روا نیست. ـ جملهٔ آخر: «آرامش و آشوب» و «آرمیدن و بی‌قراری» — تضاد نشان می‌دهد آرامش، خودِ آشوب را می‌آراماند (حسِ تضاد، معنای تأثیر آرامش را قوی‌تر می‌کند)."]}],"notes7":[],"exam":["درس ۸: «همزیستی با مامِ میهن» از <b>فریدون اکبری شلدره</b> (معاصر)؛ موضوع: میهن=مادر، وحدت اقوام ایرانی، دفاع مقدس؛ لحنِ خوانش: میهنی (شور و غیرت ملی).", "تشبیه‌های کلیدی: میهن به مادر؛ ایران به گلستان (که عزیزکان را می‌پروراند)؛ اقوام به گل‌های رنگارنگِ یک باغ.", "کنایه‌ها: «تن را سپر کردن»=فداکاری؛ «انگشت به دهان گذاشتن»=تعجب.", "نقل‌قول رهبری (از «مسیح در شب قدر»): «ما در ایران، عرب و ترک و ترکمن و فارس و لر و بلوچ و کرد و آشوری و ارمنیِ ایران... همهٔ ما ایرانی‌ایم؛ ایران همهٔ ما به هر رنگ و نژادی که در این سرزمین پدید آمده است؛ جمهوری اسلامی متعلق به همه است.»", "دستور درس: <b>تضاد</b> (واژه‌های متقابل مانند آشکار/نهان، خوشی/ناخوشی) — عنصر معنایی و رابطهٔ معنوی.", "شعرخوانی «دوراندیشی» از <b>مخزن‌الاسرار نظامی</b> (مثنوی، خمسه): داستان کودکِ آزاده و مهرهٔ شکسته؛ درسِ عاقبت‌اندیشی: رازِ گرفتاری را پنهان نکن، از اهلِ تجربه چاره جُست؛ «هر که درو جوهر دانائیست / بر همه چیزیش توانائیست»."]},
{"id":9,"icon":"🔬","lnum":"درس نهم","title":"راز موفّقیت","info":"موضوع: کودکی خواجه نصیرالدین طوسی و دانشجوییِ ابوریحان بیرونی | درس: عشق به علم و آموختن","intro":"<b>پیام اصلی:</b> رازِ موفقیت، عشق به آموختن، تفکر و پشتکار است: دانش‌آموزِ موفق، آموخته‌هایش را با گفت‌وگو و تأملِ شبانه (تفکر در جهان و آسمان) تثبیت می‌کند و دانشِ راستین، چنان در جان جا می‌گیرد که حتی مرگ بر آن نمی‌تواند بیفزاید؛ و علم‌آموزی، سفارش پیامبر (ص) است: از گهواره تا گور.","kholase":["درس ۹ داستانِ <b>دو دانشمند بزرگ ایران</b> است. بخش نخست، از کودکیِ <b>خواجه نصیرالدین طوسی</b> در شهر توس می‌گوید: کودکانِ دیگر روزانه چند ساعتی به بازی و شادی می‌گذراندند، اما نصیرالدین هر روز لوح و کتاب زیر بغل، خود را به حضور درس استاد می‌رساند؛ بازیِ او مطالعه و بحث و مناظره با شاگردان بود. او مسئله‌های دانش‌آموزان را حل می‌کرد و دربارهٔ بهار و شگفتی‌های آن تأمل می‌کرد؛ در کوچک‌کلاسی‌اش پرسش‌های تیز و بزرگ می‌پرسید و در درس استاد حاسب چنان پیش می‌رفت که شاگردان دیگر را با خود همراه می‌کرد. روزها می‌گذشت و هر روز بر دانش او افزون می‌شد؛ اما هرچه بیشتر می‌آموخت، <b>عطش و اشتیاقش به دانستن نیز بیشتر می‌شد</b> (مانند تشنه‌ای که هرچه آب نوشد، تشنگی‌اش دوچندان شود!). همه او را می‌شناختند و هم‌درس‌ها به هوش و فراست و زیرکی‌اش اذعان داشتند؛ درسی که دیگران در یک سال می‌آموختند، او در یک ماه فرا می‌گرفت.", "یکی از شاگردانِ بزرگ‌تر (که دوازده سال از او بزرگ‌تر بود) به او لقب «<b>کوه آهن</b>» داده بود و وقتی نصیرالدین علت را پرسید، گفت: «تو مانند آهن، سنگینیِ درس را بی‌خستگی تحمل می‌کنی و بی‌قراریِ من را نداری؛ من با این سن، درسِ روز را در محضرِ استاد حاسب و درسِ دیگر را در محضرِ استاد منجّم می‌گیرم و در چنین روزی خسته می‌شوم.» نصیرالدین پاسخ داد: رازِ من این است که هر روز آنچه فرا گرفته‌ام را با هم‌درس‌هایم بحث می‌کنم و شب‌ها، آن‌گاه که شهر توس در آرامش فرورفته و همه خوابیده‌اند، ساعاتی به آسمان، ستاره‌های درخشان و ماهِ سیمگون می‌نگرم و اندیشه و خیال می‌بافم؛ زیرا می‌خواهم بدانم این‌ها چه هستند و در این فضای بی‌کران چه پنهان است؛ من از تماشای ماه و ستارگان، درسِ تفکر در آسمان‌ها گرفته‌ام. شاگرد در شگفت شد و پرسید: «ر es": ["<b>نکته:</b> در ماضی ساده، برای مفردِ متکلم و مخاطب در زبان فارسی معیار، شناسه به فعل نمی‌چسبد: شنیدم، شنیدی (مفرد) — شنید، شنیدیم، شنیدید، شنیدند."]}, {"h": "۲) فعل گذشتهٔ نقلی", "body": ["به جمله‌ها دقت کنید: «دوستانم در مدرسه مانده‌اند.» / «پرنده‌ها از سرِ شاخه‌ها پریده‌اند.» فعل‌های «مانده‌اند و پریده‌اند» گذشتهٔ نقلی‌اند: به فعلی که در گذشته انجام گرفته و <b>اثر آن تاکنون باقی است</b>، «گذشتهٔ نقلی» می‌گویند و این‌گونه ساخته می‌شود:"], "tables": [{"head": ["فعل گذشتهٔ نقلی = بن گذشته + هـ + (اَم، اَی، است، اِیم، اِید، اَند)"], "rows": [["مفرد: ساخت + هـ + اَم / اَی / است", "جمع: ساخت + هـ + اِیم / اِید / اَند"]]}], "notes": []}],"arts":{"intro": [], "tables": [{"head": ["آرایه", "نمونه از درس ۹", "توضیح"], "rows": [["تشبیه", "«عطش و اشتیاقِ او به دانستن، مانند تشنه‌ای که ... به آب می‌رسد» / لقبِ «کوه آهن»", "اشتیاق به علم به تشنگی؛ استواریِ نصیر به کوهِ آهن تشبیه شده است"], ["جان‌بخشی", "«هر روز درختِ وجودِ نصیرالدین پربارتر می‌شد» (تمرین)", "وجودِ انسان به درختِ بارآور جان‌دار تشبیه/جاندار شده است"], ["مراعات نظیر", "«ماه و ستارگان و آسمان» / «لوح و کتاب»", "واژه‌های هم‌مجموعه"], ["تلمیح", "حدیث «اُطلُبُوا العِلمَ مِن المَهدِ اِلی اللَّحد»", "اشاره به حدیث پیامبر (ص)"], ["پرسش (استفهام)", "«کدام یک از این دو کار بهتر است: بدانم و بمیرم یا ندانم و زنده بمانم؟»", "پرسشِ ابوریحان؛ انتخاب میان علم و زندگی (تقابلِ مفهومی)"], ["تضاد و ترادف", "دانا/جاهل، بلندآوازه/گمنام (تضاد)؛ فراست/زیرکی، بحث/گفت‌وگو (ترادف)", "روابط معنوی واژه‌ها (تمرین ۱ درس)"]]}], "notes": []},"wb":[{"g": "خود را بیازمایید (صفحهٔ ۷۱)", "n": "۱", "q": "چرا هم‌کلاسیِ خواجه نصیر به او لقب «کوه آهن» داد؟", "a": ["زیرا نصیرالدین در برابرِ سنگینیِ درس و سختی‌های علم‌آموزی، مانند کوهِ آهن، استوار و بی‌لرزان و خسته‌ناپذیر بود: شوقِ او به علم چنان بود که هرچه بیشتر می‌آموخت، اشتیاقش بیشتر می‌شد؛ در درس، بی‌قراری و بی‌حوصلگیِ شاگردانِ بزرگ‌تر را نداشت؛ آنچه را در محضرِ یک استاد می‌آموخت، در محضرِ استاد دیگر (که هم‌زمان می‌گرفت) با هم بحث می‌کرد و شب‌ها با تماشای ستارگان و تفکر، ذهنش را نیرومند می‌ ونه است؛ و شب‌ها که دیگران خوابند، به آسمان و ستارگان می‌نگرم و در راز هستی می‌اندیشم؛ این تفکر، معلمِ دوم من است و خستگی را از تنم می‌راند»."], "ansKind": "پاسخ نمونه"}, {"g": "فعالیت‌های نوشتاری (صفحهٔ ۷۲)", "n": "۲", "q": "داستان ابوریحان بیرونی را به صورت نمایش در کلاس اجرا کنید.", "a": ["پیشنهاد اجرا: دو نفر (یکی ابوریحانِ بیمار در بستر و دیگری همسایهٔ حسود) + راوی. راوی حالِ بیمار هفتادوهشت‌ساله را توصیف می‌کند؛ همسایه با بهانهٔ پرسش علمی، مسئله‌ای می‌پرسد؛ ابوریحان با تأمل پاسخ می‌دهد و می‌پرسد: «دانستم و مرگ بهتر است یا ندانستم و زندگی؟»؛ مرِدِ عالم‌کوش شرمنده و پشیمان می‌شود و می‌رود؛ ابوریحان خندان و آرام چشم می‌بندد؛ راوی درسِ داستان را می‌گوید: «علم، مایهٔ حیاتِ جاودان جان است»."], "ansKind": "پاسخ نمونه"}, {"g": "خودآزمایی (صفحهٔ ۷۳)", "n": "۱", "q": "نوع رابطهٔ معنایی (ترادف، تضاد) واژه‌های زیر را مشخص کنید: جاهل و دانا — فراست و زیرکی — فروزان و بی‌فروغ — بلندآوازه و گمنام — نقره‌فام و سیمگون — بحث و گفت‌وگو", "a": ["جاهل و دانا = <b>تضاد</b> / فراست و زیرکی = <b>ترادف</b> / فروزان و بی‌فروغ = <b>تضاد</b> / بلندآوازه و گمنام = <b>تضاد</b> / نقره‌فام و سیمگون = <b>ترادف</b> / بحث و گفت‌وگو = <b>ترادف</b>."]}, {"g": "خودآزمایی (صفحهٔ ۷۳)", "n": "۲", "q": "مانند نمونه، جدول زیر را کامل کنید:", "a": ["فعل: شنیدم؛ زمان: گذشته؛ نوع: ساده؛ شمار: مفرد؛ شخص: اول شخص؛ بن: شنید", "فعل: می‌سازیم؛ زمان: حال (مضارع)؛ نوع: اخباری؛ شمار: جمع؛ شخص: اول شخص؛ بن: ساز", "فعل: گفته‌اند؛ زمان: گذشته؛ نوع: نقلی؛ شمار: جمع؛ شخص: سوم شخص؛ بن: گفت", "فعل: بپرسید؛ زمان: حال (مضارع)؛ نوع: التزامی؛ شمار: جمع؛ شخص: دوم شخص؛ بن: پرس", "فعل: دارد می‌نویسد؛ زمان: حال (مضارع)؛ نوع: مستمر؛ شمار: مفرد؛ شخص: سوم شخص؛ بن: نویس"]}, {"g": "خودآزمایی (صفحهٔ ۷۳)", "n": "۳", "q": "جملهٔ زیر با کدام قسمت درس، ارتباط معنایی بیشتری دارد؟ دلیل آن را بنویسید: «انسانِ بلندهمت تا پایه‌ای بلند به دست نیاورد، از پای طلب ننشیند.» (کلیله و دمنه)", "a": ["با بخشِ داستانِ خواجه نصیر (و درسِ کلی درس ۹: عشق به علم و کوشش): نصیرالدین نیز بلندهمت بود؛ برای رسیدن به دانشِ بلند، شب و روز نمی‌شناخت، به بازی‌های کودکانِ هم‌سنِ خود نپرداخت و با تفکر و پرسشگری (و مشاهدهٔ ستارگان) به کوشش ادامه می‌داد. دلیل ارتباط: هر دو می‌گویند <b>انسانِ همت‌بلند، تا به جایگاهِ والا و مقصدِ دور نرسیده، از خواستن و تلاش دست نمی‌کشد</b>؛ و همان‌گونه که در متن درس آمده، «گرچه منزل بس خطرناک است و مقصد بس بعید، هیچ راهی نیست کآن را نیست پایان»."]}, {"g": "خودآزمایی (صفحهٔ ۷۳)", "n": "۴", "q": "آرایه‌های هر عبارت را مشخص کنید: الف) هر روز درختِ وجودِ نصیرالدین، پربارتر می‌شد. — ب) همه یک صدا نامِ او را بر زبان می‌راندند.", "a": ["الف) <b>تشبیه و جان‌بخشی</b>: وجودِ نصیرالدین به درختی پربار تشبیه شده (به‌طور پنهان، به ک می‌رسد) و رشدِ علم به پربار شدنِ درخت جان‌دار، نسبت داده شده است؛ همچنین «پربارتر» صفت برتر است (دستوری). ب) <b>جان‌بخشی و کنایه</b>: «نامِ او را بر زبان راندن» کنایه از ستایش و یادِ همیشگیِ اوست؛ و «یک صدا» راندنِ نام، به همه (مجموعهٔ انسان‌ها) هم‌صدایی و هم‌زمانیِ انسانی نسبت داده شده (جان‌بخشی/تشخيص؛ همچنین مراعات نظیرِ مفهومیِ «همه + یک صدا» تقابلِ تعدد و یگانگی را می‌سازد)."]}],"notes7":[],"exam":["درس ۹: دو داستان از عالم‌ترین‌های ایران: کودکیِ <b>خواجه نصیرالدین طوسی</b> در توس + واپسین روزهای <b>ابوریحان بیرونی</b>.", "رازِ موفقیت نصیر: عشق به علم + گفت‌وگو و مناظره دربارهٔ آموخته‌ها + تفکر شبانه (تماشای ماه و ستارگان) + استواری («کوه آهن»).", "تشبیه مشهور متن: اشتیاق به دانش، مانند تشنهٔ بیابان است؛ هرچه می‌نوشد، تشنه‌تر می‌شود.", "لقب «کوه آهن» = استواری و خسته‌ناپذیری (توسط شاگردِ دوازده‌سال بزرگ‌تر).", "ابوریحان در بسترِ مرگ: «این مسئله را بدانم و بمیرم، بهتر است یا ندانم و زنده بمانم؟» — علم از جان نیز دوست‌داشتنی‌تر است؛ دانشمند با دشمنِ حسودِ خود نیز آشتی با علم داشت.", "حدیث کلیدی درس: «اُطلُبُوا العِلمَ مِنَ المَهدِ اِلَی اللَّحد» = از گهواره تا گور دانش بجویید (سفارش پیامبر اسلام ص).", "دستور درس: <b>ماضی ساده</b> (بن گذشته + شناسه: گفت) و <b>ماضی نقلی</b> (بن گذشته + هـ + ام/ای/است/ایم/اید/اند: خوابیده‌اند).", "ترادف/تضاد (تمرین): فراست=زیرکی، نقره‌فام=سیمگون، بحث=گفت‌وگو (ترادف)؛ جاهل/دانا، فروزان/بی‌فروغ، بلندآوازه/گمنام (تضاد)."]},
{"id":10,"icon":"🕊️","lnum":"درس دهم","title":"آرشی دیگر","info":"شاعر: محمد دهریزی | قالب: شعر نو (نیمایی) | سرودهٔ «کودکی از جنس نارنجک» با کاهش و اندکی تغییر | موضوع: حماسهٔ حسین فهمیده و آزادسازی خرمشهر","intro":"<b>پیام اصلی:</b> ایثار و شهادتِ نوجوانانِ مؤمن، به پیروزی می‌رسد؛ قهرمانان واقعی با ایمان و عشق به وطن می‌جنگند و روح آرش‌ها و سیاوش‌ها در تاریخ این سرزمین همیشه زنده است و نسل به نسل تکرار می‌شود.","kholase":["درس ۱۰، شعری نیمایی از محمد دهریزی است که قهرمانیِ شهید <b>حسین فهمیده</b> را در جنگ تحمیلی و آزادسازی خرمشهر روایت می‌کند. شاعر می‌گوید جنگ، نابرابر و باورنکردنی بود: در آن سو، نیمی از جهان با تانک‌های آتشین به یاری دشمن بدعهد و بی‌انصاف آمده بود و در این سو، ایرانیان تنها بودند و تنها سلاحشان «ایمان» بود. شهر خونینِ خرمشهر در غروب آفتاب خویش، چشم در چشم افق می‌دوخت و در دهان تانک‌ها می‌سوخت. شهر از آن سوی سنگرها به شیرمردان صدا زد که اگر دشمن بماند، خانه‌هامان تنگ و ناممان در دفتر تاریخ کم‌رنگ خواهد شد. خون آزادگان در سنگرها جوشید و همچون موجی خروشان، کودکی از دامن آن بیرون جست، از کمند آرزوها رست و با نارنجک به روی خاکریز آمد. دشمنان کوردل در دل او خورشیدِ ایمان، تیغ آتش‌خیز «دستان»، تیر «آرش» بر کمانش و خون «سیاوش» در رگش را نمی‌دیدند. کودک شهید، خود را «حسین کوچک ایران‌زمین» معرفی کرد، مثل کوهی آهنین در کمین تانک‌ها بود و سرانجام با فریاد تکبیر، همچون «کودکی از جنس نارنجک» خود را در دهان تانک‌ها انداخت. لحظه‌ای بعد از همهٔ تانک‌ها تنها تلی از خاکستر خاموش ماند؛ آسمان شوقش دف می‌زد، شط خرمشهر کف می‌زد و شهر، چشم اشک‌آلوده را وا کرد و پرچم خود را بر فراز گنبد زیبا تماشا کرد."],"payam":"<b>پیام اصلی:</b> ایثار و شهادتِ نوجوانانِ مؤمن، به پیروزی می‌رسد؛ قهرمانان واقعی با ایمان و عشق به وطن می‌جنگند و روح آرش‌ها و سیاوش‌ها در تاریخ این سرزمین همیشه زنده است و نسل به نسل تکرار می‌شود.","khanesh":"<b>نکتهٔ خوانش:</b> این درس لحن‌های متنوع دارد؛ لحن غالب بر فضای شعر، لحن <b>حماسی–روایی</b> است (کوبنده و استوار، به‌گونه‌ای که روح دلوری‌ها و شجاعت شخصیت‌ها به شنونده منتقل شود). بخش‌هایی از درس را می‌توان با لحن توصیفی، روایی و گزارشی خواند؛ برای تأثیرگذاریِ بهترِ لحن حماسی و تجسم صحنه‌ها می‌توان از حرکات دست و حالت‌های چهره نیز بهره گرفت.","blocks":[{"k": "verse", "lines": [{"n": "۱", "hem": ["جنگ، جنگی نابرابر بود • جنگ، جنگی فوق‌باور بود"]}, {"n": "", "hem": ["کیسه‌های خاکی و خونی، خطّ مرزی را جدا می‌کرد"]}, {"n": "", "hem": ["دشمنِ بدعهدِ بی‌انصاف، با هجومِ بی‌امانِ خود مرزها را جابه‌جا می‌کرد."]}], "mean": [["معنی", "جنگ، ناعادلانه و باورنکردنی بود؛ کیسه‌های خاکی و خون‌آلود، مرزِ ما و دشمن را از هم جدا می‌کرد و دشمن پیمان‌شکن با حمله‌های پی‌درپی و بی‌وقفه، سرزمین ما را مورد تجاوز قرار می‌داد و خاک ما را می‌گرفت."], ["لغت", "فوق‌باور: باورنکردنی، شگفت / هجوم: یورش و حملهٔ ناگهانی / جابه‌جا کردن: جابجاکردن و جابه‌جاشدن مرزها."], ["آرایه", "«جنگی نابرابر، کیسه‌های خاکی و خونی، دشمن بدعهد و بی‌انصاف، هجوم بی‌امان» ترکیب وصفی؛ تکرار «جنگ»."], ["نکته", "در شعر نیمایی (شعر نو) قافیه هست، اما نظم و ترتیب قافیه‌ها مانند شعرهای سنتی نیست؛ قافیه‌های این بند: «نابرابر و باور»، «جدا و جابه‌جا»."]]}, {"k": "verse", "lines": [{"n": "۲", "hem": ["از میان آتش و باروت، می‌وزید از هر طرف، هر جا"]}, {"n": "", "hem": ["تیرهای وحشی و سرکش • موشک و خمپاره و ترکش"]}, {"n": "", "hem": ["آن طرف، نصف جهان با تانک‌های آتشین در راه • این طرف، ایرانیان تنها"]}, {"n": "", "hem": ["این طرف تنها سلاح جنگ، ایمان بود."]}], "mean": [["معنی", "از میان آتش و گلوله، از هر سو تیرهای رها و وحشی و موشک و خمپاره و ترکش پرتاب می‌شد. در آن سوی مرز، نیمی از قدرت‌های جهان با تانک‌های مجهز و آتشین به راه افتاده بودند و در این سو، رزمندگان ایرانی تنها و دست‌خالی بودند و تنها سلاح جنگیدنشان، ایمان و اعتقاد به خداوند بود."], ["لغت", "خمپاره: گوله و بمب‌انداز / سرکش: نافرمان و رهاشده / وحشی: درنده‌خو."], ["آرایه", "«موشک، خمپاره، ترکش، تانک، سلاح و جنگ» مراعات نظیر؛ «سرکش و ترکش» جناس؛ «آن طرف و این طرف» تضاد و مراعات نظیر؛ «ایمان مانند سلاح» تشبیه (ایمان به سلاحِ پیروزی تشبیه شده)؛ اشارهٔ ضمنی به حمایت جهانیان از رژیم بعثی عراق در برابر ایرانِ تنها."]]}, {"k": "verse", "lines": [{"n": "۳", "hem": ["خانه‌های خاک و خون‌خورده، مهدِ شیران و دلیران بود"]}, {"n": ستی با مامِ میهن) وجود دارد؟ توضیح دهید.", "a": ["هر دو درس، ملت ایران را به دفاع از میهن و پاسداشت خاک فراخواه می‌دهند: در هر دو، عشق به وطن و فداکاری در راه آن ستایش شده است؛ هر دو می‌گویند فرزندان هر ملتی از خاک عزیز خود دفاع می‌کنند و جان و مال خود را برای میهن می‌بخشند؛ در هر دو، رابطهٔ عاطفیِ مادر و فرزندی (مامِ میهن؛ مهدِ شیران و دلیران) و همدلی و اتحاد برای حفظ ایران ستایش شده و هر دو، دشمنِ مهاجم را بدعهد و بی‌انصاف نشان می‌دهند."]}, {"g": "خود را بیازمایید (صفحهٔ ۷۹)", "n": "۴", "q": "...................................................................................................؟", "a": ["پاسخ نمونه: به نظر من، شعر «آرشی دیگر» نشان می‌دهد قهرمان‌بودن به جثه و سن و سال نمی‌خشد؛ ایمان و عشق به وطن است که از یک نوجوان، «آرشی دیگر» می‌سازد؛ ما نیز باید در سنگر علم و آمادگی، چون حسین فهمیده استوار باشیم و برای ایران عزت و آبادانی بخواهیم."]}, {"g": "گفت‌وگو (صفحهٔ ۸۰)", "n": "۱", "q": "دربارهٔ شباهت‌های آرش کمانگیر و حسین فهمیده گفت‌وگو کنید.", "a": ["هر دو ایرانی و عاشق سرزمین خود بودند و برای رهایی خاک میهن از چنگ دشمن، جان خود را باختند؛ هر دو در لحظهٔ سرنوشت‌ساز، خود را به دل خطر انداختند (آرش جان خود را در پرتاب نهاییِ تیر نهاد و مرز را جاودانه کرد؛ حسین با نارنجک زیر تانک رفت و راه آزادی خرمشهر را باز کرد)؛ هر دو الگوی ایثار و غیرت ایرانی‌اند و نامشان در «دفتر تاریخ» جاودانه شد."]}, {"g": "گفت‌وگو (صفحهٔ ۸۰)", "n": "۲", "q": "به کمک اعضای گروه، متن درس را به صورت نقالی، در کلاس اجرا کنید.", "a": ["پاسخ نمونه (گزارش اجرا): کار گروه را تقسیم کردیم؛ هر عضو بخشی از شعر را با لحن متناسب آن (حماسی–روایی برای صحنه‌های جنگ، غمگین برای سوختن خرمشهر، حماسی و با افتخار برای صحنهٔ تکبیر) اجرا کرد. برای تجسم صحنه‌ها از حرکات دست و حالت‌های چهره بهره گرفتیم، در جاهای تأکید با صدای کوبنده خواندیم و در پایان، تصویر پرچم بر فراز گنبد را با صدای بلند و شاد اجرا کردیم تا حس پیروزی به مخاطب منتقل شود."]}, {"g": "خودآزمایی (صفحهٔ ۸۰)", "n": "۱", "q": "در مصراع‌های زیر، واژه‌های نادرست املایی را بیابید و شکل صحیح آنها را بنویسید. الف) «ناگهان تکبیر پر واکرد / در میان آتش و باروت، غوقا کرد.» ب) «این طرف تنها اصلح جنگ، ایمان بود / خانه‌های خاک و خون خورده / مهد شیران و دليران بود.» پ) «دشمن بد عهد بی انصاف / با حجوم بی‌امان خود / مرزها را جا به جا می‌کرد.»", "a": ["الف) «پر» ← <b>پروا</b>؛ «غوقا» ← <b>غوغا</b>. ب) «اصلح» ← <b>سلاح</b>. پ) «حجوم» ← <b>هجوم</b>."]}, {"g": "خودآزمایی (صفحهٔ ۸۰)", "n": "۲", "q": "هر یک از بیت‌های زیر به کدام داستان اشاره دارد؟ چکیدهٔ آنها را در دو بند بنویسید. الف) «چون سگ اصحاب کهف، آن خرسِ زار / شد ملازم در پی آن بردبار» (مولوی) — ب) «ای دل ار سیل فنا بنیاد هستی برکَند / چون تو را نوح است کشتیبان ز طوفان غم مخور» (حافظ)", "a": ["الف) <b>تلمیح به داستان اصحاب کهف:</b> چند جوان مؤمن که در دورهٔ ستمگری از کفر گریختند، در غاری پناه گرفتند؛ سگی وفادار نیز همراهشان شد و درِ غاو درِ راهشان گشت. خدا آن‌ها را حدود سیصد سال (سیصد و نه سال با چند ماه) خواباند و سپس بیدارشان کرد؛ چون به شهر رفتند، دنیا را دگرگون یافتند و سرانجام در همان غار بازگشتند و به رحمت خدا پیوستند. <b>ب) تلمیح به داستان نوح (ع) و طوفان:</b> حضرت نوح قرن‌ها قوم خود را به توحید فراخواند؛ چون نپذیرفتند، به فرمان خدا کشتی بزرگی ساخت و از هر جفت حیوان و از مؤمنان (و خانواده‌اش) در آن جای داد؛ طوفان عظیم همهٔ سرزمین را فراگرفت و کافران غرق شدند؛ کشتیِ نوح به سلامت به کوه جودی رسید و زمین دوباره مسکن مؤمنان شد. حافظ می‌گوید: اگر سیل فنا همهٔ هستی را برکند، نجات‌بخشِ تو (امام معصوم و راهنمای الهی) کشتیبان است؛ غم مخور."]}, {"g": "خودآزمایی (صفحهٔ ۸۰)", "n": "۳", "q": "درک و دریافت خود را از سرودهٔ زیر بنویسید. «آسمان از شوق، دف می‌زد / شطّ خرمشهر، کف می‌زد / شهر یک‌باره به هوش آمد / چشم اشک‌آلوده را واکرد / بر فراز گنبدی زیبا / پرچم خود را تماشا کرد.»", "a": ["پاسخ نمونه: شاعر پیروزی و آزادسازی خرمشهر را چنان باشکوه روایت می‌کند که گویی همهٔ عالم شادمانه جشن گرفته است: آسمان دف می‌نوازد، رود کارون شادی می‌کند و شهرِ اشک‌ریزه، چشم گریان خود را می‌گشاید و نخستین نگاهش به پرچم ایران بر فراز گنبد است. این تصویرها می‌گویند فداکاریِ شهیدان، عالمِ هستی را به شادی و سرور وامی‌دارد و آزادی، زیباترین منظره برای یک جفت چشمِ اشک‌آلوده است."]}],"notes7":[],"exam":["درس ۱۰ «آرشی دیگر»: شعر <b>نیمایی (شعر نو)</b> از <b>محمد دهریزی</b>؛ بندی از منظومهٔ «کودکی از جنس نارنجک» با کاهش و اندکی تغییر؛ استقبالی از شعر قیصر امین‌پور؛ موضوع: شهادت حسین فهمیده و آزادسازی خرمشهر.", "مضامین کلیدی: جنگِ نابرابر (نصف جهان با تانک‌های آتشین در راه ↔ ایرانیان تنها و سلاحِ ایمان)؛ مهدِ شیران و دلیران؛ شهر خونین خرمشهر در غروب آفتاب خویش؛ فصلِ تکرار تاریخ؛ کودکی از جنس نارنجک؛ «من حسین کوچک ایران‌زمین هستم»؛ آسمان دف می‌زد و شط خرمشهر کف می‌زد.", "آرایه‌های نمونه: تلمیح به شاهنامه (دستان، آرش، سیاوش)؛ جان‌بخشی (صدازدن شهر، دف‌زدن آسمان، دهان تانک)؛ کنایه (جوشیدن خون، خوردن بغض، غروب آفتاب خویش)؛ تشبیه (مثل کوهی آهنین، مثل یک موج)؛ استعاره (شیران=رزمندگان، موج=رزمندگان)؛ جناس (سرکش/ترکش، جانبازی/بازی).", "دانش ادبی کتاب: <b>تلمیح</b> = اشاره به آیات، روایات، احادیث و داستان‌ها و رویدادهای تاریخی («با گوشهٔ چشم اشاره کردن»)؛ نمونه‌ها: تیر آرش و خون سیاوش؛ «یوسف گم‌گشته بازآید به کنعان» (حافظ)؛ «چون خلیل از شعله گل چیدن خوش است» (اقبال).", "حکایت «نیک رایان» از <b>بهارستان جامی</b> (قرن ۹): «نه مرد به عمل، بزرگ و شریف گردد، بلکه عمل، به مرد، بزرگ و شریف گردد؛ پس در هر عمل که هست، نیکو سیرتی می‌باید و داد.»", "دستور: ترکیب‌های وصفی (جنگی نابرابر...)؛ مشتق (خونین، خروشان)؛ مشتق–مرکب (خون‌خورده)؛ مرکب (نام‌آور، کم‌رنگ، شیرمردان)؛ «را» در «تانک‌های شومتان را» فکّ اضافه؛ «مردان» و «دشمن» منادا؛ «خواهد شد» آینده.", "املا: غوغا، سلاح، هجوم، پروا (اشتباه‌های رایج: غوقا، اصلح، حجوم، پر)."]},
{"id":11,"icon":"🌙","lnum":"درس یازدهم","title":"زنِ پارسا","info":"نویسنده: عطّار نیشابوری | منبع: تذکرةالاولیاء | نوع متن: حکایت تاریخی–تعبیری (نثر ساده و روان) | موضوع: زندگی رابعهٔ عدویه","intro":"<b>پیام اصلی:</b> توکل به خدا، پارسایی و بی‌نیازی از خلق، انسان را چنان محبوب خدا می‌کند که خویش، نگهبانِ او می‌شود: «اگر یک دوست خفته است، دوستِ دیگر بیدار است»؛ رابعه الگوی زنِ عارف و پارساست که در همهٔ سختی‌ها تنها رضای خدا را می‌جوید.","kholase":["درس ۱۱، گوشه‌ای از زندگی <b>رابعهٔ عدویه</b> (از زنان عارف، پرهیزگار و بزرگ قرن دوم هجری، مشهور در عبادت و نیکوکاری) را از زبان عطار در تذکرةالاولیاء روایت می‌کند. نقل است شبی که رابعه به دنیا آمد، در خانهٔ پدرش چندان جامه نبود که او را در آن بپیچند و چراغی هم نبود. پدرش سه دختر داشت و رابعه چهارم بود (از همین رو «رابعه» = چهارم نامیده شد). مادر خانواده از او خواست به خانهٔ همسایه‌ای برود و روغن چراغ بگیرد؛ اما پدر رابعه عهد کرده بود که از هیچ مخلوقی چیزی نخواهد؛ بی‌خیال برگشت و گفت: «خفته‌اند.» دلتنگ بخفت و در خواب، پیامبر اسلام (علیه‌الصلاة والسلام) را دید که فرمود: «غمگین مباش که این دختر، سیّده‌ای است که هفتاد هزار [از] امّت من در شفاعت او خواهند بود.» رابعه بزرگ شد؛ پدر و مادرش درگذشتند، در بصره قحطی عظیمی پیدا شد، خواهران پراکنده شدند و رابعه به دست ظالمی افتاد و به چند درم فروخته شد. خواجه‌اش او را به رنج و مشقت کار می‌گماشت تا آن‌که روزی افتاد و دستش شکست؛ روی بر خاک نهاد و به مناجات گفت: «الهی! غریبم و بی‌مادر و پدر، اسیرم و دست‌شکسته؛ مرا از این همه هیچ غم نیست، جز رضای تو؛ می‌باید تا بدانم که راضی هستی یا نه؟» آوازی شنید: «غم مخور، فردا جاهِیت خواهد بود، چنان که مقرّبانِ آسمان به تو نازند.» رابعه به عبادت پرداخت؛ شب‌ها نماز می‌خواند و چون خواجه‌ای از خواب بیدار شد، صدای او را در سجده شنید: «الهی! تو می‌دانی که هوای دل من در موافقت فرمان توست و روشنایی چشم من در خدمت درگاه تو؛ اگر کار به دست من استی، یک ساعت از خدمتت نیاسودمی؛ اما تو مرا زیر دست مخلوق کرده‌ای و از این رو به خدمت تو دیر می‌آیم.» شبی دزدی درآمد و چادرش را برداشت؛ اما هر بار که خواست برود، راه را ندید و چادر را به جا گذاشت — تا هفت نوبت. سرانجام از گوشهٔ صومعه آوازی درآمد: «ای مرد! خود را رنجه مدار که او چند سال است تا به ما دل سپرده است؛ ابلیس زهره ندارد که گردِ او گردد؛ دزد را کی زهرهٔ آن بود که گردِ چادر او گردد؟ خود را مرنجان ای طرّار! که اگر یک دوست خفته است، دوستِ دیگر بیدار است.»"],"payam":"<b>پیام اصلی:</b> توکل به خدا، پارسایی و بی‌نیازی از خلق، انسان را چنان محبوب خدا می‌کند که خویش، نگهبانِ او می‌شود: «اگر یک دوست خفته است، دوستِ دیگر بیدار است»؛ رابعه الگوی زنِ عارف و پارساست که در همهٔ سختی‌ها تنها رضای خدا را می‌جوید.","khanesh":"","blocks":[{"k": "prose", "t": "نقل است آن شب که رابعه در وجود آمد، در خانهٔ پدرش چندان جامه نبود که او را در آن بپیچند و چراغ نبود. پدر او را سه دختر بود. رابعه، چهارم بود. از آن، رابعه گویند. پس عیال با او گفت: «به فلان همسایه رو و چراغی روغن بخواه».", "mean": [["معنی", "گفته‌اند شبی که رابعه به دنیا آمد، در خانهٔ پدرش به‌اندازهٔ کافی لباس نبود که نوزاد را در آن بپیچند و چراغی هم در خانه نبود. پدر او سه دختر داشت و رابعه دختر چهارم بود؛ به همین سبب به او «رابعه» (= چهارم) می‌گویند. آن‌گاه همسر پدرش به او گفت: «به خانهٔ فلان همسایه برو و برای چراغ، روغن بگیر»."], ["لغت", "نقل است: گفته‌اند / در وجود آمد: به دنیا آمد / چندان: به‌اندازهٔ کافی / عیال: همسر و خانواده / فلان: اشاره به شخصی نامعلوم و مبهم."], ["دستور", "واژه‌های «خانه» و «جامه» ساده‌اند؛ «نبود» در «جامه نبود» و «چراغ نبود» فعل غیراسنادی (وجود نداشت) است؛ «را» در «پدر او را» مفهوم مالکیت دارد و فعل را به «داشت» نزدیک می‌کند: پدر او سه دختر <b>داشت</b>؛ «رو» و «بخواه» هر دو فعل امرند؛ «گویند» فعل معلوم؛ «آن» در «از آن» ضمیر اشاره."]]}, {"k": "prose", "t": "پدر رابعه عهد کرده بود که از مخلوق هیچ نخواهد. برخاست و به درِ خانهٔ آن همسایه رفت و بازآمد و گفت: «خفته‌اند». پس دلتنگ بخفت و پیامبر [را] — علیه‌الصلاة والسّلام — به خواب دید. گفت: «غمگین مباش که این دختر، سیّده‌ای است که هفتاد هزار [از] امّت من در شفاعت او خواهند بود».", "mean": [["معنی", "پدر رابعه با خدا عهد بسته بود که از هیچ آفریده‌ای (انسان‌ها) چیزی نخواهد. برخاست، به درِ خانهٔ آن همسایه رفت، بی‌جواب برگشت و گفت: «خوابیده‌اند». سپس دلتنگ و اندوهگین خوابید و در خواب، پیامبر اسلام (ص) را دید که فرمود: «غمگین مباش؛ این دختر بانویی بزرگ و سرور است که در روز قیامت، هفتاد هزار تن از امّت من به شفاعت و میانجی‌گریِ او آمرزیده خواهند شد»."], ["لغت", "عهد: پیمان / مخلوق: آفریده و بندگان خدا / دلتنگ: اندوهگین / بخفت: خوابید / سیّده: سرور و بانوی بزرگ (مونثِ سید) / امّت: پیروان یک پیامبر / شفاعت: خواهش و میانجی‌گری."], ["دستور", "«عهد کرده بود» ماضی بعید؛ «برخاست» و «بخفت» ماضی ساده؛ «خفته‌اند» ماضی نقلی؛ «خواهند بود» فعل آینده (مستقل)؛ «هیچ» در «هیچ نخواهد» قید؛ «مباش» فعل نهی."]]}, {"k": "prose", "t": "چون رابعه بزرگ شد، پدر و مادرش بمردند و در بصره قحطیِ عظیم پیدا شده و خواهران متفرّق شدند و رابعه به دست ظالمی افتاد. او را به چند درم بفروخت. آن خواجه او را به رنج و مشقّت، کار می‌فرمود. روزی، بیفتاد و دستش بشکست. روی بر خاک نهاد و گفت: «الهی! غریبم و بی‌مادر و پدر، اسیرم و دست‌شکسته.", "mean": [["معنی", "وقتی رابعه بزرگ شد، پدر و مادرش درگذشتند؛ در بصره خشک‌سالیِ شدیدی پیدا شد، خواهرانش پراکنده شدند و رابعه به دست ستمگری افتاد و او را به بهای چند سکهٔ نقره فروخت. صاحب‌خانه (خواجه) او را به کارهای سخت و دشوار وامی‌داشت. روزی رابعه زمین‌خورد و دستش شکست؛ چهره را بر خاک نهاد (به سجده و مناجات درآمد) و گفت: «پروردگارا! غریبم، بی‌مادر و بی‌پدرم، در اسارت‌ام و دستم شکسته...»."], ["لغت", "قحطی: خشک‌سالی / متفرّق: پراکنده / درم: درهم، سکهٔ نقره / خواجه: صاحب و سرور / مشقّت: سختی / بیفتاد: افتاد."], ["آرایه", "«روی بر خاک نهادن» کنایه از سجده کردن و به مناجات درآمدن."], ["دستور", "«چون» حرف ربط (زمانی)؛ «ش» در «مادرش» مضاف‌الیه؛ «الهی» منادا؛ «چند» صفت مبهم؛ «دست‌شکسته» صفت مرکب؛ «بفروخت» و «بیفتاد» ماضی ساده؛ «می‌فرمود» ماضی استمراری."]]}, {"k": "prose", "t": "مرا از این همه، هیچ غم نیست، الّا رضای تو؛ می‌باید تا بدانم که راضی هستی یا نه؟» آوازی شنید که «غم مخور، فردا جاهِیت خواهد بود، چنان که مقرّبانِ آسمان به تو نازند».", "mean": [["معنی", "«من از این همه رنج و مصیبت، هیچ اندوهگین نیستم؛ تنها دلم می‌خواهد بدانم که آیا از من خشنود هستی یا نه!» ناگهان آوایی شنید که گفت: «اندوه مدار؛ فردا چنان مقام و جاهی خواهی یافت که فرشتگان و برگزیدگانِ درگاه خدا به تو افتخار کنند (به تو نازند)»."], ["لغت", "الّا: جز، مگر / جاهیت: مقام و منزلت تو / مقرّبان: نزدیکانِ درگاه خدا، فرشتگان / نازیدن: افتخار کردن."], ["آرایه", "«مقرّبان آسمان» استعاره از فرشتگان؛ «مقرّبان آسمان به تو نازند» اغراق؛ «غم مخور» فعل نهی."], ["دستور", "«ت» در «جاهیت» متمم است (جاهی برای تو خواهد بود)؛ «می‌باید» فعل مضارع اخباری از مصدر «بایستن»؛ «راضی» صفت مشتق؛ «غم مخور» فعل نهی."]]}, {"k": "prose", "t": "پس رابعه به خانه رفت و دایم روزه داشتی و همه شب نماز کردی و تا روز بر پای بودی. شبی خواجه از خواب درآمد. آوازی شنید. نگاه کرد، رابعه را دید در سجده که می‌گفت: «الهی! تو می‌دانی که هوای دل من در موافقت فرمان توست و روشنایی چشم من در خدمت درگاه تو. اگر کار به دست من استی، یک ساعت از خدمتت نیاسودمی؛ امّا تو مرا زیر دست مخلوق کرده‌ای؛ به خدمت تو از آن، دیر می‌آیم».", "mean": [["معنی", "سپس رابعه به خانه برگشت؛ همیشه روزه بود و شب‌ها تا بامداد به نماز و عبادت ایستاده بود. شبی خواجه از خواب بیدار شد و صدایی شنید؛ نگاه کرد و رابعه را در حال سجده دید که می‌گفت: «خدایا! تو آگاهی که خواستهٔ دلم در پیروی از فرمان توست و روشنایی چشمم در خدمتگزارِ درگاه توست. اگر اختیارِ کار در دست من بود، لحظه‌ای از خدمتت دل نمی‌کندم (بی‌وقفه در خدمتم می‌ماندم)؛ اما تو مرا زیر دستِ مخلوقی آفریده‌ای و از همین جهت، دیر به خدمت تو می‌آیم»."], ["لغت", "روزه داشتی: روزه بود (ماضی استمراری) / هوای دل: خواسته و آرزوی قلب / موافقت: همراهی و پیروی / استی: هستی (فعل اسنادی) / نیاسودمی: آسوده و بی‌خیال نمی‌شدم / زیر دست: در فرمان و غلامیِ."], ["آرایه", "«روشنایی چشم در چیزی بودن» کنایه از عزیز و مهم بودن آن چیز؛ «از خواب درآمدن» کنایه از بیدار شدن؛ «آواز» مجاز از صدا."], ["دستور", "«داشتی، کردی، بودی» ماضی استمراری (ساخت قدیم)؛ «الهی» منادا؛ «هوای دل من» گروه نهادی (هوا هسته + مضاف‌الیه «دل» + «من»)؛ «استی» فعل اسنادی به معنی «هستم»؛ «می‌آیم» مضارع اخباری؛ «نمی‌آسودم/نیاسودمی» ماضی استمراری منفی."]]}, {"k": "prose", "t": "شبی دزدی درآمد و چادرش برداشت. خواست تا ببرد، راه ندید. چادر بر جای نهاد. بعد از آن، راه باز یافت. دگربار چادر برداشت و راه باز ندید؛ همچنین تا هفت نوبت.", "mean": [["معنی", "شبی دزدی به خانه آمد و چادر رابعه را برداشت؛ اما هر بار که خواست فرار کند، راهِ بیرون‌رفتن را نمی‌یافت و ناچار چادر را سر جایش می‌گذاشت و بعد راه را می‌یافت؛ این کار هفت بار تکرار شد (خدا اجازه نمی‌داد مالِ محبوبش به سرقت برود)."], ["دستور", "«بازیافت» فعل پیشوندی و ماضی ساده؛ «دگربار» قید (مرکب)؛ «نیز/همچنین» قید؛ «هفت نوبت» متمم."]]}, {"k": "prose", "t": "از گوشهٔ صومعه آواز درآمد که: «ای مرد! خود را رنجه مدار که او چند سال است تا به ما دل سپرده است. ابلیس زهره ندارد که گِردِ او گَردد؛ دزد را کی زَهرهٔ آن بود که گِرد چادر او گردد؟ تو خود را مرنجان ای طرّار! که اگر یک دوست خفته است، دوستِ دیگر بیدار است».", "mean": [["معنی", "از گوشهٔ عبادتگاه (صومعه) آوازی بلند شد که: «ای مرد (دزد)! خود را به زحمت نینداز؛ او سال‌هاست دلباختهٔ ما (خدا) است. شیطان جرئت ندارد به گردِ او نزدیک شود؛ دزد را کی جرئتِ آن باشد که به گردِ چادر او بگردد (چادرش را بدزدد)؟! خود را آزار نده ای دزد و حیله‌گر! که اگر یک دوست (رابعه) در خواب است، دوستِ دیگرش (خداوند) بیدار است و نگاهبانیِ او می‌کند»."], ["لغت", "صومعه: عبادتگاهِ راهبان و پارسایان / رنجه مدار: خود را به رنج انداخته مدار / زهره: جرئت (در اصل: کیسهٔ صفرا) / طرّار: دزد و حیله‌گر / گِردِ...گَردد: در پیرامونِ...بگردد."], ["آرایه", "«دل سپردن» کنایه از عاشق و دلباخته شدن؛ «زهره» مجاز از جرئت؛ «دوستِ دیگر» استعاره از خداوند؛ «خفته و بیدار» تضاد؛ «دزد را کی زهرهٔ آن بود که...؟» <b>پرسش انکاری</b> (= جرئت ندارد)؛ «ای طرّار» ندا."], ["دستور", "«می‌» در «مرنجان» و «رنجه مدار» فعل نهی؛ «چند سال است» جملهٔ اسنادی (ماضی/مضارع اسنادی)؛ «کی» قید پرسشی؛ «یک» صفت شمارشی؛ «خفته» و «بیدار» صفت (مشتق)."]]}, {"k": "sub", "t": "روان‌خوانی «دروازه‌ای به آسمان» — شهید سیدمرتضی آوینی"}, {"k": "p", "t": "این روان‌خوانی، نگاهِ شاعرانه و عارفانهٔ شهید آوینی به مقاومت و آزادسازی <b>خرمشهر</b> است. آوینی می‌گوید: از دوازدهم مهرماه ۱۳۵۹ (آغاز دفاع) چه به یاد داری؟ خرمشهرِ آن روزها، «خونین‌شهر» نبود که هست؛ این شهر دروازه‌ای در زمین داشت و دروازه‌ای دیگر در آسمان و جست‌وجوی تو برای دروازهٔ آسمانی بود که به کربلا باز می‌شد و جز مردانِ مرد را به آن راه نمی‌دادند. جنگ برپا شده بود تا «محمد جهان‌آرا» به قافله‌ای بپیوندد که به سوی عاشورا می‌رفت. پندارِ ما این است که ما مانده‌ایم و شهدا رفته‌اند؛ اما حقیقت آن است که زمان، ما را با خود برده است و شهدا مانده‌اند. فرصتِ زیستن — چه در صلح و چه در جنگ — کوتاه است. یک روز آتشِ جنگ جسم شهر را گرفت؛ اما این آتش که چنگ بر جسم ما افکنده، با مرگ خاموشی نمی‌گیرد؛ نوجوانان رشید و دلیر شهید، به سرچشمهٔ جاودانگی رسیده‌اند: حیاتِ حقیقیِ مردان خدا، ققنوس‌وار از میان خاکسترِ نخل‌های نیم‌سوخته، خانه‌های ویران، اتومبیل‌های آتش‌گرفته و کشتی‌های به‌گل‌نشسته سر برآورد. عجب از این عقلِ باژگونه که ما را در جست‌وجوی شهدا به قبرستان می‌کشاند (شهدا را باید در دل و تاریخ جست، نه در گوشهٔ قبرستان)! مسجد جامع خرمشهر مادری بود که فرزندانش را زیر بال و پر گرفته بود؛ شب آخر، شهید «جهان‌آرا» حرکتی امام‌حسینی کرد و به بسیجی‌ها گفت: «این‌جا کربلاست و ما هم با یزیدی‌ها می‌جنگیم... هر کس می‌تواند، بایستد و هر کس نمی‌تواند، برود؛ اما ما می‌ایستیم تا یا دشمن را از بین ببریم یا دشمن ما را به شهادت برساند.» همه بلند شدند، بغلش کردند و ماندند. کربلای خرمشهر قرارگاهِ عشق است؛ شایستگان آنان‌اند که قلبشان چنان انباشته از عشق است که ترس از مرگ، جای برای ماندن ندارد؛ شایستگان جاودان‌اند. در پسِ این ویرانی‌ها معارجی (نردبان‌های عروج) بود و بر فراز آن، امامِ عشق، حسین‌بن‌علی (ع)، آغوش گشوده بود؛ رزم‌آوران به جنگ از این منظرِ آسمانی می‌نگریستند که «در هر وجب از این خاک، شهیدی به معراج رفته است؛ با وضو وارد شوید» — جمله‌ای که جوانی بسیجی بر تابلوی دروازهٔ خرمشهر نوشته بود و خود نیز در سال ۱۳۶۷ به شهادت رسید."}, {"k": "p", "t": "<b>مفهوم:</b> خرمشهر نمادِ هشت سال مقاومت و دروازهٔ آسمانیِ عشق و شهادت است؛ شهیدان زنده‌اند و میهنِ عاشورایی، با یادِ آنان سرپاست؛ عشق، ترس از مرگ را می‌سوزاند. <b>لغت:</b> خونین‌شهر: شهرِ خون‌گرفته (اسم مشتق مرکب) / قافله: کاروان / باژگونه: واژگونه و آشفته / ققنوس: پرندهٔ افسانه‌ای که در آتشی که خود برمی‌افروزد می‌سوزد و از خاکسترش دوباره زاده می‌شود؛ رمزِ جاودانگی و فداکاری / معارج: نردبان‌ها، وسیلهٔ عروج و بالا رفتن / مقرّ: قرارگاه / استقرار: قرار گرفتن / شایستگان: لایقان و سزاوارا >»، «<b>می‌آیم</b>».", "<b>۲) فعل گذشتهٔ (ماضی) مستمر (جاری):</b> به جمله‌های زیر توجه کنید: «<b>داشتم می‌رفتم</b> که حسن آمد.» / «<b>داشت باران می‌بارید</b> که بازی شروع شد.» فعلی که به جریانِ انجامِ عملی در گذشته، همراه با کاری دیگر، دلالت دارد، فعل «گذشتهٔ مستمر» نامیده می‌شود. هرگاه فعل‌های کمکی «داشتم، داشتی، داشت، داشتیم، داشتید، داشتند» را به اولِ گذشتهٔ استمراری بیفزاییم، فعل گذشتهٔ مستمر به دست می‌آید:"], "tables": [], "notes": ["<b>نکته:</b> ماضی استمراری = تکرار و استمرار کار در گذشته؛ ماضی مستمر = در جریان بودن یک کار در گذشته هنگام وقوع کار دیگر («که حسن آمد»، «که بازی شروع شد»). در متن درس: «رودخانهٔ خرمشهر آن روزها هم بی‌وقفه گذشته است...» (ماضی نقلی) و «شبی دزدی درآمد و چادرش برداشت» (ماضی ساده)."]}],"arts":{"intro": [], "tables": [{"head": ["آرایه", "نمونه از درس ۱۱ و روان‌خوانی"], "rows": [["کنایه", "«روی بر خاک نهاد» (سجده کرد)؛ «دل سپردن» (عاشق شدن)؛ «روشنایی چشم در خدمت درگاه تو بودن» (چشم‌نواز و عزیز بودن)؛ «از خواب درآمدن» (بیدار شدن)؛ «جاهی که مقرّبان آسمان به تو نازند» (مقام والا یافتن)؛ «آتش جسم شهر را در خود گرفت» (نابود کرد)؛ «کشتی‌ها به گل نشستند» (از رونق افتادنِ اقتصاد)؛ «سر برآورد» (ادامه پیدا کرد)"], ["استعاره / مجاز", "«زهره» (مجاز از جرئت)؛ «دوستِ دیگر» (استعاره از خداوند)؛ «مقرّبان آسمان» (فرشتگان)؛ «آواز» (مجاز از صدا)؛ «خرمشهر» (مجاز از مردم خرمشهر)"], ["جان‌بخشی (تشخیص)", "«رودخانه ماند و نظاره کرد»؛ «این آتش که چنگ بر جسم ما افکنده»؛ «جسمِ شهر»"], ["تشبیه", "«حیات حقیقی مردان خدا، ققنوس‌وار... سر برآورد» (تشبیه با پسوند «وار»)؛ «خرمشهر شقایقی خون‌رنگ است»؛ «مسجد جامع خرمشهر مادری بود»"], ["تضاد", "«خفته و بیدار»؛ «غریب و مقرّب»؛ «زمین و آسمان» (روان‌خوانی)؛ «صحبت نیک و همنشین بد»"], ["اغراق", "«فردا جاهیت خواهد بود، چنان که مقرّبانِ آسمان به تو نازند»"], ["پرسش انکاری", "«دزد را کی زهرهٔ آن بود که گردِ چادر او گردد؟» (= جرئت ندارد)؛ «می‌باید تا بدانم که راضی هستی یا نه؟»"], ["تلمیح / اشاره", "«هر کس می‌تواند، بایستد و هر کس نمی‌تواند، برود» (اشاره به فرمایش امام حسین ع در شب عاشورا)؛ «پندارِ ما این است که ما مانده‌ایم و شهدا ر
