<style>
:root{--bg:#f5f7fb;--surface:#fff;--surface2:#eef2f7;--surface-2:#f7f8fb;--text:#172033;--muted:#647084;--primary:#5b5cf0;--primary2:#7b61ff;--good:#18a46a;--bad:#df4b58;--border:#dde3ed;--shadow:0 12px 35px rgba(25,35,55,.08);font-family:"Vazirmatn",Tahoma,Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px)}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.9}
a{text-decoration:none;color:inherit}
button{font-family:inherit}
:focus-visible{outline:3px solid #5b5cf080;outline-offset:2px}
[hidden]{display:none!important}
.topbar{height:72px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:24px;padding:0 5%;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;min-width:175px}
.brand-logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:0 7px 18px #1b2d5540;border:1px solid var(--border);flex:none}
.brand-logo svg{width:28px;height:28px}
.brand small{display:block;color:var(--muted);font-size:11px;line-height:1.5}
.topbar nav{display:flex;gap:4px;flex:1;justify-content:center}
.topbar nav a{padding:8px 11px;border-radius:10px;color:var(--muted);font-size:14px;white-space:nowrap}
.topbar nav a:hover,.topbar nav a[aria-current="page"]{background:var(--surface2);color:var(--text)}
.actions{display:flex;gap:7px}
.actions button,.mobile-only{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;width:40px;height:40px;cursor:pointer;font-size:16px}
.mobile-only{display:none}
.hero{padding:70px 5% 45px;background:radial-gradient(circle at 85% 15%,#7b61ff22,transparent 35%),radial-gradient(circle at 15% 10%,#5b5cf018,transparent 30%)}
.hero-grid{max-width:1180px;margin:auto;display:grid;grid-template-columns:1.35fr .65fr;gap:40px;align-items:center}
.eyebrow{display:inline-block;padding:5px 11px;border-radius:99px;background:#5b5cf012;color:var(--primary);font-size:12px;font-weight:bold}
.hero h1{font-size:clamp(32px,5vw,58px);line-height:1.2;margin:15px 0}
.hero h1 span{color:var(--primary)}
.hero p{color:var(--muted);max-width:690px;font-size:17px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}
.btn{display:inline-block;border:0;border-radius:12px;padding:11px 18px;cursor:pointer;font:inherit;font-weight:bold;background:var(--primary);color:#fff;line-height:1.7}
.btn.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.progress-card{background:var(--surface);border:1px solid var(--border);padding:25px;border-radius:24px;box-shadow:var(--shadow)}
.progress-ring{width:150px;height:150px;margin:auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--primary) var(--progress,0%),var(--surface2) 0)}
.progress-ring>div{width:116px;height:116px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:27px;font-weight:bold}
.section{max-width:1180px;margin:0 auto;padding:45px 5%}
.section-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px;flex-wrap:wrap}
.section h2{margin:0;font-size:29px}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:19px;padding:19px;box-shadow:var(--shadow);transition:.2s}
a.card:hover{transform:translateY(-3px)}
.chapter-card{min-height:190px;position:relative;overflow:hidden;display:block}
.chapter-num{font-size:12px;color:var(--primary);font-weight:bold}
.chapter-icon{position:absolute;left:15px;top:13px;font-size:42px;color:#5b5cf018;font-weight:800;direction:ltr;line-height:1.3}
.chapter-card h3{margin:35px 0 5px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;background:var(--surface2);padding:3px 8px;border-radius:99px;color:var(--muted)}
.searchbar{display:flex;gap:8px;margin:20px 0}
.searchbar input{flex:1;padding:13px 15px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;font:inherit;outline:none}
.searchbar input:focus{border-color:var(--primary)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{padding:17px;background:var(--surface2);border-radius:15px}
.stat b{display:block;font-size:25px}
.lesson-layout{display:grid;grid-template-columns:250px 1fr;gap:22px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px)}
.side a,.side button.link{display:block;width:100%;text-align:right;border:0;background:none;cursor:pointer;font:inherit;padding:9px 11px;border-radius:10px;color:var(--muted);font-size:13px}
.side a.active,.side a:hover,.side button.link:hover{background:var(--surface2);color:var(--primary)}
.side hr{border:0;border-top:1px solid var(--border);margin:8px 0}
.lesson{margin-bottom:20px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 90px)}
.lesson h3{font-size:23px;margin-top:0}
.lesson h4{margin:22px 0 6px;font-size:17px}
.lesson p{margin:4px 0 0}
.topic{margin:7px 0}
.formula{background:#5b5cf00c;border-right:4px solid var(--primary);padding:12px 16px;margin:10px 0;border-radius:9px;font-family:Arial,sans-serif;direction:ltr;text-align:left}
.formula.rtl{direction:rtl;text-align:right;font-family:inherit;font-weight:600}
.example{background:#18a46a0b;border-right:4px solid var(--good);padding:14px;border-radius:10px;margin-top:12px}
.tip{background:#f59e0b0c;border-right:4px solid #f59e0b;padding:14px;border-radius:10px;margin-top:16px}
.warn{background:#df4b580c;border-right:4px solid var(--bad);padding:14px;border-radius:10px;margin-top:16px}
.lesson-intro{padding:14px 16px;border-radius:16px;background:var(--surface-2);border-right:4px solid var(--primary);margin-bottom:18px}
.lesson-intro p{margin:7px 0 0;line-height:2}
.question-card{margin-bottom:13px}
.question-card h3{font-size:18px;margin:6px 0 0}
.options{display:grid;gap:8px;margin-top:12px}
.option{padding:12px 14px;border:2px solid var(--border);background:var(--surface2);color:var(--text);border-radius:10px;cursor:pointer;text-align:right;font:inherit;font-weight:600;transition:.15s}
.option:hover:not(:disabled){border-color:var(--primary);background:var(--surface)}
.option.selected{border-color:var(--primary);background:#5b5cf01c;box-shadow:0 0 0 2px #5b5cf01c}
.option.correct{border-color:var(--good);background:#18a46a18;color:var(--text)}
.option.wrong{border-color:var(--bad);background:#df4b5818;color:var(--text)}
.option:disabled{cursor:default;opacity:1}
.exam-area .question-card{background:var(--surface)}
.result{padding:15px;border-radius:12px;background:var(--surface2);margin-top:15px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.select{padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font:inherit}
.qa-item{padding:14px 0;border-top:1px solid var(--border)}
.qa-item:first-of-type{border-top:0}
.qa-item h4{margin:0 0 8px}
.check-item{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--border);border-radius:14px;background:var(--surface);margin-bottom:10px;cursor:pointer}
.check-item input{width:20px;height:20px;margin-top:6px;accent-color:var(--primary);flex:none}
.check-item.done span{color:var(--muted);text-decoration:line-through}
.exam-choice{transition:transform .2s ease,border-color .2s ease}
footer{padding:35px 5%;margin-top:35px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:20px;color:var(--muted)}
.to-top{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:20px;border:0;border-radius:12px;width:43px;height:43px;background:var(--primary);color:#fff;cursor:pointer;display:none}
.to-top.show{display:block}
body.dark{--bg:#0d1119;--surface:#151b26;--surface2:#202938;--surface-2:#1a2230;--text:#edf1f7;--muted:#a4afbf;--border:#293344;--shadow:0 12px 35px rgba(0,0,0,.22)}
body.dark .formula{background:#5b5cf01c}
@media print{.topbar,footer,.to-top,.hero-actions,.side,.toolbar{display:none!important}.section{max-width:none}.lesson-layout{display:block}.card{box-shadow:none}}
@media(max-width:900px){.topbar nav{display:none}.mobile-only{display:block}.topbar.open nav{display:flex;position:absolute;top:72px;right:0;left:0;flex-wrap:wrap;padding:10px 4%;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}.hero-grid,.lesson-layout{grid-template-columns:1fr}.side{position:static}.grid{grid-template-columns:repeat(2,1fr)}.hero{padding-top:45px}}
@media(max-width:600px){.grid,.stats{grid-template-columns:1fr}.topbar{padding:0 4%}.brand{min-width:0}.brand small{display:none}.hero,.section{padding-left:4%;padding-right:4%}.hero h1{font-size:34px}footer{flex-direction:column}.card{border-radius:15px}.section h2{font-size:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>

<script>
const D = {"chapters": [{"id": 1, "title": "مواد و نقش آنها در زندگی", "icon": "Au", "quick": [{"t": "مفاهیم کلیدی", "p": "ماده‌ها را می‌توان از نظر خالص یا مخلوط بودن، عنصر یا ترکیب بودن و ویژگی‌های فیزیکی و شیمیایی بررسی کرد. عنصر از یک نوع اتم ساخته شده و ترکیب از چند عنصر با نسبت معین تشکیل می‌شود."}, {"t": "فلزها و واکنش‌پذیری", "p": "واکنش‌پذیری فلزها یکسان نیست. مس، منیزیم، آهن و طلا نمونه‌های مهم مقایسه‌ای هستند و طلا واکنش‌پذیری بسیار کمی دارد."}, {"t": "اکسیژن و ازن", "p": "اکسیژن برای بسیاری از فرایندهای زیستی و سوختن مهم است. ازن در لایه‌های بالایی جو نقش حفاظتی در برابر بخشی از پرتوهای فرابنفش دارد."}, {"t": "گوگرد و اسید سولفوریک", "p": "گوگرد از نافلزهای مهم است و اسید سولفوریک با فرمول H₂SO₄ در صنعت کاربرد فراوان دارد."}, {"t": "پلیمرها", "p": "پلیمرها مولکول‌های بزرگی هستند که از واحدهای تکرارشونده ساخته می‌شوند. پلیمرها می‌توانند طبیعی یا مصنوعی باشند؛ پلاستیک‌ها نمونه مهم پلیمرهای مصنوعی‌اند."}], "quickTip": "تفاوت عنصر و ترکیب، خالص و مخلوط، فلز و نافلز، مفهوم واکنش‌پذیری، کاربرد اکسیژن و ازن، فرمول H₂SO₄ و مفهوم پلیمر را دقیق بلد باش.", "jozve": [{"t": "۱) دسته‌بندی مواد", "p": "برای شناخت مواد باید بتوانیم آنها را بر اساس ساختار و ویژگی‌هایشان دسته‌بندی کنیم. ماده خالص ترکیب یکنواختی دارد و می‌تواند عنصر یا ترکیب باشد. مخلوط از کنار هم قرار گرفتن چند ماده تشکیل می‌شود و اجزای آن لزوماً نسبت ثابتی ندارند."}, {"t": "۲) عنصر و ترکیب", "p": "عنصر ماده‌ای است که از یک نوع اتم تشکیل شده است. ترکیب ماده‌ای است که از دو یا چند عنصر با نسبت معین ساخته شده و خواص آن با عناصر سازنده‌اش متفاوت است. بنابراین نباید هر ماده‌ای را که چند عنصر دارد، مخلوط دانست؛ در ترکیب، ذرات به شکل شیمیایی به هم مرتبط‌اند."}, {"t": "۳) فلزها و واکنش‌پذیری", "p": "فلزها ویژگی‌های متفاوتی دارند و واکنش‌پذیری آنها یکسان نیست. در مقایسه‌های کتاب، فلزهایی مانند منیزیم، آهن، مس و طلا از نظر واکنش‌پذیری اهمیت دارند. طلا واکنش‌پذیری کمی دارد و به همین دلیل برای ساخت برخی زیورآلات مناسب است."}, {"t": "۴) اکسیژن، ازن و نافلزها", "p": "اکسیژن در تنفس و بسیاری از واکنش‌های سوختن نقش دارد. ازن شکل دیگری از عنصر اکسیژن است و در بخش‌های بالایی جو در جذب بخشی از پرتو فرابنفش نقش حفاظتی دارد. نافلزهایی مانند نیتروژن، فسفر و کربن نیز کاربردهای مهمی دارند."}, {"t": "۵) گوگرد و اسید سولفوریک", "p": "گوگرد یک نافلز است و ترکیبات آن کاربردهای صنعتی دارند. اسید سولفوریک با فرمول H₂SO₄ از مواد مهم صنعتی است و باید فرمول آن را بشناسید."}, {"t": "۶) پلیمرها و پلاستیک‌ها", "p": "پلیمرها مواد مولکولی بزرگی هستند که از واحدهای کوچک‌تر و تکرارشونده ساخته می‌شوند. برخی پلیمرها طبیعی‌اند و برخی مصنوعی. بسیاری از پلاستیک‌ها پلیمرهای مصنوعی‌اند و به دلیل دوام زیاد، مدیریت پسماند آنها اهمیت محیط‌زیستی دارد."}], "tip": "عنصر/ترکیب/مخلوط را مقایسه کنید؛ کاربرد و ویژگی فلزها را بفهمید؛ H₂SO₄ را به خاطر بسپارید؛ تفاوت اکسیژن و ازن و مفهوم پلیمر را بلد باشید.", "mistake": "ترکیب را با مخلوط یکی نکنید. همچنین «فلز بودن» به معنی واکنش‌پذیری یکسان همه فلزها نیست.", "qa": [{"q": "چرا طلا برای ساخت زیورآلات مناسب است؟", "a": "زیرا واکنش‌پذیری کمی دارد و دیرتر با محیط واکنش می‌دهد."}, {"q": "تفاوت عنصر و ترکیب چیست؟", "a": "عنصر از یک نوع اتم تشکیل شده است؛ ترکیب از چند عنصر با نسبت معین ساخته شده و خواص جدیدی دارد."}, {"q": "پلیمر چیست؟", "a": "ماده‌ای با مولکول‌های بزرگ است که از واحدهای تکرارشونده ساخته شده است."}, {"q": "فرمول اسید سولفوریک چیست؟", "a": "H₂SO₄."}]}, {"id": 2, "title": "رفتار اتم‌ها با یکدیگر", "icon": "e⁻", "quick": [{"t": "یون", "p": "اتم یا گروهی از اتم‌ها که بر اثر از دست دادن یا گرفتن الکترون دارای بار الکتریکی می‌شود."}, {"t": "پیوند یونی", "p": "معمولاً با انتقال الکترون بین اتم‌ها و جاذبه بین یون‌های با بار مخالف شکل می‌گیرد. ترکیب یونی در حالت مذاب یا محلول آبی می‌تواند جریان برق را عبور دهد."}, {"t": "پیوند اشتراکی/کووالانسی", "p": "اتم‌ها الکترون‌ها را با یکدیگر به اشتراک می‌گذارند و مولکول تشکیل می‌دهند."}, {"t": "نمونه‌ها", "p": "آب H₂O، متان CH₄ و کربن‌دی‌اکسید CO₂ نمونه‌هایی از مواد مولکولی‌اند."}], "quickTip": "تفاوت انتقال الکترون در ترکیب یونی و اشتراک الکترون در ترکیب مولکولی، همراه با ویژگی رسانایی آنها مهم است.", "jozve": [{"t": "۱) چرا اتم‌ها پیوند تشکیل می‌دهند؟", "p": "اتم‌ها با تغییر آرایش الکترونی خود می‌توانند به حالت پایدارتر برسند. این کار می‌تواند با انتقال یا اشتراک الکترون‌ها انجام شود."}, {"t": "۲) یون", "p": "اگر اتمی الکترون از دست بدهد یا دریافت کند، تعداد پروتون‌ها و الکترون‌هایش دیگر برابر نیست و ذره دارای بار الکتریکی می‌شود که یون نام دارد. از دست دادن الکترون معمولاً یون مثبت و گرفتن الکترون یون منفی ایجاد می‌کند."}, {"t": "۳) پیوند یونی", "p": "در پیوند یونی، انتقال الکترون بین اتم‌ها باعث تشکیل یون‌های مثبت و منفی می‌شود و جاذبه الکتریکی میان آنها ترکیب یونی را پایدار می‌کند. ترکیبات یونی در حالت جامد معمولاً جریان برق را عبور نمی‌دهند، اما در حالت مذاب یا محلول آبی به علت وجود یون‌های متحرک می‌توانند رسانا باشند."}, {"t": "۴) پیوند اشتراکی یا کووالانسی", "p": "در پیوند اشتراکی، اتم‌ها یک یا چند جفت الکترون را با هم به اشتراک می‌گذارند. مواد مولکولی مانند آب، متان و کربن‌دی‌اکسید نمونه‌های مهم این نوع پیوندند."}, {"t": "۵) مقایسه یونی و مولکولی", "p": "در یونی، انتقال الکترون و یون‌های مثبت و منفی مهم است؛ در کووالانسی، اشتراک الکترون و تشکیل مولکول اهمیت دارد. این تفاوت را باید در سؤال‌های مقایسه‌ای توضیح دهید."}], "tip": "تعریف یون، تفاوت کاتیون و آنیون، مفهوم انتقال/اشتراک الکترون، علت رسانایی محلول ترکیبات یونی و تفاوت ترکیبات یونی و مولکولی مهم‌اند.", "mistake": "", "qa": [{"q": "یون چگونه تشکیل می‌شود؟", "a": "با از دست دادن یا گرفتن یک یا چند الکترون."}, {"q": "چرا محلول یک ترکیب یونی می‌تواند رسانا باشد؟", "a": "چون یون‌ها در محلول آزادانه‌تر حرکت می‌کنند و بار الکتریکی را منتقل می‌کنند."}, {"q": "تفاوت پیوند یونی و کووالانسی چیست؟", "a": "در یونی انتقال الکترون و جاذبه یون‌ها مهم است؛ در کووالانسی الکترون‌ها بین اتم‌ها به اشتراک گذاشته می‌شوند."}, {"q": "H₂O و CO₂ از نظر نوع ماده چه اهمیتی دارند؟", "a": "هر دو نمونه مواد مولکولی با پیوندهای اشتراکی‌اند."}]}, {"id": 3, "title": "به دنبال محیطی بهتر برای زندگی", "icon": "CO₂", "quick": [{"t": "چرخه کربن", "p": "مواد در طبیعت در چرخه‌های مختلف جابه‌جا می‌شوند. چرخه کربن با تنفس، فتوسنتز و سوختن ارتباط دارد."}, {"t": "سوخت‌های فسیلی", "p": "زغال‌سنگ، نفت و گاز طبیعی منابع مهم سوخت‌های فسیلی‌اند. سوختن آنها می‌تواند مقدار CO₂ جو را افزایش دهد."}, {"t": "نفت خام و هیدروکربن‌ها", "p": "نفت خام مخلوطی از هیدروکربن‌هاست. هیدروکربن‌ها ترکیب‌هایی از کربن و هیدروژن‌اند."}, {"t": "تقطیر", "p": "در تقطیر، اجزای مایع بر اساس تفاوت در دمای جوش جدا می‌شوند. در پالایش نفت از تقطیر جزءبه‌جزء استفاده می‌شود."}], "quickTip": "ارتباط سوخت‌های فسیلی با CO₂، چرخه کربن، تعریف هیدروکربن و اصل جداسازی در تقطیر را بلد باش.", "jozve": [{"t": "۱) چرخه‌های طبیعی", "p": "در طبیعت ماده‌ها ثابت نمی‌مانند و بین هوا، آب، خاک و جانداران جابه‌جا می‌شوند. چرخه کربن نمونه مهمی است که فتوسنتز، تنفس، تجزیه و سوختن را به هم مرتبط می‌کند."}, {"t": "۲) کربن‌دی‌اکسید", "p": "گیاهان در فتوسنتز کربن‌دی‌اکسید مصرف می‌کنند و جانداران در تنفس آن را تولید می‌کنند. سوختن سوخت‌های فسیلی نیز مقدار CO₂ جو را افزایش می‌دهد."}, {"t": "۳) سوخت‌های فسیلی", "p": "زغال‌سنگ، نفت خام و گاز طبیعی منابع فسیلی‌اند که در طی زمان بسیار طولانی شکل گرفته‌اند. مصرف زیاد آنها هم منابع محدود را کاهش می‌دهد و هم با افزایش انتشار گازهای حاصل از سوختن، بر محیط زیست اثر می‌گذارد."}, {"t": "۴) نفت خام و هیدروکربن", "p": "نفت خام مخلوطی از صدها ترکیب است و هیدروکربن‌ها ترکیب‌هایی از کربن و هیدروژن هستند. در مولکول هیدروکربن، اتم‌های کربن و هیدروژن با پیوندهای اشتراکی به هم متصل‌اند."}, {"t": "۵) نقطه جوش و تعداد کربن", "p": "در هیدروکربن‌های مورد بحث کتاب، با افزایش تعداد اتم‌های کربن، نیروی ربایش بین مولکول‌ها بیشتر و نقطه جوش نیز بیشتر می‌شود."}, {"t": "۶) تقطیر و پالایش نفت", "p": "تقطیر بر تفاوت نقطه جوش مواد تکیه دارد. در پالایش نفت، مخلوط نفت خام با گرم شدن و جداسازی بخش‌های مختلف، به برش‌هایی با ویژگی‌ها و کاربردهای متفاوت تبدیل می‌شود."}], "tip": "چرخه کربن، نقش CO₂، سوخت‌های فسیلی، تعریف هیدروکربن، رابطه تعداد کربن و نقطه جوش و اصل تقطیر بسیار مهم‌اند.", "mistake": "", "qa": [{"q": "هیدروکربن چیست؟", "a": "ترکیبی که از دو عنصر کربن و هیدروژن ساخته شده باشد."}, {"q": "چرا سوختن سوخت‌های فسیلی مهم است؟", "a": "چون انرژی تولید می‌کند اما CO₂ و دیگر محصولات احتراق نیز ایجاد می‌کند و منابع فسیلی محدودند."}, {"q": "تقطیر بر چه اصلی استوار است؟", "a": "بر تفاوت در نقطه جوش اجزای یک مخلوط."}, {"q": "کدام یک معمولاً نقطه جوش بیشتری دارد: C₆H₁₄ یا C₁₀H₂₀؟", "a": "C₁₀H₂₀، چون تعداد اتم‌های کربن بیشتری دارد و در چارچوب این مقایسه نیروی ربایش بیشتری دارد.", "opts": ["C₆H₁₄", "C₁₀H₂₀"], "ans": 1}]}, {"id": 4, "title": "حرکت چیست", "icon": "v", "quick": [{"t": "مسافت و جابه‌جایی", "p": "مسافت طول مسیر طی‌شده است. جابه‌جایی تغییر مکان از نقطه شروع تا نقطه پایان همراه با جهت است."}, {"t": "تندی متوسط", "p": "تندی متوسط = مسافت ÷ زمان."}, {"t": "سرعت متوسط", "p": "سرعت متوسط = جابه‌جایی ÷ زمان."}, {"t": "شتاب متوسط", "p": "شتاب متوسط = تغییر سرعت ÷ زمان."}, {"t": "تبدیل واحد", "p": "۱ متر بر ثانیه = ۳٫۶ کیلومتر بر ساعت."}], "quickTip": "تفاوت مسافت و جابه‌جایی، تندی و سرعت و حل مسئله‌های فرمولی مهم است.", "jozve": [{"t": "۱) توصیف حرکت", "p": "برای توصیف حرکت باید بدانیم جسم چه مسافتی را طی کرده، چه مقدار جابه‌جا شده و در چه مدتی این تغییر رخ داده است."}, {"t": "۲) مسافت و جابه‌جایی", "p": "مسافت طول کل مسیر طی‌شده است و کمیتی نرده‌ای است. جابه‌جایی تغییر مکان از نقطه شروع تا نقطه پایان و دارای اندازه و جهت است. ممکن است مسافت زیاد باشد اما جابه‌جایی کوچک یا حتی صفر شود؛ مثلاً جسمی که به نقطه شروع برمی‌گردد."}, {"t": "۳) تندی متوسط", "p": "تندی متوسط از تقسیم مسافت پیموده‌شده بر زمان صرف‌شده به دست می‌آید: تندی متوسط = مسافت ÷ زمان."}, {"t": "۴) سرعت متوسط", "p": "سرعت متوسط از تقسیم بردار جابه‌جایی بر زمان به دست می‌آید: سرعت متوسط = جابه‌جایی ÷ زمان. چون جابه‌جایی برداری است، سرعت متوسط نیز جهت دارد."}, {"t": "۵) تندی و سرعت لحظه‌ای", "p": "تندی لحظه‌ای مقدار تندی جسم در یک لحظه است؛ سرعت لحظه‌ای علاوه بر مقدار، جهت حرکت را نیز در نظر می‌گیرد."}, {"t": "۶) شتاب", "p": "شتاب متوسط نشان می‌دهد سرعت در چه مدت و چه مقدار تغییر کرده است: شتاب متوسط = تغییر سرعت ÷ زمان. تغییر سرعت می‌تواند از تغییر اندازه سرعت یا تغییر جهت حرکت ناشی شود."}, {"t": "۷) تبدیل واحد", "p": "برای تبدیل متر بر ثانیه به کیلومتر بر ساعت، عدد را در ۳٫۶ ضرب می‌کنیم. برعکس، برای تبدیل کیلومتر بر ساعت به متر بر ثانیه، بر ۳٫۶ تقسیم می‌کنیم."}], "tip": "در مسئله‌ها ابتدا واحدها را یکسان کنید، سپس مشخص کنید سؤال تندی می‌خواهد یا سرعت و مسافت می‌خواهد یا جابه‌جایی.", "mistake": "", "qa": [{"q": "اگر فردی یک دور کامل مسیر بسته را طی کند، جابه‌جایی او چه می‌شود؟", "a": "اگر به نقطه شروع برگردد، جابه‌جایی صفر است، هرچند مسافت پیموده‌شده صفر نیست."}, {"q": "فرمول تندی متوسط چیست؟", "a": "مسافت پیموده‌شده تقسیم بر زمان."}, {"q": "فرمول سرعت متوسط چیست؟", "a": "بردار جابه‌جایی تقسیم بر زمان."}, {"q": "۱ متر بر ثانیه چند کیلومتر بر ساعت است؟", "a": "۳٫۶ کیلومتر بر ساعت."}, {"q": "آیا ممکن است تندی متوسط غیرصفر باشد ولی سرعت متوسط صفر شود؟", "a": "بله؛ وقتی جسم حرکت کند و در پایان به نقطه شروع برگردد."}]}, {"id": 5, "title": "نیرو", "icon": "F", "quick": [{"t": "نیروی خالص", "p": "اگر نیروهای وارد بر جسم همدیگر را خنثی کنند، نیروی خالص صفر است."}, {"t": "قانون اول نیوتن", "p": "جسم تمایل دارد حالت سکون یا حرکت یکنواخت خود را حفظ کند مگر اینکه نیروی خالصی بر آن اثر کند."}, {"t": "قانون دوم نیوتن", "p": "F = ma؛ نیروی خالص با شتاب و جرم رابطه دارد."}, {"t": "قانون سوم نیوتن", "p": "نیروها به صورت کنش و واکنش ظاهر می‌شوند؛ این دو نیرو هم‌اندازه و خلاف جهت‌اند و بر دو جسم وارد می‌شوند."}, {"t": "اصطکاک", "p": "اصطکاک با حرکت نسبی یا تمایل به حرکت سطوح در تماس مخالفت می‌کند. اصطکاک ایستایی و جنبشی از مفاهیم مهم‌اند."}], "quickTip": "سه قانون نیوتن، نیروی خالص، رابطه F=ma و تفاوت اصطکاک ایستایی و جنبشی بسیار مهم‌اند.", "jozve": [{"t": "۱) نیرو و تغییر حرکت", "p": "نیرو می‌تواند باعث تغییر سرعت، تغییر جهت حرکت یا تغییر شکل جسم شود. برای بررسی حرکت، باید برآیند نیروهای وارد بر جسم را در نظر گرفت."}, {"t": "۲) نیروهای متوازن", "p": "اگر نیروهای وارد بر جسم همدیگر را خنثی کنند، نیروی خالص صفر است. در این حالت جسم ساکن می‌تواند ساکن بماند و جسم متحرک می‌تواند با سرعت ثابت در خط راست حرکت کند."}, {"t": "۳) قانون اول نیوتن", "p": "جسم حالت سکون یا حرکت یکنواخت روی خط راست خود را حفظ می‌کند مگر اینکه نیروی خالصی باعث تغییر آن شود. این ویژگی به مفهوم لَختی مربوط است."}, {"t": "۴) قانون دوم نیوتن", "p": "رابطه F = ma بیان می‌کند که شتاب جسم با نیروی خالص رابطه مستقیم و با جرم، در نیروی یکسان، رابطه معکوس دارد. واحد نیرو نیوتن است."}, {"t": "۵) قانون سوم نیوتن", "p": "هرگاه جسمی به جسم دیگر نیرو وارد کند، جسم دوم نیز نیرویی هم‌اندازه و خلاف جهت بر جسم اول وارد می‌کند. این دو نیرو بر دو جسم متفاوت وارد می‌شوند؛ بنابراین همدیگر را روی یک جسم خنثی نمی‌کنند."}, {"t": "۶) اصطکاک", "p": "اصطکاک نیرویی است که در برابر حرکت نسبی یا تمایل به حرکت دو سطح در تماس مقاومت می‌کند. اصطکاک ایستایی پیش از شروع لغزش و اصطکاک جنبشی هنگام لغزش اهمیت دارد."}, {"t": "۷) کاربرد اصطکاک", "p": "گاهی اصطکاک مفید است، مثل راه رفتن و ترمز گرفتن؛ گاهی مزاحم است، مثل کاهش انرژی در ماشین‌ها. می‌توان با تغییر جنس یا زبری سطح، مقدار اصطکاک را تغییر داد."}], "tip": "قانون‌های نیوتن، نیروی خالص، تفاوت نیروهای متوازن و نامتوازن، F=ma و اصطکاک از مهم‌ترین بخش‌های این فصل‌اند.", "mistake": "", "qa": [{"q": "چه زمانی نیروی خالص صفر است؟", "a": "وقتی مجموع برداری نیروهای وارد بر جسم صفر باشد."}, {"q": "قانون اول نیوتن چه می‌گوید؟", "a": "جسم حالت سکون یا حرکت یکنواخت خط راست را حفظ می‌کند مگر اینکه نیروی خالصی آن را تغییر دهد."}, {"q": "در قانون سوم نیوتن نیروهای کنش و واکنش بر یک جسم وارد می‌شوند؟", "a": "خیر، بر دو جسم متفاوت وارد می‌شوند."}, {"q": "اگر جرم ثابت باشد و نیرو بیشتر شود چه اتفاقی برای شتاب می‌افتد؟", "a": "شتاب بیشتر می‌شود."}, {"q": "دو کاربرد مفید اصطکاک را نام ببر.", "a": "راه رفتن و ترمز خودرو."}]}, {"id": 6, "title": "زمین‌ساخت ورقه‌ای", "icon": "⊕", "quick": [{"t": "پانگه‌آ و وگنر", "p": "در گذشته قاره‌ها در قالب ابرقاره پانگه‌آ در کنار هم بوده‌اند. وگنر با شواهدی مانند جورشدن شکل قاره‌ها، فسیل‌های مشابه و شواهد سنگ‌شناسی و اقلیمی، جابه‌جایی قاره‌ها را مطرح کرد."}, {"t": "ورقه‌های زمین", "p": "سنگ‌کره زمین به ورقه‌هایی تقسیم شده که نسبت به هم حرکت می‌کنند."}, {"t": "مرز واگرا", "p": "ورقه‌ها از هم دور می‌شوند."}, {"t": "مرز همگرا", "p": "ورقه‌ها به سوی هم حرکت می‌کنند."}, {"t": "مرز امتدادلغز", "p": "ورقه‌ها در کنار هم می‌لغزند."}, {"t": "پیامدها", "p": "زمین‌لرزه، آتشفشان، گسل، چین‌خوردگی و تشکیل برخی رشته‌کوه‌ها با حرکت ورقه‌ها ارتباط دارند. سونامی نیز می‌تواند در اثر جابه‌جایی ناگهانی بستر دریا ایجاد شود."}], "quickTip": "سه نوع حرکت ورقه‌ها، شواهد وگنر و پیامدهای حرکت ورقه‌ای را دقیق مقایسه کن.", "jozve": [{"t": "۱) ایده جابه‌جایی قاره‌ها", "p": "شکل برخی قاره‌ها به‌گونه‌ای است که می‌توان شباهت لبه‌های آنها را مشاهده کرد. وگنر با مجموعه‌ای از شواهد پیشنهاد کرد قاره‌ها در گذشته کنار هم بوده‌اند."}, {"t": "۲) پانگه‌آ", "p": "ابر‌قاره‌ای که قاره‌های امروزی در گذشته دور در کنار یکدیگر تشکیل می‌دادند پانگه‌آ نامیده شد."}, {"t": "۳) شواهد وگنر", "p": "جورشدن برخی سواحل، پیدا شدن فسیل‌های مشابه در قاره‌های جدا از هم، شباهت برخی سنگ‌ها و ساختارهای زمین‌شناسی و شواهد اقلیمی از جمله شواهد مطرح‌شده بودند."}, {"t": "۴) زمین‌ساخت ورقه‌ای", "p": "سنگ‌کره زمین یکپارچه نیست و به ورقه‌هایی تقسیم شده که نسبت به هم حرکت می‌کنند. این دیدگاه سازوکار مناسب‌تری برای توضیح بسیاری از پدیده‌های زمین‌شناسی فراهم می‌کند."}, {"t": "۵) انواع مرز ورقه‌ها", "p": "در مرز واگرا ورقه‌ها از هم دور می‌شوند؛ در مرز همگرا به سوی هم حرکت می‌کنند؛ در مرز امتدادلغز در کنار هم می‌لغزند."}, {"t": "۶) پیامدها", "p": "حرکت ورقه‌ها می‌تواند با ایجاد گسل‌ها، زمین‌لرزه‌ها، آتشفشان‌ها، چین‌خوردگی‌ها و تشکیل برخی کوه‌ها ارتباط داشته باشد. جابه‌جایی ناگهانی بستر دریا نیز می‌تواند به سونامی منجر شود."}], "tip": "نام پانگه‌آ، شواهد وگنر، سه نوع مرز ورقه‌ای و پیامدهای حرکت ورقه‌ها را با هم مقایسه کنید.", "mistake": "", "qa": [{"q": "پانگه‌آ چیست؟", "a": "ابر‌قاره‌ای فرض‌شده در گذشته زمین که قاره‌های امروزی در آن کنار هم قرار داشتند."}, {"q": "سه نوع حرکت نسبی ورقه‌ها چیست؟", "a": "واگرا، همگرا و امتدادلغز."}, {"q": "دو شاهد برای جابه‌جایی قاره‌ها بنویس.", "a": "فسیل‌های مشابه در قاره‌های جدا و شباهت برخی سنگ‌ها/ساختارهای زمین‌شناسی؛ جورشدن شکل قاره‌ها نیز شاهد مهمی است."}, {"q": "یکی از پیامدهای حرکت ورقه‌ها چیست؟", "a": "زمین‌لرزه، آتشفشان، گسل یا تشکیل برخی رشته‌کوه‌ها."}]}, {"id": 7, "title": "آثاری از گذشته زمین", "icon": "◔", "quick": [{ /* ---------- MCQ builder (from authored Q&A) ---------- */
const isYN = a => /^(بله|خیر)/.test(a);
const trimEnd = s => s.replace(/[\s.؛،]+$/,"");
const pool = D.chapters.flatMap(c => c.qa.filter(x=>!isYN(x.a)).map(x=>({cid:c.id,a:trimEnd(x.a)})));
function buildMcq(q, cid){
  if (q.opts) return {q:q.q, options:q.opts, answer:q.ans, explain:"پاسخ: "+q.a, cid};
  if (isYN(q.a)) return {q:q.q, options:["بله","خیر"], answer: q.a.startsWith("بله")?0:1, explain:"پاسخ: "+q.a, cid};
  const right = trimEnd(q.a);
  const cands = pool.filter(p => p.cid !== cid && p.a !== right).sort((x,y)=>Math.abs(x.a.length-right.length)-Math.abs(y.a.length-right.length)).slice(0,10);
  const picks = shuffle(cands).slice(0,3).map(p=>p.a);
  const opts = shuffle([right,...picks]);
  return {q:q.q, options:opts, answer:opts.indexOf(right), explain:"پاسخ: "+q.a, cid};
}
const mcqsOf = c => c.qa.map(x => buildMcq(x, c.id));

/* ---------- Per-chapter fact bank (for the 3 fixed chapter exams) ---------- */
function shorten(s, max){ max = max || 170; if (s.length <= max) return s; let cut = s.slice(0, max); const idx = cut.lastIndexOf("."); if (idx > 60) cut = cut.slice(0, idx+1); return cut.trim(); }
function chapterFacts(c){
  const items = [];
  c.quick.forEach(s => items.push({label:s.t, text:s.p}));
  c.jozve.forEach(s => items.push({label:s.t, text:s.p}));
  D.formulas.filter(f => f.ch === c.id).forEach(f => items.push({label:f.d, text:f.f, formula:true}));
  return items;
}
const FACTS_BY_CH = {}; D.chapters.forEach(c => FACTS_BY_CH[c.id] = chapterFacts(c));
const allFactsFlat = D.chapters.flatMap(c => FACTS_BY_CH[c.id].map(f => ({...f, cid:c.id})));
function mulberry32(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1 | seed); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
function seededShuffle(arr, seed){ const rnd = mulberry32(seed); const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
const FACT_TEMPLATES = ["کدام گزینه به‌درستی «%» را توضیح می‌دهد؟","کدام گزینه درباره «%» در این فصل درست است؟","کدام گزینه با «%» در این فصل مطابقت دارد؟"];
function factMcq(fact, cid, seed){
  const right = fact.formula ? fact.text : shorten(fact.text);
  const q = fact.formula ? `کدام رابطه به «${fact.label}» مربوط است؟` : FACT_TEMPLATES[seed % FACT_TEMPLATES.length].replace("%", fact.label);
  let cands = allFactsFlat.filter(f => f.cid !== cid && !!f.formula === !!fact.formula);
  cands = seededShuffle(cands, seed+7);
  const seen = new Set([right]); const opts = [right];
  for (const f of cands){ const t = f.formula ? f.text : shorten(f.text); if (seen.has(t)) continue; seen.add(t); opts.push(t); if (opts.length === 4) break; }
  while (opts.length < 4) opts.push(fact.formula ? "یک رابطهٔ نامرتبط" : "یک گزینهٔ نامرتبط با این فصل");
  const order = seededShuffle([0,1,2,3], seed+13);
  const options = order.map(i => opts[i]);
  return {q, options, answer: order.indexOf(0), explain: fact.formula ? ("رابطهٔ درست: " + right) : ("توضیح: " + right), cid};
}
function chapterExamVariant(c, variant){
  const seedBase = c.id*1000 + variant*37;
  let pool = [...mcqsOf(c), ...FACTS_BY_CH[c.id].map((f,i) => factMcq(f, c.id, seedBase+i))];
  const seen = new Set(); pool = pool.filter(x => { if (seen.has(x.q)) return false; seen.add(x.q); return true; });
  pool = seededShuffle(pool, seedBase);
  const chunk = Math.max(1, Math.floor(pool.length/3));
  const start = ((variant-1)*chunk) % pool.length;
  let items = pool.slice(start, start+10);
  if (items.length < 10 && pool.length) items = items.concat(pool.slice(0, 10-items.length));
  return items;
}

function toggleDone(id){ if (progress[id]) delete progress[id]; else progress[id] = Date.now(); store(PK, progress); updateProgress(); }

function shell(title, sub, body, eyebrow){
  return `<section class="section"><div class="section-head"><div><span class="eyebrow">${eyebrow||"علوم نهم"}</span><h2>${title}</h2><p class="muted">${sub||""}</p></div></div>${body}</section>`;
}
function chapterCards(){
  return D.chapters.map(c => `<a class="card chapter-card" href="#chapter/${c.id}"><span class="chapter-num">فصل ${fa(c.id)}${progress[c.id]?" • ✓ مطالعه‌شده":""}</span><span class="chapter-icon" aria-hidden="true">${c.icon}</span><h3>${esc(c.title)}</h3><p class="muted">${fa(c.quick.length+c.jozve.length)} بخش • ${fa(c.qa.length)} پرسش</p><div class="tags">${c.quick.slice(0,3).map(s=>`<span class="tag">${esc(s.t)}</span>`).join("")}</div></a>`).join("");
}
function home(){
  return `<div class="hero"><div class="hero-grid"><div><span class="eyebrow">جزوه کامل • آمادگی امتحان</span><h1>علوم نهم را<br><span>قدم‌به‌قدم یاد بگیر.</span></h1><p>مرور سریع، جزوه مفهومی، نکات امتحانی، پرسش و پاسخ و آزمون آنلاین؛ برای هر ۱۵ فصل علوم نهم، در یک‌جا.</p><div class="hero-actions"><a class="btn" href="#chapters">شروع یادگیری</a><a class="btn secondary" href="#exam">آزمون سریع</a></div></div><div class="progress-card"><div class="progress-ring"><div id="pct">۰٪</div></div><h3 style="text-align:center">پیشرفت یادگیری</h3><p class="muted" style="text-align:center">هر فصل را که کامل مطالعه کردی، آن را علامت بزن.</p></div></div></div>
<section class="section" id="chapters"><div class="section-head"><div><h2>فصل‌های کتاب</h2><p class="muted">فصل‌ها را مرحله‌به‌مرحله مرور کن و از هر فصل آزمون بگیر.</p></div></div><div class="grid">${chapterCards()}</div></section>
${shell("از کجا شروع کنم؟","اگر پایه‌ات ضعیف است، فصل‌ها را به ترتیب جلو برو؛ اگر به امتحان نزدیکی، از چک‌لیست شب امتحان شروع کن.",`<div class="stats"><div class="stat"><b>${fa(D.chapters.length)}</b> فصل</div><div class="stat"><b>${fa(totalSections)}</b> بخش آموزشی</div><div class="stat"><b>${fa(totalQ)}</b> پرسش تعاملی</div></div>`)}
${shell("امکانات سریع","هر چیزی که برای مرور و امتحان لازم داری.",`<div class="grid"><a class="card" href="#formulas"><h3>فرمول‌ها</h3><p class="muted">رابطه‌های کلیدی فصل‌های حرکت، نیرو، فشار و ماشین‌ها.</p></a><a class="card" href="#questions"><h3>پرسش و پاسخ</h3><p class="muted">همه پرسش‌های مهم فصل‌ها با پاسخ فوری.</p></a><a class="card" href="#exam"><h3>آزمون آنلاین</h3><p class="muted">نمره، درصد و بررسی پاسخ‌ها.</p></a><a class="card" href="#night"><h3>شب امتحان</h3><p class="muted">چک‌لیست نهایی مرور، قابل تیک‌زدن.</p></a></div>`)}`;
}
function secBlock(s){ return `<h4>${esc(s.t)}</h4><p>${esc(s.p)}</p>`; }
function chapter(id){
  const c = byId(id); if (!c) return notFound();
  const fs = D.formulas.filter(x => x.ch === c.id);
  const done = !!progress[c.id];
  const prev = byId(c.id-1), next = byId(c.id+1);
  const links = [["sec-quick","مرور سریع"],["sec-jozve","جزوه مفهومی"]];
  if (c.mistake) links.push(["sec-mistake","اشتباهات رایج"]);
  links.push(["sec-qa","پرسش و پاسخ"],["sec-end","جمع‌بندی و آزمون"]);
  const side = links.map(l => `<button class="link" data-scroll="${l[0]}">${l[1]}</button>`).join("");
  const quick = `<article class="card lesson" id="sec-quick"><span class="chapter-num">بخش ۱</span><h3>مرور سریع و مفاهیم کلیدی</h3>${fs.length?`<h4>فرمول‌ها و رابطه‌های مهم</h4>${fs.map(f=>`<div class="formula${/[آ-ی]/.test(f.f)?" rtl":""}">${esc(f.f)}</div><p class="muted" style="margin:-4px 0 8px">${esc(f.d)}</p>`).join("")}`:""}${c.quick.map(secBlock).join("")}${c.quickTip?`<div class="tip"><b>نکات امتحانی</b><p>${esc(c.quickTip)}</p></div>`:""}</article>`;
  const jozve = `<article class="card lesson" id="sec-jozve"><span class="chapter-num">بخش ۲</span><h3>جزوه مفهومی و امتحانی</h3>${c.jozve.map(secBlock).join("")}${c.tip?`<div class="tip"><b>نکات امتحانی</b><p>${esc(c.tip)}</p></div>`:""}</article>`;
  const mistake = c.mistake ? `<article class="card lesson" id="sec-mistake"><h3>اشتباهات رایج</h3><div class="warn"><p>${esc(c.mistake)}</p></div></article>` : "";
  const qa = `<article class="card lesson" id="sec-qa"><span class="chapter-num">بخش ۳</span><h3>سؤال‌های مهم این فصل</h3><p class="muted">اول خودت جواب بده، بعد پاسخ را ببین.</p>${c.qa.map((x,i)=>`<div class="qa-item"><h4>${fa(i+1)}. ${esc(x.q)}</h4><button class="btn secondary" data-reveal>نمایش پاسخ</button><div class="example" hidden><b>پاسخ:</b> ${esc(x.a)}</div></div>`).join("")}</article>`;
  const examCards = [1,2,3].map(v => `<a class="card exam-choice" href="#chapterexam/${c.id}/${v}"><span class="chapter-num">آزمون ${fa(v)}</span><h3>آزمون ${fa(v)}</h3><p class="muted">۱۰ سؤال چهارگزینه‌ای</p></a>`).join("");
  const end = `<div class="card lesson" id="sec-end"><h3>جمع‌بندی و آزمون فصل</h3><p>برای مرور سریع، فرمول‌ها و نکات امتحانی را یک‌بار دیگر بخوان، به پرسش‌ها جواب بده و سپس یکی از سه آزمون این فصل را بزن.</p><div class="grid">${examCards}</div><div class="toolbar"><button class="btn ${done?"secondary":""}" data-done="${c.id}">${done?"✓ فصل تکمیل شده":"علامت‌گذاری به‌عنوان مطالعه‌شده"}</button></div><div class="toolbar" style="margin-top:0">${prev?`<a class="btn secondary" href="#chapter/${prev.id}">‹ فصل ${fa(prev.id)}: ${esc(prev.title)}</a>`:""}${next?`<a class="btn secondary" href="#chapter/${next.id}">فصل ${fa(next.id)}: ${esc(next.title)} ›</a>`:""}</div></div>`;
  return `<section class="section"><div class="section-head"><div><span class="eyebrow">فصل ${fa(c.id)}</span><h2>${esc(c.title)}</h2><p class="muted">مرور سریع، جزوه مفهومی و پرسش‌های مهم همین فصل.</p></div><a class="btn" href="#chapterexams/${c.id}">آزمون فصل</a></div><div class="lesson-layout"><aside class="side card"><b>بخش‌های فصل</b>${side}<hr><a href="#chapters">همه فصل‌ها</a></aside><div>${quick}${jozve}${mistake}${qa}${end}</div></div></section>`;
}
function chapterExamsList(id){
  const c = byId(id); if (!c) return notFound();
  const levels = ["مرور پایه","سطح متوسط","جمع‌بندی نهایی"];
  const cards = [1,2,3].map(v => `<a class="card exam-choice" href="#chapterexam/${c.id}/${v}"><span class="chapter-num">آزمون ${fa(v)}</span><h3>آزمون ${fa(v)} — ${esc(c.title)}</h3><p class="muted">۱۰ سؤال چهارگزینه‌ای • ${levels[v-1]}</p></a>`).join("");
  return shell(`آزمون‌های فصل: ${c.title}`,`فصل ${fa(c.id)} — سه آزمون جداگانه برای مرور این فصل.`,`<div class="grid">${cards}</div><div class="card" style="margin-top:18px"><h3>محدودهٔ آزمون</h3><p>هر سه آزمون از مرور سریع، جزوهٔ مفهومی، فرمول‌ها و پرسش‌های همین فصل ساخته شده‌اند.</p><a class="btn secondary" href="#chapter/${c.id}">بازگشت به فصل</a></div>`,"آزمون فصل");
}
function chapterExam(id, variant){
  const c = byId(id); variant = Number(variant)||1; if (!c || variant<1 || variant>3) return notFound();
  const items = chapterExamVariant(c, variant); if (!items.length) return notFound();
  examState = {items, answers:{}, submitted:false, cid:c.id};
  return shell(`آزمون ${fa(variant)} — ${c.title}`,`فصل ${fa(c.id)} • ${fa(items.length)} سؤال`,`<div id="examBox" class="exam-area">${items.map((q,i)=>`<article class="card question-card"><span class="chapter-num">سؤال ${fa(i+1)}</span><h3>${esc(q.q)}</h3><div class="options">${q.options.map((o,j)=>`<button class="option" data-i="${i}" data-j="${j}">${esc(o)}</button>`).join("")}</div></article>`).join("")}<div class="toolbar"><button class="btn" data-submit>پایان آزمون</button><a class="btn secondary" href="#chapterexams/${c.id}">انتخاب آزمون دیگر</a></div></div>`,"آزمون فصل");
}
function formulas(){
  const rows = D.formulas.map(x => `<div class="card"><span class="chapter-num">فصل ${fa(x.ch)}: ${esc(byId(x.ch).title)}</span><div class="formula${/[آ-ی]/.test(x.f)?" rtl":""}">${esc(x.f)}</div><p class="muted">${esc(x.d)}</p></div>`).join("");
  return shell("فرمول‌ها و رابطه‌ها","مرور سریع رابطه‌های کلیدی کتاب؛ فقط حفظ نکن، معنی هر کمیت را هم بدان.",`<div class="grid">${rows}</div><div class="card" style="margin-top:18px"><h3>در حل مسئله یادت باشد</h3><p>در مسئله‌های حرکت، ابتدا واحدها را یکسان کن و مشخص کن سؤال تندی می‌خواهد یا سرعت، و مسافت می‌خواهد یا جابه‌جایی. برای تبدیل متر بر ثانیه به کیلومتر بر ساعت در ۳٫۶ ضرب کن و برای برعکسش تقسیم.</p></div>`);
}
function questionCard(m, i){
  return `<article class="card question-card" data-cid="${m.cid}" data-answer="${m.answer}" data-explain="${esc(m.explain)}"><span class="chapter-num">فصل ${fa(m.cid)}</span><h3>${fa(i+1)}. ${esc(m.q)}</h3><div class="options">${m.options.map((o,j)=>`<button class="option" data-j="${j}">${esc(o)}</button>`).join("")}</div><div class="result" hidden></div></article>`;
}
function allQuestions(){
  const items = D.chapters.flatMap(c => mcqsOf(c));
  return shell("پرسش و پاسخ","گزینه‌ات را انتخاب کن؛ بلافاصله درست یا نادرست بودنش را همراه با پاسخ می‌بینی.",`<div class="toolbar"><select class="select" id="qFilter" aria-label="فیلتر فصل"><option value="0">همه فصل‌ها</option>${D.chapters.map(c=>`<option value="${c.id}">فصل ${fa(c.id)} — ${esc(c.title)}</option>`).join("")}</select></div><div id="questionList">${items.map(questionCard).join("")}</div>`,"پرسش‌های مهم");
}
function exam(cid){
  cid = Number(cid)||0;
  let items = cid ? mcqsOf(byId(cid) || {qa:[]}) : D.chapters.flatMap(mcqsOf);
  if (!items.length) return notFound();
  items = shuffle(items).slice(0,10);
  examState = {items, answers:{}, submitted:false, cid};
  const picker = `<div class="toolbar"><select class="select" id="examPick" aria-label="انتخاب آزمون"><option value="0">آزمون ترکیبی همه فصل‌ها</option>${D.chapters.map(c=>`<option value="${c.id}" ${c.id===cid?"selected":""}>فصل ${fa(c.id)} — ${esc(c.title)}</option>`).join("")}</select></div>`;
  return shell(cid?`آزمون فصل ${fa(cid)}`:"آزمون ترکیبی علوم نهم",`${fa(items.length)} سؤال • گزینه انتخاب‌شده مشخص می‌شود و پس از پایان، بررسی تشریحی را می‌بینی.`,`${picker}<div id="examBox" class="exam-area">${items.map((q,i)=>`<article class="card question-card"><span class="chapter-num">سؤال ${fa(i+1)} • فصل ${fa(q.cid)}</span><h3>${esc(q.q)}</h3><div class="options">${q.options.map((o,j)=>`<button class="option" data-i="${i}" data-j="${j}">${esc(o)}</button>`).join("")}</div></article>`).join("")}<div class="toolbar"><button class="btn" data-submit>پایان آزمون</button></div></div>`,"آزمون آنلاین");
}
function submitExam(){
  if (examState.submitted) return; examState.submitted = true;
  let score = 0; examState.items.forEach((q,i)=>{ if (examState.answers[i] === q.answer) score++; });
  const n = examState.items.length, pct = Math.round(score/n*100);
  const details = examState.items.map((q,i)=>{
    const u = examState.answers[i];
    const st = u===undefined ? "بی‌پاسخ" : u===q.answer ? "درست" : "نادرست";
    return `<div class="card" style="margin-top:10px"><b>${fa(i+1)}. ${esc(q.q)}</b><p>وضعیت: <strong>${st}</strong></p><p>پاسخ صحیح: ${esc(q.options[q.answer])}</p>${u!==undefined&&u!==q.answer?`<p>پاسخ شما: ${esc(q.options[u])}</p>`:""}<p class="muted">${esc(q.explain)}</p></div>`;
  }).join("");
  document.getElementById("examBox").innerHTML = `<div class="card"><h2>نتیجه آزمون</h2><div class="stats"><div class="stat"><b>${fa(score)}/${fa(n)}</b> پاسخ درست</div><div class="stat"><b>${fa(pct)}٪</b> درصد</div><div class="stat"><b>${fa(n-score)}</b> نادرست/بی‌پاسخ</div></div></div><h3 style="margin-top:25px">بررسی تشریحی</h3>${details}<div class="toolbar"><button class="btn" data-newexam>آزمون جدید</button><button class="btn secondary" onclick="window.print()">چاپ نتیجه</button></div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}
function nightPage(){
  const items = D.night.map((t,i)=>`<label class="check-item ${night[i]?"done":""}"><input type="checkbox" data-night="${i}" ${night[i]?"checked":""}><span>${esc(t)}</span></label>`).join("");
  return shell("چک‌لیست نهایی شب امتحان","هر مورد را که مرور کردی تیک بزن؛ تیک‌ها در همین مرورگر ذخیره می‌شوند.",`${items}<div class="toolbar"><a class="btn" href="#exam">یک آزمون ترکیبی بده</a><button class="btn secondary" onclick="window.print()">چاپ / ذخیره PDF</button></div>`,"مرور نهایی");
}
const norm = s => s.replace(/ي/g,"ی").replace(/ك/g,"ک").replace(/\u200c/g," ").replace(/[۰-۹]/g,d=>FA.indexOf(d)).toLowerCase();
function searchPage(){
  return shell("جستجوی سریع","در عنوان فصل، جزوه، نکات و پرسش‌ها جستجو کن.",`<div class="searchbar"><input id="searchInput" type="search" placeholder="مثلاً: اصل پاسکال، فسیل شاخص، گشتاور، زایلم..." autocomplete="off"><button class="btn" data-search>جستجو</button></div><div id="searchResults" class="grid"></div>`);
}
function doSearch(){
  const raw = (document.getElementById("searchInput").value||"").trim(), q = norm(raw);
  const out = document.getElementById("searchResults");
  if (!q){ out.innerHTML = "<p class='muted'>عبارت جستجو را وارد کن.</p>"; return; }
  const res = [];
  const add = (c, label, text) => {
    const t = norm(text), k = t.indexOf(q); if (k < 0) return;
    const a = Math.max(0, k-50), snip = (a?"…":"") + text.slice(a, k+120) + (k+120<text.length?"…":"");
    res.push(`<a class="card" href="#chapter/${c.id}"><span class="chapter-num">فصل ${fa(c.id)} • ${label}</span><h3>${esc(c.title)}</h3><p class="muted">${esc(snip)}</p></a>`);
  };
  D.chapters.forEach(c => {
    add(c,"عنوان",c.title);
    c.quick.forEach(s => add(c,"مرور سریع: "+s.t, s.t+" — "+s.p));
    c.jozve.forEach(s => add(c,"جزوه: "+s.t, s.t+" — "+s.p));
    c.qa.forEach(x => add(c,"پرسش", x.q+" — "+x.a));
  });
  D.formulas.forEach(f => { const c = byId(f.ch); add(c,"فرمول", f.f+" — "+f.d); });
  out.innerHTML = res.length ? res.slice(0,30).join("") : "<p class='muted'>نتیجه‌ای پیدا نشد؛ عبارت دیگری را امتحان کن.</p>";
}
function about(){
  return shell("درباره سایت","یک فضای آموزشی ساده و کاربردی برای یادگیری و تمرین علوم نهم.",`<div class="card"><h3>سازنده سایت</h3><p><strong>این سایت توسط ماهان شریفی ساخته شده است.</strong></p><h3>هدف سایت</h3><p>دانش‌آموز نهم بتواند فصل‌های علوم را به ترتیب مرور کند، فرمول‌ها و نکات امتحانی را ببیند، به پرسش‌های مهم پاسخ بدهد و با آزمون‌های آنلاین هر فصل برای امتحان آماده شود.</p><h3>محتوا</h3><p>محتوای هر فصل شامل مرور سریع، جزوه مفهومی، نکات امتحانی و پرسش‌های مهم همان فصل است. هر فصل سه آزمون جداگانه دارد تا بتوانی چند بار خودت را بسنجی.</p><p class="muted">پیشرفت مطالعه و تیک‌های شب امتحان فقط در همین مرورگر ذخیره می‌شوند.</p></div>`);
}
function notFound(){ return shell("صفحه پیدا نشد","مسیر واردشده معتبر نیست.",`<a class="btn" href="#home">بازگشت به خانه</a>`); }

/* ---------- Router ---------- */
function render(){
  const h = (location.hash||"#home").slice(1), p = h.split("/");
  let html;
  switch (p[0]) {
    case "home": case "chapters": html = home(); break;
    case "chapter": html = chapter(p[1]); break;
    case "formulas": html = formulas(); break;
    case "questions": html = allQuestions(); break;
    case "exam": html = exam(p[1]); break;
    case "chapterexams": html = chapterExamsList(p[1]); break;
    case "chapterexam": html = chapterExam(p[1], p[2]); break;
    case "night": html = nightPage(); break;
    case "search": html = searchPage(); break;
    case "about": html = about(); break;
    default: html = notFound();
  }
  app.innerHTML = html;
  document.getElementById("topbar").classList.remove("open");
  document.querySelectorAll("#nav a").forEach(a => {
    const r = a.dataset.r, cur = (["chapter","chapterexams","chapterexam"].includes(p[0]) ? "chapters" : p[0]);
    if (r === cur) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
  updateProgress();
  if (p[0]==="chapters") { document.getElementById("chapters").scrollIntoView(); } else window.scrollTo(0,0);
  const f = document.getElementById("qFilter");
  if (f) f.onchange = () => document.querySelectorAll("#questionList .question-card").forEach(x => x.style.display = (f.value==="0" || x.dataset.cid===f.value) ? "" : "none");
  const ep = document.getElementById("examPick");
  if (ep) ep.onchange = () => { location.hash = ep.value==="0" ? "#exam" : "#exam/"+ep.value; };
  const si = document.getElementById("searchInput");
  if (si) { si.addEventListener("input", doSearch); si.addEventListener("keydown", e => { if (e.key==="Enter") doSearch(); }); si.focus({preventScroll:true}); }
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target;
  let el;
  if ((el = t.closest("[data-scroll]"))) { document.getElementById(el.dataset.scroll)?.scrollIntoView({behavior:"smooth"}); return; }
  if ((el = t.closest("[data-reveal]"))) { const box = el.nextElementSibling; box.hidden = !box.hidden; el.textContent = box.hidden ? "نمایش پاسخ" : "پنهان کردن پاسخ"; return; }
  if ((el = t.closest("[data-done]"))) { toggleDone(el.dataset.done); const on = !!progress[el.dataset.done]; el.textContent = on ? "✓ فصل تکمیل شده" : "علامت‌گذاری به‌عنوان مطالعه‌شده"; el.classList.toggle("secondary", on); return; }
  if ((el = t.closest("[data-submit]"))) { submitExam(); return; }
  if ((el = t.closest("[data-newexam]"))) { render(); return; }
  if ((el = t.closest("[data-search]"))) { doSearch(); return; }
  if ((el = t.closest(".option"))) {
    const card = el.closest(".question-card"), box = el.parentElement;
    if (el.dataset.i !== undefined) { // exam mode
      if (examState.submitted) return;
      examState.answers[el.dataset.i] = Number(el.dataset.j);
      [...box.children].forEach(x => x.classList.remove("selected")); el.classList.add("selected");
    } else if (card && card.dataset.answer !== undefined && !box.querySelector(":disabled")) { // practice mode
      const ans = Number(card.dataset.answer), ch = Number(el.dataset.j);
      [...box.children].forEach(x => x.disabled = true);
      box.children[ans].classList.add("correct");
      const r = card.querySelector(".result");
      if (ch !== ans) { el.classList.add("wrong"); r.textContent = "❌ پاسخ درست نیست. " + card.dataset.explain; }
      else r.textContent = "✅ درست! " + card.dataset.explain;
      r.hidden = false;
    }
  }
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-night]"); if (!el) return;
  if (el.checked) night[el.dataset.night] = 1; else delete night[el.dataset.night];
  store(NK, night); el.closest(".check-item").classList.toggle("done", el.checked);
});
const themeBtn = document.getElementById("themeBtn");
function setTheme(dark){ document.body.classList.toggle("dark", dark); themeBtn.textContent = dark ? "☀" : "☾"; }
let saved = null; try { saved = localStorage.getItem("olum9-theme"); } catch(e){}
setTheme(saved ? saved === "dark" : !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches));
themeBtn.onclick = () => { const d = !document.body.classList.contains("dark"); setTheme(d); try { localStorage.setItem("olum9-theme", d?"dark":"light"); } catch(e){} };
document.getElementById("menuBtn").onclick = () => document.getElementById("topbar").classList.toggle("open");
const toTop = document.getElementById("toTop");
window.addEventListener("scroll", () => toTop.classList.toggle("show", scrollY > 500));
toTop.onclick = () => scrollTo({top:0,behavior:"smooth"});
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
